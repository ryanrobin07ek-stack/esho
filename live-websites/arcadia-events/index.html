<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>arcadia-events</title>
  <link rel="stylesheet" href="./eshop-mobile.css?v=3" />
</head>
<body>
  <main class="shop-shell">
    <header class="brand-bar"><h1>arcadia-events</h1></header>
    <section class="featured-products">
      <div class="products-grid">
        <article class="product-card" data-product-id="p1">
          <img src="/images/demo-product.jpg" alt="Demo product" />
          <h2>Demo product</h2>
          <p class="price">KES 1,200</p>
        </article>
        <article class="product-card" data-product-id="p2">
          <img src="/images/demo-product-2.jpg" alt="Demo product 2" />
          <h2>Demo product 2</h2>
          <p class="price">KES 1,800</p>
        </article>
      </div>
    </section>
    <section class="category-grid">
      <div class="category-list">
        <span class="category-pill">General</span>
        <span class="category-pill">Featured</span>
      </div>
    </section>
  </main>
</body>
</html>
