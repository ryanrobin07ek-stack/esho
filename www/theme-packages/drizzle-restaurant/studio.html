  "fullscreen-image"(p) {
    const media = p.media
      ? `<img src="${esc(p.media)}" alt="" style="position:absolute;inset:0;width:100%;height:100%;object-fit:${esc(p.fit || "cover")}">`
      : art(16, "fs", 1);
    return `<div class="fsmedia" style="background:${esc(p.bg || "#541727")}">
      ${media}
      ${p.heading || p.body ? `<div class="fsmedia__ov"><div class="wrap" style="padding:0">
        ${p.heading ? `<h2 style="color:#fff;text-shadow:0 2px 18px rgba(0,0,0,.5)">${esc(p.heading)}</h2>` : ""}
        ${p.body ? `<p style="color:#fff;text-shadow:0 2px 18px rgba(0,0,0,.5)">${esc(p.body)}</p>` : ""}
      </div></div>` : ""}
    </div>`;
  },
  "diagonal-swiper"(p) {
    const items = productSource(p).slice(0, 12);
    if (!items.length) return emptyRow(p.title);
    return `<div class="diag" data-diag
      data-angle="${esc(p.angle || "-6")}"
      data-dir="${esc(p.direction || "slash")}"
      data-autoplay="${p.autoplay ? 1 : 0}"
      data-speed="${clamp(Number(p.speed) || 4200, 1500, 12000)}"
      data-loop="${p.loop ? 1 : 0}"
      style="--angle:${esc(p.angle || "-6")}deg">
      <div class="wrap">
        <div class="sec-head">
          <h2 style="margin:0">${esc(p.title || "Featured")}</h2>
          ${p.showCount ? `<span class="diag__count" data-diag-count>01 / ${String(items.length).padStart(2, "0")}</span>` : ""}
        </div>
        <div class="diag__stage" data-diag-stage tabindex="0" role="group"
             aria-roledescription="carousel" aria-label="${esc(p.title || "Featured products")}">
          <div class="diag__deco" aria-hidden="true"></div>
          ${items.map((x, i) => `
            <div class="diag__slide" data-i="${i}" aria-hidden="${i ? "true" : "false"}">
              <a class="diag__card" href="#/p/${esc(x.slug)}">
                <div class="diag__media">${x.media
                  ? `<img src="${esc(x.media)}" alt="${esc(x.name)}" loading="lazy">`
                  : art(x.hue, x.id, x.art && x.art.shape)}</div>
                <div class="diag__body">
                  <p class="pcard__cat">${esc(catName((x.categoryIds || [])[0]))}</p>
                  <h3 style="margin:2px 0 4px;font-size:1.12rem">${esc(x.name)}</h3>
                  <div class="pcard__price">${x.salePrice
                    ? `<ins>${money(x.salePrice)}</ins><s>${money(x.price)}</s>`
                    : money(x.price)}</div>
                </div>
              </a>
            </div>`).join("")}
        </div>
        ${p.showCtrls ? `<div class="diag__ctrls">
          <button type="button" data-diag-prev aria-label="Previous product">‹</button>
          <button type="button" data-diag-next aria-label="Next product">›</button>
          ${p.autoplay ? `<button type="button" data-diag-pause aria-label="Pause">❚❚</button>` : ""}
        </div>` : ""}
      </div></div>`;
  },
  "category-circles"(p) {
    const list = PUB.categories
      .filter(c => c.published && (p.source === "all" || !c.parentId))
      .slice(0, clamp(Number(p.limit) || 8, 1, 20));
    if (!list.length) return "";
    return `<div class="wrap">
      <div class="sec-head"><h2 style="margin:0">${esc(p.title || "Browse")}</h2></div>
      <div class="circles" style="--cs:${clamp(Number(p.size) || 104, 72, 160)}px">
        ${list.map(c => `<a class="circle" href="#/c/${esc(c.slug)}">
          <span class="circle__disc">${c.media
            ? `<img src="${esc(c.media)}" alt="">`
            : art(c.hue, c.id, 0)}</span>
          <span class="circle__label">${esc(c.name)}</span></a>`).join("")}
      </div></div>`;
  },
  "tall-cards"(p) {
    const cards = Array.isArray(p.cards) ? p.cards : [];
    if (!cards.length) return "";
    return `<div class="wrap"><div class="talls">
      ${cards.map(c => {
        const cls = `tall ${c.width === "full" ? "tall--full" : ""} ${c.tone === "text" ? "tall--text" : ""}`;
        const artHtml = c.tone === "text" ? ""
          : `<div class="tall__art">${c.media
              ? `<img src="${esc(c.media)}" alt="">`
              : art(c.hue || 340, c.id, 1)}</div>`;
        const inner = `${artHtml}<div class="tall__ov">
          ${c.eyebrow ? `<p class="eyebrow" style="color:${c.tone === "text" ? "rgba(255,255,255,.75)" : "var(--wine)"}">${esc(c.eyebrow)}</p>` : ""}
          <h3>${esc(c.heading || "")}</h3>
          ${c.body ? `<p style="max-width:40ch">${esc(c.body)}</p>` : ""}
          ${c.ctaLabel ? `<span class="btn btn--sm ${c.tone === "text" ? "btn--light" : ""}">${esc(c.ctaLabel)}</span>` : ""}
        </div>`;
        return c.ctaHref ? `<a class="${cls}" href="${esc(c.ctaHref)}">${inner}</a>`
                         : `<div class="${cls}">${inner}</div>`;
      }).join("")}
    </div></div>`;
  },
  "cta-pills"(p) {
    return `<div class="wrap"><div class="cta-row">
      <a class="pill" href="#/products">${esc(p.productLabel || "All Products")}</a>
      <a class="pill pill--alt" href="#/categories">${esc(p.categoryLabel || "All Categories")}</a>
    </div></div>`;
  },
  "map"(p) {
    if (!p.show) return "";
    const lat = Number(p.lat) || 51.5265;
    const lon = Number(p.lon) || -0.0813;
    const d   = Number(p.zoom) || 0.006;
    const bbox = [lon - d, lat - d / 2, lon + d, lat + d / 2].map(n => n.toFixed(5)).join("%2C");
    return `<div class="wrap">
      <div class="sec-head"><div>
        <h2 style="margin:0">${esc(p.title || "Find us")}</h2>
        ${p.body ? `<p class="lead" style="margin:6px 0 0">${esc(p.body)}</p>` : ""}
      </div>
      <a class="btn btn--ghost btn--sm" target="_blank" rel="noopener"
         href="https://www.openstreetmap.org/?mlat=${lat}&mlon=${lon}#map=17/${lat}/${lon}">Directions</a></div>
      <div class="map">
        <iframe title="Map showing ${esc(p.title || "our location")}" loading="lazy"
          src="https://www.openstreetmap.org/export/embed.html?bbox=${bbox}&layer=mapnik&marker=${lat}%2C${lon}"></iframe>
        <p class="map__foot">${p.address ? esc(p.address) + " · " : ""}Map data ©
          <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a> contributors</p>
      </div></div>`;
  },
  "rich-text"(p) {
    return `<div class="wrap prose"><h2>${esc(p.heading || "")}</h2>${p.html || ""}</div>`;
  }
};

/* helpers */
function split(p) {
  const media = p.media
    ? `<img src="${esc(p.media)}" alt="" style="width:100%;height:100%;object-fit:cover">`
    : art(20 + (hash(p.heading || "s") % 60), p.heading || "split", 0);
  const cls = p.arrangement === "img-right" ? "split--img-right"
            : p.arrangement === "img-top"   ? ""
            : "split--img-left";
  return `<div class="wrap"><div class="split ${cls}" style="--ar:${esc(p.ar || "4/3")}">
    <div class="split__media">${media}</div>
    <div class="split__body">
      ${p.eyebrow ? `<p class="eyebrow" style="margin:0">${esc(p.eyebrow)}</p>` : ""}
      <h2 style="margin:0">${esc(p.heading || "")}</h2>
      ${p.body ? `<p class="lead" style="margin:0">${esc(p.body)}</p>` : ""}
      ${p.ctaLabel ? `<p style="margin:14px 0 0"><a class="btn" href="${esc(p.ctaHref || "#/products")}">${esc(p.ctaLabel)}</a></p>` : ""}
    </div></div></div>`;
}
function emptyRow(title) {
  return `<div class="wrap"><h2>${esc(title || "")}</h2><p class="empty">No content in this source yet.</p></div>`;
}
function catName(id) {
  const c = PUB.categories.find(x => x.id === id);
  return c ? c.name : "";
}
function productSource(p) {
  const all = PUB.products.filter(x => x.published);
  if (p.categoryId) return all.filter(x => (x.categoryIds || []).includes(p.categoryId));
  return all;
}
function sortProducts(list, mode) {
  const c = [...list];
  if (mode === "price-asc")  c.sort((a, b) => (a.salePrice ?? a.price) - (b.salePrice ?? b.price));
  else if (mode === "price-desc") c.sort((a, b) => (b.salePrice ?? b.price) - (a.salePrice ?? a.price));
  else if (mode === "name") c.sort((a, b) => a.name.localeCompare(b.name));
  else c.sort((a, b) => (a.position || 0) - (b.position || 0) || a.name.localeCompare(b.name));
  return c;
}
function card(p, opts = {}) {
  const cat = catName((p.categoryIds || [])[0]);
  const media = p.media
    ? `<img src="${esc(p.media)}" alt="${esc(p.name)}" loading="lazy">`
    : art(p.hue, p.id, p.art && p.art.shape);
  const price = p.salePrice
    ? `<span class="pcard__price"><ins>${money(p.salePrice)}</ins><s>${money(p.price)}</s></span>`
    : `<span class="pcard__price">${money(p.price)}</span>`;
  const swatches = Array.isArray(p.colors) && p.colors.length > 1
    ? `<span class="pcard__swatch">${p.colors.slice(0, 4).map(c => `<span style="background:${esc(c.hex)}"></span>`).join("")}</span>` : "";
  return `<a class="pcard" href="#/p/${esc(p.slug)}" style="--par:${esc(opts.par || "1/1")}">
    <div class="pcard__media">${media}${p.badge ? `<span class="badge">${esc(p.badge)}</span>` : ""}${swatches}</div>
    <div class="pcard__body">
      ${opts.showCat && cat ? `<span class="pcard__cat">${esc(cat)}</span>` : ""}
      <h3 class="pcard__name">${esc(p.name)}</h3>
      ${price}
    </div></a>`;
}

function renderSection(s, force) {
  if (!s.visible && !force) return "";
  const fn = SEC[s.type];
  if (!fn) return `<section class="sec"><div class="wrap"><p class="empty">Unknown section: ${esc(s.type)}</p></div></section>`;
  const tight = ["hero-image","promo-fullscreen","fullscreen-image","ticker","cta-pills","announce"].includes(s.type);
  return `<section class="sec${tight ? " sec--tight" : ""}" data-sec="${s.id}" data-type="${s.type}">${fn(s.props || {}, s.id)}</section>`;
}

/* =========================================================================
   SCREENS
   ========================================================================= */
function screenHome() {
  const page = PUB.pages.find(p => p.type === "home");
  const secs = PUB.sections.filter(s => s.pageId === page.id && s.visible)
    .sort((a, b) => a.position - b.position);
  return secs.map(s => renderSection(s)).join("");
}
function screenCategory(slug) {
  const c = PUB.categories.find(x => x.slug === slug && x.published);
  if (!c) return screenNotFound("Category not found");
  const subs = PUB.categories.filter(x => x.parentId === c.id && x.published)
    .sort((a, b) => a.position - b.position);
  const items = PUB.products.filter(p => p.published && (p.categoryIds || []).includes(c.id));
  const media = c.media
    ? `<img src="${esc(c.media)}" alt="" style="width:100%;height:100%;object-fit:cover">`
    : art(c.hue, c.id, 1);
  return `<div class="wrap bar"><a class="bar__back" href="#/">‹ Home</a></div>
    <div class="wrap">
      <div class="tai__media" style="--ar:21/9;max-height:260px;margin-bottom:18px">${media}</div>
      <h1>${esc(c.name)}</h1>
      ${c.description ? `<p class="lead">${esc(c.description)}</p>` : ""}
    </div>
    ${subs.length ? `<div class="wrap"><div class="chips" role="tablist" aria-label="Subcategories">
      <a class="chip" href="#/c/${esc(c.slug)}" aria-current="true">All ${esc(c.name)}</a>
      ${subs.map(s => `<a class="chip" href="#/c/${esc(s.slug)}">${esc(s.name)}</a>`).join("")}
    </div></div>` : ""}
    <div class="wrap">
      ${items.length
        ? `<div class="pgrid" style="--cols:2;--cols-sm:3;--cols-lg:4">
            ${sortProducts(items, "position").map(p => card(p)).join("")}</div>`
        : `<div class="empty"><p>${esc(T("emptyCategory"))}</p></div>`}
    </div>`;
}
function screenAllProducts() {
  const cats = PUB.categories.filter(c => c.published && !c.parentId);
  const all = PUB.products.filter(p => p.published);
  return `<div class="wrap bar"><a class="bar__back" href="#/">‹ Home</a></div>
    <div class="wrap"><h1>All Products</h1><p class="lead">${all.length} products</p></div>
    <div class="wrap">
      <div class="chips" role="tablist" aria-label="Filter by category">
        <a class="chip" href="#/products" aria-current="true">All</a>
        ${cats.map(c => `<a class="chip" href="#/c/${esc(c.slug)}">${esc(c.name)}</a>`).join("")}
      </div>
      <div class="toolbar">
        <label class="sr-only" for="apSearch">Search products</label>
        <input type="search" id="apSearch" placeholder="Search products…" autocomplete="off">
        <label class="sr-only" for="apSort">Sort</label>
        <select id="apSort">
          <option value="position">Sort: Featured</option>
          <option value="price-asc">Price: low to high</option>
          <option value="price-desc">Price: high to low</option>
          <option value="name">Name A–Z</option>
        </select>
      </div>
      <div id="apResults">${gridHTML(all, "position")}</div>
    </div>`;
}
function gridHTML(list, sort) {
  if (!list.length) return `<div class="empty"><p>No products match.</p></div>`;
  return `<div class="pgrid" style="--cols:2;--cols-sm:3;--cols-lg:4">
    ${sortProducts(list, sort).map(p => card(p)).join("")}</div>`;
}
function screenAllCategories() {
  const cats = PUB.categories.filter(c => c.published);
  return `<div class="wrap bar"><a class="bar__back" href="#/">‹ Home</a></div>
    <div class="wrap"><h1>All Categories</h1></div>
    <div class="wrap"><div class="circles" style="--cs:112px">
      ${cats.map(c => `<a class="circle" href="#/c/${esc(c.slug)}">
        <span class="circle__disc">${c.media
          ? `<img src="${esc(c.media)}" alt="">`
          : art(c.hue, c.id, 0)}</span>
        <span class="circle__label">${esc(c.name)}</span></a>`).join("")}
    </div></div>`;
}
function screenProduct(slug) {
  const p = PUB.products.find(x => x.slug === slug && x.published);
  if (!p) return screenNotFound("Product not found");
  const cats = (p.categoryIds || []).map(catName).filter(Boolean).join(" · ");
  const colors = Array.isArray(p.colors) ? p.colors : [];
  const sizes = Array.isArray(p.sizes) ? p.sizes : [];
  const firstColor = colors[0];
  const hue = firstColor ? firstColor.hue : p.hue;
  const media = p.media
    ? `<img src="${esc(p.media)}" alt="${esc(p.name)}" style="width:100%;height:100%;object-fit:cover" data-pdp-media>`
    : `<div data-pdp-art>${art(hue, p.id, p.art && p.art.shape)}</div>`;
  const related = PUB.products.filter(x => x.published && x.id !== p.id &&
    (x.categoryIds || []).some(id => (p.categoryIds || []).includes(id))).slice(0, 4);
  return `<div class="wrap bar"><a class="bar__back" href="#/products">‹ All products</a></div>
    <div class="wrap"><div class="pdp">
      <div class="pdp__media" data-pdp-media-wrap>${media}</div>
      <div class="pdp__body">
        <p class="pcard__cat">${esc(cats)}</p>
        <h1 style="margin:0">${esc(p.name)}</h1>
        <div class="pdp__price">
          ${p.salePrice
            ? `<ins>${money(p.salePrice)}</ins><s>${money(p.price)}</s>`
            : money(p.price)}
        </div>
        <p class="lead">${esc(p.description || "")}</p>
        <p style="font-size:.82rem;color:var(--muted)">
          ${p.stock > 0 ? `${p.stock} in stock` : "Out of stock"}</p>

        ${colors.length ? `<div class="opt">
          <span class="opt__label">${esc(T("colour"))}</span>
          <div class="opt__swatches" role="group" aria-label="Colour options">
            ${colors.map((c, i) => `<button type="button" class="opt__swatch" aria-pressed="${i === 0}"

function screenPage(slug) {
  const pg = PUB.pages.find(x => x.slug === slug && x.published && x.type === "custom");
  if (!pg) return screenNotFound("Page not found");
  const body = String(pg.body || "").split(/\n{2,}/)
    .map(p => `<p>${esc(p).replace(/\n/g, "<br>")}</p>`).join("");
  return `<div class="wrap bar"><a class="bar__back" href="#/">‹ Home</a></div>
    <div class="wrap prose"><h1>${esc(pg.title)}</h1>${body}</div>`;

function screenNotFound(msg) {

function renderFooter() {
  const linkHref = l =>
    l.type === "page"     ? `#/p/${l.target}` :
    l.type === "category" ? `#/c/${l.target}` :
    l.type === "screen"   ? `#/${l.target}` : l.target;
  const groups = [...PUB.footerGroups].sort((a, b) => a.position - b.position);
  const groupHTML = groups.map(g => {
    const links = (g.links || []).filter(l => l.visible).sort((a, b) => a.position - b.position);
    const items = links.map(l => `<li><a href="${esc(linkHref(l))}">${esc(l.label)}</a></li>`).join("");
    return `<div>
      <h3 class="ftr__head">${esc(g.title)}</h3>
      <details class="ftr__acc"><summary>${esc(g.title)}</summary><ul>${items}</ul></details>
      <ul class="ftr__desk">${items}</ul>

  return `<div class="wrap">

        <p style="max-width:30ch;color:rgba(246,234,220,.7)">${esc(PUB.settings.tagline)}</p>
        <p style="font-size:.88rem">

/* =========================================================================

   ========================================================================= */
const Motion = {
  stops: [],
  clear() { this.stops.forEach(f => { try { f(); } catch (e) {} }); this.stops = []; },
  mount(root) {
    $$("[data-car]", root).forEach(el => autoCarousel(el));
    $$("[data-diag]", root).forEach(el => diagonal(el));
    $$("[data-tabs]", root).forEach(el => bindTabs(el));
    $$("[data-news]", root).forEach(el => bindNewsletter(el));
    $$("[data-vctl]", root).forEach(b => b.addEventListener("click", () => {
      const sec = b.closest(".vhero"); const v = sec && sec.querySelector("video");
      if (!v) return;
      if (b.dataset.vctl === "play") { v.paused ? v.play() : v.pause(); }
      else { v.muted = !v.muted; b.textContent = v.muted ? "Unmute" : "Mute"; }
    }));
    $$(".announce button", root).forEach(b => b.addEventListener("click", () => b.closest(".announce").remove()));
  }
};

function bindTabs(el) {
  const btns = $$("[data-tab]", el);
  const panels = $$("[data-panel]", el);
  btns.forEach(b => b.addEventListener("click", () => {
    btns.forEach(x => x.setAttribute("aria-selected", String(x === b)));
    panels.forEach(p => p.hidden = p.dataset.panel !== b.dataset.tab);
  }));
}

function bindNewsletter(el) {
  el.addEventListener("submit", e => {
    e.preventDefault();
    const inp = el.querySelector("input[type=email]");
    const msg = el.parentElement.querySelector("[data-news-msg]");
    if (inp.value) {
      msg.textContent = "Thanks — you're on the list (demo).";
      inp.value = "";
    }
  });
}

function autoCarousel(el) {
  const track = el.querySelector(".car__track");
  if (!track) return;
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const speed  = Number(el.dataset.speed) || 30;
  const dir    = el.dataset.dir === "right" ? 1 : -1;
  let offset = 0, half = 0, raf = null, last = 0, paused = el.dataset.autoplay !== "1";

  const measure = () => {
    half = track.scrollWidth / 2;
    if (dir === 1) offset = -half;
    apply();
  };
  const apply = () => { track.style.transform = `translate3d(${offset}px,0,0)`; };
  const step = ts => {
    raf = requestAnimationFrame(step);
    if (paused || reduce) { last = ts; return; }
    if (!last) last = ts;
    const dt = Math.min(64, ts - last); last = ts;
    offset += dir * (speed * dt / 1000);
    if (half > 0) {
      if (offset <= -half) offset += half;
      if (offset > 0)      offset -= half;
    }
    apply();
  };
  requestAnimationFrame(measure);
  if (!reduce) raf = requestAnimationFrame(step);
  const pauseBtn = el.closest(".wrap") && el.closest(".wrap").querySelector("[data-car-pause]");
  if (pauseBtn) pauseBtn.addEventListener("click", () => {
    paused = !paused;
    pauseBtn.textContent = paused ? "▶" : "❚❚";
  });
  if (el.dataset.pausehover === "1") {
    el.addEventListener("pointerenter", () => { paused = true; });
    el.addEventListener("pointerleave", () => { paused = false; });
  }
  const ro = new ResizeObserver(measure); ro.observe(track);
  Motion.stops.push(() => { cancelAnimationFrame(raf); ro.disconnect(); });
}

function diagonal(el) {
  const slides = $$(".diag__slide", el);
  if (!slides.length) return;
  const stage = el.querySelector("[data-diag-stage]");
  const counter = el.querySelector("[data-diag-count]");
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const angle = parseFloat(el.dataset.angle) || -6;
  const slash = el.dataset.dir !== "backslash";
  let i = 0, timer = null, paused = false;

  function place() {
    slides.forEach((s, n) => {
      const d = n - i;
      const off = clamp(d, -3, 3);
      const sign = slash ? 1 : -1;
      const tx = off * 46 * sign;
      const ty = off * -34;
      const rot = off * angle * 0.55;
      const sc = d === 0 ? 1 : 0.86;
      s.style.transform = `translate3d(${tx}px, ${ty}px, 0) rotate(${rot}deg) scale(${sc})`;
      s.style.opacity = d === 0 ? "1" : (Math.abs(d) <= 2 ? String(0.32 - Math.abs(d) * 0.1) : "0");
      s.style.zIndex = String(10 - Math.abs(off));
      s.style.pointerEvents = d === 0 ? "auto" : "none";
      s.setAttribute("aria-hidden", d === 0 ? "false" : "true");
    });
    if (counter) counter.textContent = String(i + 1).padStart(2, "0") + " / " + String(slides.length).padStart(2, "0");
  }
  function go(n) {
    const loop = el.dataset.loop === "1";
    i = loop ? (n + slides.length) % slides.length : clamp(n, 0, slides.length - 1);
    place();
  }
  place();
  const next = () => go(i + 1), prev = () => go(i - 1);
  const nextBtn = el.querySelector("[data-diag-next]");
  const prevBtn = el.querySelector("[data-diag-prev]");
  const pauseBtn = el.querySelector("[data-diag-pause]");
  if (nextBtn) nextBtn.addEventListener("click", next);
  if (prevBtn) prevBtn.addEventListener("click", prev);
  if (pauseBtn) pauseBtn.addEventListener("click", () => {
    paused = !paused;
    pauseBtn.textContent = paused ? "▶" : "❚❚";
  });
  let sx = 0, sy = 0, dragging = false, locked = null;
  const onDown = e => { dragging = true; locked = null; sx = e.clientX; sy = e.clientY; };
  const onMove = e => {
    if (!dragging) return;
    const dx = e.clientX - sx, dy = e.clientY - sy;
    if (locked === null && (Math.abs(dx) > 8 || Math.abs(dy) > 8)) {
      locked = Math.abs(dx) > Math.abs(dy) ? "x" : "y";
    }
  };
  const onUp = e => {
    if (!dragging) return; dragging = false;
    const dx = e.clientX - sx;
    if (locked === "x" && Math.abs(dx) > 40) (dx < 0 ? next() : prev());
    locked = null;
  };
  stage.addEventListener("pointerdown", onDown);
  stage.addEventListener("pointermove", onMove);
  stage.addEventListener("pointerup", onUp);
  stage.addEventListener("pointercancel", () => { dragging = false; });
  stage.addEventListener("keydown", e => {
    if (e.key === "ArrowRight") { e.preventDefault(); next(); }
    if (e.key === "ArrowLeft")  { e.preventDefault(); prev(); }
  });
  if (el.dataset.autoplay === "1" && !reduce) {
    const ms = Number(el.dataset.speed) || 4200;
    timer = setInterval(() => { if (!paused && !document.hidden) next(); }, ms);
  }
  Motion.stops.push(() => {
    clearInterval(timer);
    stage.removeEventListener("pointerdown", onDown);
    stage.removeEventListener("pointermove", onMove);
    stage.removeEventListener("pointerup", onUp);
  });
}

/* =========================================================================
   ROUTER
   ========================================================================= */
function parseHash() { return (location.hash.replace(/^#/, "") || "/").split("/").filter(Boolean); }

function route() {
  const parts = parseHash();
  const main = $("#main");
  Motion.clear();
  let html = "", title = "Storefront";
  if (!parts.length)                        { html = screenHome();                title = "Home"; }
  else if (parts[0] === "products")         { html = screenAllProducts();         title = "All Products"; }
  else if (parts[0] === "categories")       { html = screenAllCategories();       title = "All Categories"; }
  else if (parts[0] === "c" && parts[1])    { html = screenCategory(parts[1]);    title = parts[1]; }
  else if (parts[0] === "p" && parts[1])    { html = screenProduct(parts[1]);     title = parts[1]; }
  else if (parts[0] === "page" && parts[1]) { html = screenPage(parts[1]);        title = parts[1]; }
  else { html = screenNotFound(); title = "Not found"; }
  main.innerHTML = html;
  $("#siteFooter").innerHTML = renderFooter();
  document.title = `${PUB.settings.siteName} — ${title}`;
  bindStorefront(main);
  Motion.mount(main);
  window.scrollTo({ top: 0, behavior: "auto" });
}

function bindStorefront(main) {
  const search = $("#apSearch", main), sort = $("#apSort", main);
  if (search && sort) {
    const list = PUB.products.filter(p => p.published);
    const apply = debounce(() => {
      const q = search.value.trim().toLowerCase();
      const filtered = q ? list.filter(p => (p.name + " " + (p.description || "")).toLowerCase().includes(q)) : list;
      $("#apResults").innerHTML = gridHTML(filtered, sort.value);
    }, 150);
    search.addEventListener("input", apply);
    sort.addEventListener("change", apply);
  }
  // bundle add
  $$("[data-add-bundle]", main).forEach(b => b.addEventListener("click", () => {
    const sec = b.closest(".sec");
    const cell = b.closest(".bundle");
    const items = cell.querySelectorAll(".bundle__item");
    // fallback: just toast
    toast("Bundle added (demo)");
  }));
  // PDP bindings
  bindPDP(main);
}

function bindPDP(main) {
  const wrap = main.querySelector(".pdp");
  if (!wrap) return;
  const parts = parseHash();
  const p = PUB.products.find(x => x.slug === parts[1]);
  if (!p) return;
  const colors = Array.isArray(p.colors) ? p.colors : [];
  const sizes = Array.isArray(p.sizes) ? p.sizes : [];
  let selColorI = 0, selSizeI = sizes.length ? 0 : -1;

  const colorBtns = $$("[data-color-i]", wrap);
  const sizeBtns  = $$("[data-size-i]", wrap);
  const colorLabel = wrap.querySelector("[data-color-label]");
  const artWrap = wrap.querySelector("[data-pdp-media-wrap]");

  const updateArt = () => {
    if (!artWrap) return;
    const hue = colors[selColorI] ? colors[selColorI].hue : p.hue;
    const img = artWrap.querySelector("img");
    if (img && p.media) return; // real media stays
    artWrap.innerHTML = art(hue, p.id + ":" + selColorI, p.art && p.art.shape);
  };

  colorBtns.forEach(b => b.addEventListener("click", () => {
    selColorI = Number(b.dataset.colorI);
    colorBtns.forEach(x => x.setAttribute("aria-pressed", String(x === b)));
    if (colorLabel && colors[selColorI]) colorLabel.textContent = colors[selColorI].name;
    updateArt();
  }));
  sizeBtns.forEach(b => b.addEventListener("click", () => {
    selSizeI = Number(b.dataset.sizeI);
    sizeBtns.forEach(x => x.setAttribute("aria-pressed", String(x === b)));
  }));

  const qtyIn = wrap.querySelector("[data-pdp-qty]");
  wrap.querySelector("[data-pdp-inc]").addEventListener("click", () => qtyIn.value = Number(qtyIn.value) + 1);
  wrap.querySelector("[data-pdp-dec]").addEventListener("click", () => qtyIn.value = Math.max(1, Number(qtyIn.value) - 1));

  wrap.querySelector("[data-pdp-add]").addEventListener("click", () => {
    const colorName = colors[selColorI] ? colors[selColorI].name : "";
    const sizeName  = sizes[selSizeI]  || "";
    const variantLabel = [colorName, sizeName].filter(Boolean).join(" · ");
    addToCart(p, {
      qty: Number(qtyIn.value) || 1,
      variant: { colorI: selColorI, sizeI: selSizeI, hue: colors[selColorI] ? colors[selColorI].hue : p.hue },
      variantLabel,
      price: p.salePrice ?? p.price
    });
    openCart();
  });
  wrap.querySelector("[data-pdp-wish]").addEventListener("click", () => {
    toast("Added to wishlist (demo)");
  });
}

function uploadImage(file) {
  return new Promise((resolve, reject) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const max = 1400, r = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement("canvas");
      c.width = Math.round(img.width * r); c.height = Math.round(img.height * r);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      resolve(c.toDataURL("image/jpeg", 0.82));
    };
    img.onerror = () => reject(new Error("Couldn't read that image."));
    img.src = url;
  });
}

  renderTabs() {
    const tabs = [
      ["sections","Sections"], ["library","Library"],

      ["footer","Footer"], ["site","Site"], ["theme","Theme"], ["fonts","Fonts"], ["data","Data"]

      bar.innerHTML = tabs.map(([k, l]) =>

      bar.addEventListener("click", e => {
        const b = e.target.closest("button[data-tab]");
        if (b) this.selectTab(b.dataset.tab);
      });

    let active = null;
    bar.querySelectorAll("button[data-tab]").forEach(b => {
      const on = b.dataset.tab === this.tab;
      b.setAttribute("aria-selected", String(on));
      if (on) active = b;

      return `<div class="fld fld--row"><input type="checkbox" id="${id}" ${value ? "checked" : ""}>

      return `<div class="fld"><label for="${id}">${esc(f.l)}</label>

          `<option value="${esc(o)}" ${String(value) === String(o) ? "selected" : ""}>${esc(o)}</option>`).join("")}</select></div>`;
    }
    if (f.t === "catsource") {

      return `<div class="fld"><label for="${id}">${esc(f.l)}</label>

        <input type="number" id="${id}" step="${f.step || 1}" value="${esc(value ?? "")}"></div>`;

    const up = f.t === "url" && (f.k === "media" || f.k === "poster");

      ${up && value && value.startsWith("data:") ? `<img src="${esc(value)}" alt="" style="width:100%;max-height:140px;object-fit:cover;margin-bottom:6px">` : ""}

  },

  addSection() {
    const page = DRAFT.pages.find(p => p.type === "home");
    const list = SECTION_TYPES.map(([v, l]) => `• ${v} — ${l}`).join("\n");
    const input = window.prompt(
      "Enter the section type you want to add:\n\n" + list + "\n", "rich-text");
    if (!input) return;
    const type = SECTION_TYPES.find(([v]) => v === input.trim());
    if (!type) { alert("Unknown section type: " + input); return; }
    const sec = { id: uid("s"), pageId: page.id, type: type[0],
      position: DRAFT.sections.length, visible: 1, props: defaultProps(type[0]) };
    DRAFT.sections.push(sec);
    this.selectedSection = sec.id;
    dirty = true;
    this.render();
    this.autosave();
  },

  sectionAction(act, id) {
    const list = DRAFT.sections.filter(s => s.pageId === "pg_home").sort((a, b) => a.position - b.position);
    const s = DRAFT.sections.find(x => x.id === id);
    if (!s) return;
    if (act === "up" || act === "down") {
      const i = list.indexOf(s), j = act === "up" ? i - 1 : i + 1;
      if (j < 0 || j >= list.length) return;
      [list[i], list[j]] = [list[j], list[i]];
      list.forEach((x, n) => x.position = n);
    } else if (act === "vis")  { s.visible = s.visible ? 0 : 1; }
    else if (act === "dup")    {
      const c = clone(s); c.id = uid("s"); c.position = DRAFT.sections.length;
      DRAFT.sections.push(c); this.selectedSection = c.id;
    } else if (act === "del")  {
      if (!confirm("Delete this section?")) return;
      DRAFT.sections = DRAFT.sections.filter(x => x.id !== id);
    }
    DRAFT.sections.sort((a, b) => a.position - b.position).forEach((x, n) => x.position = n);
    dirty = true;
    this.render();
    this.autosave();
  },

  renderLibrary(list, insp) {
    const self = this;
    const library = DRAFT.library || {};
    const themes = library.extractedThemes || [];
    const featureNames = library.featureNames || [];
    const nativeTypes = Object.fromEntries(library.sectionTypeByFeature || []);
    const features = [];
    (library.featureMatrix || []).forEach((row, themeIndex) => {
      const theme = themes[themeIndex];
      if (!theme) return;
      for (let featureIndex = 0; featureIndex < row.length; featureIndex++) {
        const evidence = row[featureIndex];
        if (evidence === "0") continue;
        const name = featureNames[featureIndex];
        if (!name) continue;
        features.push({ name, themeFile: theme.file, themeTitle: theme.title,
          status: evidence === "1" ? "present" : "text-evidence",
          nativeType: nativeTypes[featureIndex] || "rich-text" });
      }
    });
    const sectionTemplates = features.filter(item => nativeTypes[featureNames.indexOf(item.name)])
      .map(item => ({ ...item, category: item.name, sourceTheme: item.themeFile,
        evidence: item.status, headings: (themes.find(theme => theme.file === item.themeFile) || {}).headings || [] }));
    const elements = themes.flatMap(theme => [
      ...(theme.classNames || []).map(name => ({ name, themeFile: theme.file, themeTitle: theme.title, kind: "class" })),
      ...(theme.ids || []).map(name => ({ name, themeFile: theme.file, themeTitle: theme.title, kind: "id" }))
    ]);
    const colors = (library.colorCatalog || []).map(([hex, count]) => ({ hex, count }));
    const catalogs = { sections: sectionTemplates, components: features, elements,
      themes, colors };
    const labels = { sections:"Sections", components:"Components", elements:"Elements", themes:"Themes", colors:"Colors" };
    if (!catalogs[this.libraryCategory]) this.libraryCategory = "sections";
    const category = this.libraryCategory;
    const items = catalogs[category];
    const PAGE = 60;
    let limit = PAGE, matches = [];
    const cache = Studio._libText || (Studio._libText = new WeakMap());
    const textOf = item => {
      let t = cache.get(item);
      if (t === undefined) {
        t = [item.name,item.title,item.file,item.themeTitle,item.themeFile,item.category,item.kind,item.hex,
          item.nativeType,item.description,(item.headings || []).join(" "),(item.classNames || []).join(" "),
          (item.ids || []).join(" "),(item.features || []).map(x => x.name).join(" ")].join(" ").toLowerCase();
        cache.set(item, t);
      }
      return t;
    };
    const rowLabel = item => category === "colors" ? item.hex : category === "themes" ? item.title : item.name || item.title || item.file || "Untitled";
    const rowMeta = item => category === "sections" ? `${item.category || "section"} · ${item.themeTitle || item.sourceTheme || ""}`
      : category === "components" ? `${item.status || "component"} · ${item.themeTitle || item.themeFile || ""}`
      : category === "elements" ? `${item.kind} · ${item.themeTitle || ""}`
      : category === "themes" ? `${item.category || "theme"} · ${(item.classNames || []).length} classes`
      : `${item.count || 0} occurrences`;

    list.innerHTML = `<div class="st__toolbar lib-bar">
      <div class="lib-kinds" role="group" aria-label="Library categories">${Object.entries(labels).map(([key,label]) =>
        `<button class="btn btn--sm ${key===category?"":"btn--ghost"}" type="button" data-library-kind="${key}" aria-pressed="${key===category}">${label} <span class="lib-n">${catalogs[key].length.toLocaleString()}</span></button>`).join("")}</div>
      <label class="sr-only" for="studioLibrarySearch">Search library</label>
      <input id="studioLibrarySearch" type="search" inputmode="search" enterkeyhint="search" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Search ${esc(labels[category].toLowerCase())}…" value="${esc(this.libraryQuery || "")}">
      <p class="mini lib-count" data-library-count></p>
    </div><div data-library-list></div>`;
    const box = list.querySelector("[data-library-list]");
    const count = list.querySelector("[data-library-count]");
    const search = list.querySelector("#studioLibrarySearch");

    const filter = () => {
      const q = (self.libraryQuery || "").trim().toLowerCase();
      matches = q ? items.filter(item => textOf(item).includes(q)) : items;
      if (!(self.librarySelection >= 0 && self.librarySelection < matches.length)) self.librarySelection = 0;
    };
    const rowHtml = (item, index) => {
      const swatch = category === "colors" ? `<span aria-hidden="true" style="width:20px;height:20px;flex:0 0 20px;border-radius:50%;background:${esc(item.hex)};border:1px solid var(--border)"></span>` : "";
      return `<button type="button" class="sitem lib-row" data-library-index="${index}" aria-current="${index === self.librarySelection}">${swatch}<span class="lib-row__txt"><span class="sitem__name" style="display:block">${esc(rowLabel(item))}</span><span class="sitem__type" style="display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(rowMeta(item))}</span></span></button>`;
    };
    const drawRows = () => {
      const shown = matches.slice(0, limit);
      box.innerHTML = shown.length
        ? shown.map(rowHtml).join("") + (matches.length > shown.length
            ? `<button type="button" class="btn btn--sm btn--ghost btn--block" data-library-more>Load more (${(matches.length - shown.length).toLocaleString()} remaining)</button>` : "")
        : `<p class="empty">No results found.</p>`;
      count.textContent = `${matches.length.toLocaleString()} results · extracted from ${library.extractionSummary?.themesScanned || 0} HTML files`;
    };
    const drawDetail = () => {
      const selected = matches[self.librarySelection] || null;
      const detail = selected ? (() => {
        const title = rowLabel(selected);
        const source = selected.themeTitle || selected.themeFile || selected.sourceTheme || "Extracted HTML theme";
        let facts = "", action = "";
        if (category === "themes") {
          const swatches = (selected.colors || []).slice(0,12).map(c => `<span title="${esc(c)}" style="display:inline-block;width:24px;height:24px;border-radius:50%;background:${esc(c)};border:1px solid var(--border);margin:3px"></span>`).join("");
          const palette = (DRAFT.palettes || []).find(p => p.sourceTheme === selected.file);
          facts = `<p>${esc(selected.description || "Extracted theme metadata")}</p><div style="margin:10px 0">${swatches}</div><p class="mini">${(selected.classNames || []).length} classes · ${(selected.ids || []).length} IDs · ${(selected.headings || []).length} headings · ${selected.formCount || 0} forms</p>`;
          if (palette) action = `<button type="button" class="btn btn--sm" data-library-apply-palette="${esc(palette.id)}">Apply theme palette</button>`;
        } else if (category === "colors") {
          facts = `<div style="display:flex;align-items:center;gap:12px"><span style="width:52px;height:52px;border-radius:14px;background:${esc(selected.hex)};border:1px solid var(--border)"></span><strong>${esc(selected.hex)}</strong></div><p class="mini">Seen ${selected.count} times across the extracted HTML source.</p>`;
          action = `<button type="button" class="btn btn--sm" data-library-apply-color="${esc(selected.hex)}">Apply as accent</button>`;
        } else if (category === "elements") {
          facts = `<p>Extracted ${esc(selected.kind)} token: <code>${esc(selected.name)}</code></p><p class="mini">Theme: ${esc(source)}</p>`;
        } else if (category === "components") {
          facts = `<p>Feature evidence: <strong>${esc(selected.status)}</strong></p><p class="mini">Native block: ${esc(selected.nativeType)} · source: ${esc(source)}</p>`;
          action = `<button type="button" class="btn btn--sm" data-library-add-section="${esc(selected.nativeType)}" data-library-title="${esc(selected.name)}">Add editable section</button>`;
        } else {
          const examples = (selected.headings || []).slice(0,8);
          facts = `<p>${esc(selected.evidence || "Reusable native section pattern")} · ${esc(selected.category || "section")}</p><p class="mini">Source: ${esc(source)}</p>${examples.length ? `<details><summary>Extracted screen content</summary><ul>${examples.map(x => `<li>${esc(x)}</li>`).join("")}</ul></details>` : ""}`;
          action = `<button type="button" class="btn btn--sm" data-library-add-section="${esc(selected.nativeType)}" data-library-title="${esc((selected.headings || [])[0] || selected.name)}">Add editable section</button>`;
        }
        return `<h3 style="margin-top:0">${esc(title)}</h3>${facts}<div class="btn-row">${action}</div>`;
      })() : `<p class="empty">No results found.</p>`;
      insp.innerHTML = `<button type="button" class="btn btn--sm btn--ghost lib-back" data-library-back>← Back to list</button><h3 style="margin-top:0">${esc(labels[category])}</h3><p class="mini">${matches.length.toLocaleString()} extracted entries. Select an item for details or an available studio action.</p>${detail}`;
    };

    filter(); drawRows(); drawDetail();

    list.onclick = event => {
      const kind = event.target.closest("[data-library-kind]");
      if (kind) {
        if (kind.dataset.libraryKind === category) return;
        self.libraryCategory = kind.dataset.libraryKind; self.librarySelection = 0;
        list.scrollTop = 0; self.renderLibrary(list, insp);
        return;
      }
      if (event.target.closest("[data-library-more]")) { limit += PAGE; drawRows(); return; }
      const row = event.target.closest("[data-library-index]");
      if (!row) return;
      self.librarySelection = Number(row.dataset.libraryIndex);
      box.querySelectorAll("[data-library-index]").forEach(r => r.setAttribute("aria-current", String(r === row)));
      drawDetail();
      insp.scrollTop = 0;
      if (self.isNarrow()) self.setView("insp");
    };
    insp.onclick = event => {
      if (event.target.closest("[data-library-back]")) { self.setView("list"); return; }
      const add = event.target.closest("[data-library-add-section]");
      if (add) { self.addLibrarySection(add.dataset.libraryAddSection, add.dataset.libraryTitle); return; }
      const pal = event.target.closest("[data-library-apply-palette]");
      if (pal) {
        const p = (DRAFT.palettes || []).find(x => x.id === pal.dataset.libraryApplyPalette);
        if (!p) return;
        Object.assign(DRAFT.theme.colors, p.colors); applyTheme(DRAFT.theme); dirty = true; self.autosave();
        toast("Theme palette applied");
        return;
      }
      const col = event.target.closest("[data-library-apply-color]");
      if (col) {
        const color = col.dataset.libraryApplyColor;
        if (!/^#[0-9a-f]{6}$/i.test(color)) { toast("Only 6-digit hex colours can be applied"); return; }
        DRAFT.theme.colors.wine = color; applyTheme(DRAFT.theme); dirty = true; self.autosave();
        toast("Accent colour applied");
      }
    };
    let timer;
    search.addEventListener("input", () => {
      clearTimeout(timer);
      timer = setTimeout(() => {
        self.libraryQuery = search.value; self.librarySelection = 0; limit = PAGE;
        filter(); drawRows(); drawDetail();
      }, 120);
    });
    search.addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); search.blur(); } });
  },

        else if (el.type === "number" || el.type === "range") v = el.value === "" ? "" : Number(el.value);

        const out = el.parentElement.querySelector(`[data-out="${el.id}"]`);
        if (out) out.textContent = v;

      el.addEventListener("input", handler);

function contrast(hex1, hex2) {
  const lum = h => {
    const m = h.replace("#", "");
    const v = [0, 2, 4].map(i => parseInt(m.substr(i, 2), 16) / 255)
      .map(c => c <= 0.03928 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4));
    return 0.2126 * v[0] + 0.7152 * v[1] + 0.0722 * v[2];
  };
  const a = lum(hex1 || "#000"), b = lum(hex2 || "#fff");
  return (Math.max(a, b) + 0.05) / (Math.min(a, b) + 0.05);
}
function downloadJSON(obj, name) {
  const blob = new Blob([JSON.stringify(obj, null, 2)], { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = name; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}
function validateImport(d) {
  if (!d || typeof d !== "object") return "Root must be an object.";
  if (!Array.isArray(d.sections)) return "Missing sections array.";
  if (!Array.isArray(d.products)) return "Missing products array.";
  if (!Array.isArray(d.categories)) return "Missing categories array.";
  if (!Array.isArray(d.pages)) return "Missing pages array.";
  if (!d.theme || !d.theme.colors) return "Missing theme.colors.";
  return null;
}

  };
  $("#btnMenu").addEventListener("click", openMenu);
  $("#btnCloseMenu").addEventListener("click", closeMenu);

    if (e.key === "Escape") {
      if ($("#searchModal").dataset.open === "true") { closeSearch(); return; }
      if ($("#cartDrawer").dataset.open === "true") { closeCart(); return; }
      if (drawer.dataset.open === "true") { closeMenu(); return; }
      if ($("#studio").dataset.open === "true") { Studio.close(); return; }
    }

  $("#btnStudio").addEventListener("click", () => Studio.open());
  $("#btnSearch").addEventListener("click", openSearch);

  $("#btnCartClose").addEventListener("click", closeCart);

  $("#backdrop").addEventListener("click", () => {

  });

  bindSearch();
  renderCartBadge();

  // install prompt
  (function () {
    let deferred = null;
    const name = () => (typeof PUB !== "undefined" && PUB && PUB.settings && PUB.settings.siteName) || "Maison Verre";
    const icon = (n) => {
      const c = document.createElement("canvas"); c.width = c.height = n;
      const g = c.getContext("2d");
      g.fillStyle = getComputedStyle(document.documentElement).getPropertyValue("--wine").trim() || "#76243A";
      g.fillRect(0, 0, n, n);
      g.fillStyle = "#FBF7F0"; g.font = "600 " + Math.round(n * .55) + "px Georgia,serif";
      g.textAlign = "center"; g.textBaseline = "middle";
      g.fillText(name().charAt(0).toUpperCase(), n / 2, n / 2 + n * .03);
      return c.toDataURL("image/png");
    };
    try {
      const m = {
        name: name(), short_name: name(), start_url: location.href.split("#")[0], scope: location.href.split("#")[0],
        display: "standalone", background_color: "#FBF7F0", theme_color: "#76243A",
        icons: [192, 512].map(n => ({ src: icon(n), sizes: n + "x" + n, type: "image/png", purpose: "any" }))
      };
      const l = document.createElement("link"); l.rel = "manifest";
      l.href = URL.createObjectURL(new Blob([JSON.stringify(m)], { type: "application/manifest+json" }));
      document.head.appendChild(l);
    } catch (e) {}
    window.addEventListener("beforeinstallprompt", e => { e.preventDefault(); deferred = e; });
    window.addEventListener("appinstalled", () => { deferred = null; });
    $("#stInstall").addEventListener("click", async () => {
      if (deferred) { deferred.prompt(); await deferred.userChoice; deferred = null; return; }
      const standalone = matchMedia("(display-mode: standalone)").matches || navigator.standalone;
      if (standalone) { alert("This site is already installed."); return; }
      if (/iphone|ipad|ipod/i.test(navigator.userAgent))
        alert("On iPhone/iPad: tap the Share button, then “Add to Home Screen”.");
      else
        alert("Install prompt isn't available right now. It needs Chrome, Edge or Samsung Internet on https (or localhost), and it won't appear if the site is already installed.");
    });
  })();

  // studio theme toggle
  (function () {
    const st = $("#studio"), b = $("#stTheme");
    const set = (m) => {
      const dark = m === "dark";
      st.dataset.theme = m;
      b.querySelector(".st__ico").textContent = dark ? "☀️" : "🌙";
      b.querySelector(".st__lbl").textContent = dark ? "Light" : "Dark";
      b.setAttribute("aria-label", dark ? "Switch Studio to light mode" : "Switch Studio to dark mode");
      b.setAttribute("aria-pressed", String(dark));
      try { localStorage.setItem("studioTheme", m); } catch (e) {}
    };
    let m = "light";
    try { m = localStorage.getItem("studioTheme") || "light"; } catch (e) {}
    set(m);
    b.addEventListener("click", () => set(st.dataset.theme === "dark" ? "light" : "dark"));
  })();

  $("#stExit").addEventListener("click", () => Studio.close());
  $("#stSave").addEventListener("click", () => Studio.save());
  $("#stReload").addEventListener("click", () => {
    if (!confirm("Discard unsaved edits and reload from browser storage?")) return;
    const stored = loadFromBrowser();
    if (stored) { PUB = stored.published; }
    DRAFT = clone(PUB);
    applyTheme(DRAFT.theme);
    dirty = false;
    Studio.render();
    Studio.setStatus("saved", "Reloaded");
  });
  $$(".st__views button").forEach(b => b.addEventListener("click", () => Studio.setView(b.dataset.view)));
  // keep the List / Preview / Edit buttons in sync when any tab switches view directly
  new MutationObserver(() => {
    const v = $("#stBody").dataset.view;
    $$(".st__views button").forEach(x => x.setAttribute("aria-pressed", String(x.dataset.view === v)));
  }).observe($("#stBody"), { attributes: true, attributeFilter: ["data-view"] });
  window.addEventListener("hashchange", () => {
    if ($("#studio").dataset.open === "true") return;
    route();
  });
}

/* =========================================================================
   LOAD / INIT
   ========================================================================= */
async function loadDataFile() {
  try {
    const r = await fetch("data.json", { cache: "no-cache" });
    if (!r.ok) throw new Error(r.status);
    const d = await r.json();
    if (!d || !d.settings) throw new Error("bad data.json");
    return d;
  } catch (e) {
    try { const el = document.getElementById("embeddedData"); if (el) return JSON.parse(el.textContent); } catch (e2) {}
    return null;
  }
}

function makeSeed() {
  // fallback if data.json is missing
  return {
    version: 2,
    settings: { siteName: "Maison Verre", tagline: "Objects made to be handled daily",
      email: "hello@maisonverre.example", phone: "+44 20 0000 0000", copyright: "© Maison Verre" },
    theme: { colors: PALETTES[16].colors, radius: 14,
      fonts: { head: FONTS[11].stack, body: FONTS[5].stack } },
    palettes: PALETTES.map(p => ({ id: p.id, name: p.name, colors: p.colors })),
    categories: [], products: [], pages: [{ id:"pg_home", slug:"home", title:"Home", type:"home", body:"", published:1, position:0 }],
    sections: [], footerGroups: [], socialLinks: []
  };
}

async function init() {
  const stored = loadFromBrowser();
  const seed = (await loadDataFile()) || makeSeed();
  if (stored) {
    PUB = stored.published;
    DRAFT = stored.draft || clone(PUB);
    PUB.library = seed.library || PUB.library || {};
    DRAFT.library = seed.library || DRAFT.library || {};
    PUB.palettes = Array.isArray(PUB.palettes) ? PUB.palettes : [];
    DRAFT.palettes = Array.isArray(DRAFT.palettes) ? DRAFT.palettes : [];
    const paletteIds = new Set(PUB.palettes.map(p => p.id));
    (seed.palettes || []).forEach(p => { if (!paletteIds.has(p.id)) { PUB.palettes.push(p); paletteIds.add(p.id); } });
    const draftPaletteIds = new Set(DRAFT.palettes.map(p => p.id));
    (seed.palettes || []).forEach(p => { if (!draftPaletteIds.has(p.id)) { DRAFT.palettes.push(p); draftPaletteIds.add(p.id); } });
  } else {
    PUB = clone(seed);
    DRAFT = clone(seed);
    persist();
  }
  loadCart();
  applyTheme(PUB.theme);
  applyText();

  document.getElementById("brand").innerHTML = esc(PUB.settings.siteName)
    .replace(/(\S+)$/, "<em>$1</em>");
  document.getElementById("drawerNav").innerHTML = `
    <a href="#/">Home</a>
    <a href="#/products">All Products</a>
    <a href="#/categories">All Categories</a>
    ${PUB.categories.filter(c => c.published && !c.parentId)
      .map(c => `<a href="#/c/${esc(c.slug)}">${esc(c.name)}</a>`).join("")}
    ${PUB.pages.filter(p => p.type === "custom" && p.published)
      .map(p => `<a href="#/p/${esc(p.slug)}">${esc(p.title)}</a>`).join("")}`;

  bindChrome();
  route();
}

document.addEventListener("DOMContentLoaded", init);
</script>
