              <div class="form-field">
                <label class="form-label">Warehouse Stock Units *</label>
                <input type="number" name="stock" class="form-input" required value="${product ? product.stock : 15}" />
              </div>
              <div class="form-field">
                <label class="form-label">Discount Percentage (%)</label>
                <input type="number" name="discount" class="form-input" value="${product ? product.discount : 0}" />
              </div>
            </div>

            <div class="form-field">
              <label class="form-label">Primary Image URL</label>
              <input type="url" name="image" class="form-input" value="${product && product.images && product.images[0] ? product.images[0] : 'https://images.unsplash.com/photo-1544441893-675973e31985?auto=format&fit=crop&w=1000&q=80'}" />
            </div>

            <div class="form-field">
              <label class="form-label">Description</label>
              <textarea name="description" class="form-input" style="height: 80px; padding-top: 8px;">${product ? AppUtils.escapeHTML(product.description) : 'Meticulously crafted with certified ethical textiles.'}</textarea>
            </div>

            <div style="display: flex; gap: 16px; margin: 8px 0;">
              <label style="display: flex; align-items: center; gap: 8px; font-size: 0.875rem;">
                <input type="checkbox" name="isFlagship" ${product && product.is_flagship ? 'checked' : ''} />
                <span>Flagship Series</span>
              </label>
              <label style="display: flex; align-items: center; gap: 8px; font-size: 0.875rem;">
                <input type="checkbox" name="isFeatured" ${product && product.is_featured ? 'checked' : ''} />
                <span>Featured Homepage</span>
              </label>
            </div>

            <div style="display: flex; gap: 12px; margin-top: 12px;">
              <button type="submit" class="btn-primary" style="flex: 1;">${isEdit ? 'Save Changes' : 'Create Artifact'}</button>
              <button type="button" class="btn-secondary" id="modal-btn-cancel" style="flex: 0 0 100px;">Cancel</button>
            </div>
          </form>
        </div>
      </div>
    `;

    const close = () => { modalContainer.innerHTML = ""; };
    document.getElementById("modal-close-x").onclick = close;
    document.getElementById("modal-btn-cancel").onclick = close;

    const modalForm = document.getElementById("modal-product-form");
    modalForm.onsubmit = async (e) => {
      e.preventDefault();
      const fd = new FormData(modalForm);
      const prodId = fd.get("id");
      let saved;
      try {
        saved = await SQLiteEngine.saveProduct({
          id: prodId ? Number(prodId) : undefined,
          name: fd.get("name"),
          brand: fd.get("brand"),
          sku: fd.get("sku"),
          category_id: Number(fd.get("categoryId")),
          price: Number(fd.get("price")),
          cost_price: Number(fd.get("costPrice")),
          original_price: Number(fd.get("price")),
          discount: Number(fd.get("discount") || 0),
          stock: Number(fd.get("stock")),
          description: fd.get("description"),
          is_flagship: fd.get("isFlagship") ? 1 : 0,
          is_featured: fd.get("isFeatured") ? 1 : 0,
          images: [fd.get("image")]
        });
      } catch (error) {
        console.error("Could not save the product to SQLite.", error);
        AppUtils.showToast("Product could not be saved to SQLite.", "danger");
        return;
      }
      if (!saved) return;
      AppUtils.showToast(`Artifact "${saved.name}" successfully recorded`);
      close();
      this.handleRoute("/account/products");
    };
  },

  updateNavBadges() {
    const cart = SQLiteEngine.getCart();
    const count = cart.reduce((sum, item) => sum + (item.quantity || 1), 0);
    const badge = document.getElementById("nav-cart-badge");
    if (badge) {
      if (count > 0) {
        badge.textContent = count;
        badge.style.display = "flex";
      } else {
        badge.style.display = "none";
      }
    }
  },

  bindEvents() {
    document.addEventListener("click", async (e) => {
      // 1. Intercept internal data-route links
      const link = e.target.closest("[data-route]");
      if (link && !e.ctrlKey && !e.metaKey) {
        e.preventDefault();
        const route = link.getAttribute("data-route");
        this.navigate(route);
        return;
      }

      // 2. Mobile Menu Toggle
      if (e.target.closest("#mobile-menu-toggle")) {
        const drawer = document.getElementById("mobile-nav-drawer");
        if (drawer) drawer.classList.add("active");
        return;
      }
      if (e.target.closest("#mobile-drawer-close") || e.target.id === "mobile-nav-drawer") {
        const drawer = document.getElementById("mobile-nav-drawer");
        if (drawer) drawer.classList.remove("active");
        return;
      }

      // 3. Quick Add to Bag on product cards
      const quickAddBtn = e.target.closest("[data-action='quick-add']");
      if (quickAddBtn) {
        e.stopPropagation();
        const prodId = Number(quickAddBtn.getAttribute("data-id"));
        SQLiteEngine.addToCart(prodId, 1);
        this.recordCartInterest(prodId);
        AppUtils.showToast("Artifact added to your shopping bag");
        this.updateNavBadges();
        return;
      }

      // 4. Toggle Favorites Heart
      const favBtn = e.target.closest("[data-action='toggle-fav']");
      if (favBtn) {
        e.stopPropagation();
        const prodId = Number(favBtn.getAttribute("data-id"));
        const added = SQLiteEngine.toggleFavorite(prodId);
        this.recordProductInterest(prodId, "wishlist", added);
        favBtn.classList.toggle("active", added);
        const svg = favBtn.querySelector("svg");
        if (svg) svg.setAttribute("fill", added ? "#E11D48" : "none");
        AppUtils.showToast(added ? "Saved to your favorites" : "Removed from favorites");
        return;
      }

      // 5. Bag quantity adjusters
      const cartQtyBtn = e.target.closest("[data-action='cart-qty']");
      if (cartQtyBtn) {
        const cartId = Number(cartQtyBtn.getAttribute("data-id"));
        const delta = Number(cartQtyBtn.getAttribute("data-delta"));
        const productId = SQLiteEngine.getCart().find(item => Number(item.id) === cartId)?.product_id;
        SQLiteEngine.updateCartQty(cartId, delta);
        if (productId != null) this.recordCartInterest(productId);
        this.handleRoute("/bag", false);
        return;
      }

      // 6. Bag remove item
      const cartRemoveBtn = e.target.closest("[data-action='cart-remove']");
      if (cartRemoveBtn) {
        const cartId = Number(cartRemoveBtn.getAttribute("data-id"));
        const productId = SQLiteEngine.getCart().find(item => Number(item.id) === cartId)?.product_id;
        SQLiteEngine.removeCartItem(cartId);
        if (productId != null) this.recordCartInterest(productId);
        this.handleRoute("/bag", false);
        return;
      }

      // 7. Promo code application
      if (e.target.id === "btn-apply-promo") {
        const input = document.getElementById("promo-code-input");
        const val = input ? input.value.trim().toUpperCase() : "";
        if (val === "LUXURY20") {
          window.__ESHOP_APPLIED_DISCOUNT = 50;
          AppUtils.showToast("Promo Code LUXURY20 applied: $50 off!");
          this.handleRoute("/bag", false);
        } else if (val === "WELCOME10") {
          window.__ESHOP_APPLIED_DISCOUNT = 25;
          AppUtils.showToast("Promo Code WELCOME10 applied: $25 off!");
          this.handleRoute("/bag", false);
        } else {
          AppUtils.showToast("Invalid promotion code", "danger");
        }
        return;
      }

      // 8. Admin Products: Edit
      const editProdBtn = e.target.closest("[data-action='admin-edit-prod']");
      if (editProdBtn) {
        const id = Number(editProdBtn.getAttribute("data-id"));
        const prod = SQLiteEngine.getProductById(id);
        if (prod) this.openProductModal(prod);
        return;
      }

      // 9. Admin Products: Duplicate
      const dupProdBtn = e.target.closest("[data-action='admin-dup-prod']");
      if (dupProdBtn) {
        const id = Number(dupProdBtn.getAttribute("data-id"));
        try {
          await SQLiteEngine.duplicateProduct(id);
        } catch (error) {
          console.error("Could not duplicate the product in SQLite.", error);
          AppUtils.showToast("Product could not be duplicated in SQLite.", "danger");
          return;
        }
        AppUtils.showToast("Artifact duplicated");
        this.handleRoute("/account/products", false);
        return;
      }

      // 10. Admin Products: Delete
      const delProdBtn = e.target.closest("[data-action='admin-del-prod']");
      if (delProdBtn) {
        if (confirm("Are you sure you wish to delete this artifact from the SQLite catalog?")) {
          const id = Number(delProdBtn.getAttribute("data-id"));
          try {
            await SQLiteEngine.deleteProduct(id);
          } catch (error) {
            console.error("Could not delete the product from SQLite.", error);
            AppUtils.showToast("Product could not be deleted from SQLite.", "danger");
            return;
          }
          AppUtils.showToast("Artifact deleted from catalog");
          this.handleRoute("/account/products", false);
        }
        return;
      }

      // 11. Quick Restock Units
      const restockBtn = e.target.closest("[data-action='restock-qty']");
      if (restockBtn) {
        const id = Number(restockBtn.getAttribute("data-id"));
        const add = Number(restockBtn.getAttribute("data-add"));
        const prod = SQLiteEngine.getProductById(id);
        if (prod) {
          try {
            await SQLiteEngine.updateInventoryStock(id, prod.stock + add);
          } catch (error) {
            console.error("Could not update product stock in SQLite.", error);
            AppUtils.showToast("Stock could not be updated in SQLite.", "danger");
            return;
          }
          AppUtils.showToast(`Restocked +${add} units in SQLite database`);
          this.handleRoute("/account/inventory", false);
        }
        return;
      }

      // 12. Dashboard period selector
      const dashPeriodBtn = e.target.closest("[data-action='dash-period']");
      if (dashPeriodBtn) {
        const period = dashPeriodBtn.getAttribute("data-period");
        this.navigate(`/account/dashboard?period=${period}`);
        return;
      }

      // 13. Upgrade Plan selection
      const planBtn = e.target.closest("[data-action='upgrade-plan']");
      if (planBtn) {
        const slug = planBtn.getAttribute("data-slug");
        SQLiteEngine.selectPlan(slug);
        AppUtils.showToast(`Selected ${slug.toUpperCase()} tier! Upgrade processed.`);
        this.handleRoute("/account/plans", false);
        return;
      }

      // 14. Reset Database
      if (e.target.id === "btn-reset-database") {
        if (confirm("Reset the embedded SQLite database to the default seed state?")) {
          SQLiteEngine.reset(categories, products, storeInfo, plans, demoAnalytics);
          AppUtils.showToast("Database restored to initial seed state");
          this.handleRoute("/account", false);
        }
        return;
      }
    });

    document.addEventListener("submit", event => {
      const form = event.target.closest("[data-product-hold-form]");
      if (!form) return;
      event.preventDefault();
      void this.submitProductHold(form);
    });

    // Mobile Search Input
    document.addEventListener("keydown", (e) => {
      if (e.target && e.target.id === "mobile-search-input" && e.key === "Enter") {
        const q = e.target.value.trim();
        const drawer = document.getElementById("mobile-nav-drawer");
        if (drawer) drawer.classList.remove("active");
        if (q) this.navigate(`/search?q=${encodeURIComponent(q)}`);
      }
    });
  }
};


  window.applyBuilderElementEdits = edits => {
    if (!Array.isArray(edits)) return;
    const appRoot = document.getElementById("app");
    const lineageFor = element => {
      const lineage = [];
      let node = element;
      while (node && node !== appRoot && lineage.length < 16) {
        lineage.push({
          tag: node.localName,
          id: node.id || "",
          classes: [...node.classList].filter(name => name !== "active").sort().join(" "),
          productId: node.getAttribute("data-product-id") || "",
          slide: node.getAttribute("data-slide") || "",
          action: node.getAttribute("data-action") || "",
          label: node.getAttribute("aria-label") || "",
          href: node.getAttribute("href") || "",
          text: node.children.length ? "" : (node.textContent || "").trim().slice(0, 160)
        });
        node = node.parentElement;
      }
      return node === appRoot ? lineage : [];
    };
    const hashElementValue = value => {
      let first = 2166136261;
      let second = 2246822519;
      for (let index = 0; index < value.length; index += 1) {
        const code = value.charCodeAt(index);
        first = Math.imul(first ^ code, 16777619);
        second = Math.imul(second ^ code, 3266489917);
      }
      return `${(first >>> 0).toString(36)}:${(second >>> 0).toString(36)}:${value.length}`;
    };
    const findByLineage = lineage => {
      if (!Array.isArray(lineage) || !lineage.length) return null;
      const candidates = appRoot.querySelectorAll(lineage[0].tag);
      return [...candidates].find(element => {
        const currentLineage = lineageFor(element);
        return currentLineage.length === lineage.length && lineage.every((step, index) =>
          Object.entries(step).every(([key, value]) => currentLineage[index][key] === value)
        );
      }) || null;
    };
    const resolveElement = (edit, lineage = edit.lineage) => {
      let candidate = null;
      try {
        candidate = document.querySelector(edit.selector);
      } catch (error) {
        console.error("Saved website element selector is invalid.", error);
      }
      if ((!Array.isArray(lineage) || !lineage.length) && candidate) return candidate;
      if (candidate && findByLineage(lineage) === candidate) {
        const textMatches = edit.kind !== "text" ||
          candidate.textContent === edit.originalText || candidate.textContent === edit.text;
        const imageMatches = edit.kind !== "image" ||
          candidate.getAttribute("src") === edit.originalSrc ||
          candidate.getAttribute("src") === edit.src ||
          hashElementValue(candidate.getAttribute("src") || "") === edit.originalSrcHash;
        if (textMatches && imageMatches) return candidate;
      }
      const fallback = findByLineage(lineage);
      if (!fallback) return null;
      if (edit.kind === "text" &&
          fallback.textContent !== edit.originalText && fallback.textContent !== edit.text) return null;
      if (edit.kind === "image" &&
          fallback.getAttribute("src") !== edit.originalSrc &&
          fallback.getAttribute("src") !== edit.src &&
          hashElementValue(fallback.getAttribute("src") || "") !== edit.originalSrcHash) return null;
      return fallback;
    };
    const validEdits = edits.filter(edit =>
      edit && typeof edit.selector === "string" && edit.selector.startsWith("#app > ") &&
      ["text", "image", "icon", "link", "group"].includes(edit.kind)
    );
    const orderedEdits = [
      ...validEdits.filter(edit => !edit.deleted),
      ...validEdits.filter(edit => edit.deleted).sort((a, b) => (b.lineage?.length || 0) - (a.lineage?.length || 0))
    ];
    for (const edit of orderedEdits) {
      const element = resolveElement(edit);
      if (!element) continue;
      if (edit.deleted) {
        element.remove();
        continue;
      }
      if (edit.kind === "text") element.textContent = String(edit.text || "").slice(0, 5000);
      if (edit.kind === "image" && element instanceof HTMLImageElement && edit.src) {
        element.src = String(edit.src);
      }
      if (edit.linkLineage && typeof edit.href === "string") {
        const link = findByLineage(edit.linkLineage);
        if (link?.matches("a[href]")) {
          link.setAttribute("href", edit.href);
          if (link.hasAttribute("data-route")) link.setAttribute("data-route", edit.href);
        }
      }
      const offsetX = Number(edit.offsetX);
      const offsetY = Number(edit.offsetY);
      if (Number.isFinite(offsetX) || Number.isFinite(offsetY)) {
        element.style.setProperty("--eshop-builder-offset-x", `${Math.max(-240, Math.min(240, Number.isFinite(offsetX) ? offsetX : 0))}px`);
        element.style.setProperty("--eshop-builder-offset-y", `${Math.max(-240, Math.min(240, Number.isFinite(offsetY) ? offsetY : 0))}px`);
        element.style.translate = "var(--eshop-builder-offset-x) var(--eshop-builder-offset-y)";
      }
      const rotation = Number(edit.rotation);
      if (Number.isFinite(rotation) && rotation !== 0) {
        const existingTransform = element.style.transform;
        element.style.transform = `${existingTransform && !existingTransform.includes("rotate(") ? `${existingTransform} ` : ""}rotate(${rotation}deg)`;
      }
      if (edit.linkDeleted && edit.linkLineage) findByLineage(edit.linkLineage)?.remove();
    }
    for (const edit of validEdits) {
      if (!edit.linkLineage || edit.deleted || edit.linkDeleted || typeof edit.href !== "string") continue;
      const link = findByLineage(edit.linkLineage);
      if (link?.matches("a[href]")) {
        link.setAttribute("href", edit.href);
        if (link.hasAttribute("data-route")) link.setAttribute("data-route", edit.href);
      }
    }
  };

  window.setBuilderCatalog = (catalog) => {
    if (!builderPreviewMode) throw new Error("Builder catalog handoff requires builder preview mode.");
    if (!catalog || !Array.isArray(catalog.products) || !Array.isArray(catalog.categories) || !catalog.store) {
      throw new TypeError("Builder catalog handoff requires products, categories, and store data.");
    }
    if (themePreviewMode && (!catalog.products.length || !catalog.categories.length)) {
      throw new TypeError("Theme previews require their saved demo products and categories.");
    }

    SQLiteEngine.db.tables.products = JSON.parse(JSON.stringify(catalog.products));
    SQLiteEngine.db.tables.categories = JSON.parse(JSON.stringify(catalog.categories));
    SQLiteEngine.db.tables.store = [JSON.parse(JSON.stringify(catalog.store))];
    SQLiteEngine.db.tables.pages = Array.isArray(catalog.pages) ? JSON.parse(JSON.stringify(catalog.pages)) : [];
    AppController.applyThemeSettings(catalog.appearance);
    AppController.handleRoute(AppController.currentRoute(), false);
  };

  window.getBuilderSeedCatalog = () => {
    if (!builderPreviewMode) throw new Error("Storefront seed export requires builder preview mode.");
    return {
      products: JSON.parse(JSON.stringify(products)),
      categories: JSON.parse(JSON.stringify(categories)),
      store: JSON.parse(JSON.stringify(storeInfo))
    };
  };

  // Initialize once DOM is ready
  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", () => AppController.init());
  } else {
    AppController.init();
  }
})();

  </script>
