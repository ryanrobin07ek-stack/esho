<html lang="en">
<head>
  <meta charset="UTF-8">

  <style>
/* Craft Premium Commerce & Studio Design System */
:root {
  --bg: #FAFAF8;
  --surface: #FFFFFF;
  --surface-subtle: #F4F4F1;
  --surface-hover: #ECECE8;
  --text-main: #141413;
  --text-muted: #666660;
  --text-dim: #999990;
  --border: #E5E5E0;
  --border-subtle: #EFEFEA;
  --accent: #18181B;
  --accent-hover: #27272A;
  --accent-light: #F4F4F5;
  --accent-contrast: #FFFFFF;
  --badge-bg: #F4F4F0;
  --badge-text: #222220;
  --success: #1E6B42;
  --success-bg: #EBF7EE;
  --warning: #B45309;
  --warning-bg: #FEF3C7;
  --danger: #991B1B;
  --danger-bg: #FEE2E2;
  --font-main: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --font-serif: "Playfair Display", Georgia, "Times New Roman", serif;
  --radius: 4px;
  --radius-sm: 2px;
  --radius-lg: 8px;
  --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.04);
  --shadow-md: 0 4px 12px rgba(0, 0, 0, 0.05);
  --shadow-lg: 0 12px 32px rgba(0, 0, 0, 0.08);
  --transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
  --container-max: 1360px;
}

/* Base Reset */
*, *::before, *::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html {
  font-size: 16px;
  scroll-behavior: smooth;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

body {
  background-color: var(--bg);
  color: var(--text-main);
  font-family: var(--font-main);
  line-height: 1.5;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

/* Reduced Motion */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
    scroll-behavior: auto !important;
  }
}

a {
  color: inherit;
  text-decoration: none;
}

img {
  max-width: 100%;
  height: auto;
  display: block;
}

button, input, select, textarea {
  font-family: inherit;
  font-size: inherit;
}

button {
  cursor: pointer;
  border: none;
  background: none;
}

/* Utility Containers */
.container {
  width: 100%;
  max-width: var(--container-max);
  margin-left: auto;
  margin-right: auto;
  padding-left: 24px;
  padding-right: 24px;
}

@media (max-width: 768px) {
  .container {
    padding-left: 16px;
    padding-right: 16px;
  }
}

/* Announcement Bar */
.announcement-bar {
  background-color: var(--accent);
  color: var(--accent-contrast);
  font-size: 0.8125rem;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  padding: 8px 16px;
  text-align: center;
  font-weight: 500;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
}

/* Storefront Navbar */
.navbar {
  position: sticky;
  top: 0;
  z-index: 100;
  background-color: rgba(250, 250, 248, 0.96);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--border);
  transition: var(--transition);
}

.nav-container {
  display: flex;
  align-items: center;
  justify-content: space-between;
  height: 72px;
  gap: 20px;
}

.nav-left {
  display: flex;
  align-items: center;
  gap: 32px;
}

.brand-logo {
  font-size: 1.35rem;
  font-weight: 700;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  display: flex;
  align-items: center;
  gap: 10px;
}

.brand-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background-color: var(--accent);
}

.nav-menu {
  display: flex;
  align-items: center;
  gap: 24px;
  list-style: none;
}

.nav-link {
  font-size: 0.875rem;
  font-weight: 500;
  color: var(--text-muted);
  transition: var(--transition);
  padding: 8px 0;
  position: relative;
}

.nav-link:hover, .nav-link.active {
  color: var(--text-main);
}

.nav-link.active::after {
  content: "";
  position: absolute;
  bottom: 0;
  left: 0;
  right: 0;
  height: 2px;
  background-color: var(--accent);
}

.nav-center {
  flex: 1;
  max-width: 440px;
  position: relative;
}

.search-box {
  position: relative;
  width: 100%;
}

.search-input {
  width: 100%;
  height: 42px;
  padding: 0 16px 0 40px;
  background-color: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  color: var(--text-main);
  font-size: 0.875rem;
  outline: none;
  transition: var(--transition);
}

.search-input:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 1px var(--accent);
}

.search-icon {
  position: absolute;
  left: 14px;
  top: 50%;
  transform: translateY(-50%);
  color: var(--text-dim);
  pointer-events: none;
  display: flex;
}

.search-dropdown {
  position: absolute;
  top: calc(100% + 8px);
  left: 0;
  right: 0;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  box-shadow: var(--shadow-lg);
  max-height: 420px;
  overflow-y: auto;
  z-index: 150;
  display: none;
}

.search-dropdown.active {
  display: block;
}

.search-result-item {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 10px 14px;
  border-bottom: 1px solid var(--border-subtle);
  transition: var(--transition);
}

.search-result-item:hover {
  background-color: var(--surface-subtle);
}

.search-result-thumb {
  width: 44px;
  height: 52px;
  object-fit: cover;
  border-radius: var(--radius-sm);
  background-color: var(--surface-subtle);
}

.nav-right {
  display: flex;
  align-items: center;
  gap: 14px;
}

.nav-icon-btn {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 42px;
  height: 42px;
  border-radius: var(--radius);
  color: var(--text-main);
  position: relative;
  transition: var(--transition);
}

.nav-icon-btn:hover {
  background-color: var(--surface-hover);
}

.nav-badge {
  position: absolute;
  top: 4px;
  right: 4px;
  background-color: var(--accent);
  color: var(--accent-contrast);
  font-size: 0.6875rem;
  font-weight: 700;
  min-width: 18px;
  height: 18px;
  padding: 0 4px;
  border-radius: 9px;
  display: flex;
  align-items: center;
  justify-content: center;
}

.btn-studio-pill {
  background-color: var(--surface);
  border: 1px solid var(--border);
  padding: 8px 14px;
  border-radius: var(--radius);
  font-size: 0.8125rem;
  font-weight: 600;
  color: var(--text-main);
  display: flex;
  align-items: center;
  gap: 8px;
  transition: var(--transition);
}

.btn-studio-pill:hover {
  background-color: var(--accent);
  color: var(--accent-contrast);
  border-color: var(--accent);
}

/* Mobile Nav Toggle */
.mobile-menu-btn {
  display: none;
  width: 42px;
  height: 42px;
  align-items: center;
  justify-content: center;
  color: var(--text-main);
}

@media (max-width: 1024px) {
  .nav-menu {
    display: none;
  }
  .mobile-menu-btn {
    display: flex;
  }
}

@media (max-width: 768px) {
  .nav-center {
    display: none;
  }
  .btn-studio-pill span {
    display: none;
  }
}

/* Mobile Drawer */
.mobile-drawer-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.4);
  z-index: 200;
  opacity: 0;
  visibility: hidden;
  transition: var(--transition);
}

.mobile-drawer-overlay.active {
  opacity: 1;
  visibility: visible;
}

.mobile-drawer {
  position: fixed;
  top: 0;
  left: 0;
  bottom: 0;
  width: 82%;
  max-width: 340px;
  background: var(--surface);
  z-index: 201;
  transform: translateX(-100%);
  transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
  display: flex;
  flex-direction: column;
  padding: 24px;
  overflow-y: auto;
}

.mobile-drawer.active {
  transform: translateX(0);
}

.mobile-drawer-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding-bottom: 20px;
  border-bottom: 1px solid var(--border);
}

.mobile-nav-list {
  list-style: none;
  margin-top: 20px;
  display: flex;
  flex-direction: column;
  gap: 16px;
}

.mobile-nav-link {
  font-size: 1.125rem;
  font-weight: 500;
  display: block;
  padding: 6px 0;
}

/* Hero Carousel */
.hero-section {
  position: relative;
  overflow: hidden;
  background-color: #141414;
  color: #FFFFFF;
}

.hero-carousel {
  position: relative;
  width: 100%;
  height: 640px;
}

@media (max-width: 768px) {
  .hero-carousel {
    height: 480px;
  }
}

.hero-slide {
  position: absolute;
  inset: 0;
  opacity: 0;
  visibility: hidden;
  transition: opacity 0.8s cubic-bezier(0.16, 1, 0.3, 1), transform 0.8s cubic-bezier(0.16, 1, 0.3, 1);
  transform: scale(1.02);
  display: flex;
  align-items: center;
}

.hero-slide.active {
  opacity: 1;
  visibility: visible;
  transform: scale(1);
}

.hero-bg-img {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  filter: brightness(0.65);
}

.hero-content {
  position: relative;
  z-index: 10;
  max-width: 680px;
  padding: 40px 0;
}

.hero-badge {
  display: inline-block;
  font-size: 0.75rem;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  font-weight: 600;
  padding: 6px 12px;
  background: rgba(255, 255, 255, 0.15);
  backdrop-filter: blur(8px);
  border: 1px solid rgba(255, 255, 255, 0.25);
  border-radius: var(--radius-sm);
  margin-bottom: 18px;
}

.hero-title {
  font-family: var(--font-serif);
  font-size: 3.25rem;
  line-height: 1.12;
  font-weight: 400;
  margin-bottom: 16px;
  letter-spacing: -0.01em;
}

@media (max-width: 768px) {
  .hero-title {
    font-size: 2.2rem;
  }
}

.hero-subtitle {
  font-size: 1.0625rem;
  line-height: 1.6;
  color: rgba(255, 255, 255, 0.85);
  margin-bottom: 28px;
}

.hero-cta {
  display: inline-flex;
  align-items: center;
  gap: 12px;
  background: #FFFFFF;
  color: #111111;
  font-size: 0.875rem;
  font-weight: 600;
  padding: 14px 28px;
  border-radius: var(--radius);
  letter-spacing: 0.03em;
  transition: var(--transition);
}

.hero-cta:hover {
  background: #E5E5E5;
  transform: translateY(-2px);
}

.hero-controls {
  position: absolute;
  bottom: 28px;
  right: 28px;
  display: flex;
  align-items: center;
  gap: 12px;
  z-index: 20;
}

.hero-arrow-btn {
  width: 44px;
  height: 44px;
  background: rgba(0, 0, 0, 0.4);
  backdrop-filter: blur(6px);
  border: 1px solid rgba(255, 255, 255, 0.2);
  color: #FFFFFF;
  border-radius: var(--radius);
  display: flex;
  align-items: center;
  justify-content: center;
  transition: var(--transition);
}

.hero-arrow-btn:hover {
  background: rgba(255, 255, 255, 0.2);
}

.hero-dots {
  display: flex;
  gap: 8px;
  align-items: center;
}

.hero-dot {
  width: 28px;
  height: 3px;
  background: rgba(255, 255, 255, 0.3);
  transition: var(--transition);
  cursor: pointer;
}

.hero-dot.active {
  background: #FFFFFF;
  width: 44px;
}

/* Circular Category Navigation Rail */
.categories-rail-section {
  padding: 48px 0 24px;
  border-bottom: 1px solid var(--border);
}

.section-eyebrow {
  font-size: 0.75rem;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--text-muted);
  font-weight: 600;
  margin-bottom: 6px;
}

.section-heading {
  font-family: var(--font-serif);
  font-size: 2rem;
  font-weight: 400;
  color: var(--text-main);
  letter-spacing: -0.01em;
}

.categories-rail {
  display: flex;
  gap: 24px;
  overflow-x: auto;
  padding: 24px 0 16px;
  scrollbar-width: thin;
  -webkit-overflow-scrolling: touch;
}

.category-circle-card {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 12px;
  min-width: 96px;
  text-align: center;
  transition: var(--transition);
}

.category-circle-card:hover {
  transform: translateY(-4px);
}

.category-circle-thumb-wrapper {
  width: 84px;
  height: 84px;
  border-radius: 50%;
  overflow: hidden;
  border: 1px solid var(--border);
  background-color: var(--surface-subtle);
  position: relative;
  box-shadow: var(--shadow-sm);
}

.category-circle-img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  transition: transform 0.4s ease;
}

.category-circle-card:hover .category-circle-img {
  transform: scale(1.08);
}

.category-circle-name {
  font-size: 0.8125rem;
  font-weight: 600;
  color: var(--text-main);
  white-space: nowrap;
}

/* Flagship Editorial Section */
.flagship-section {
  padding: 64px 0;
  border-bottom: 1px solid var(--border);
}

.flagship-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 40px;
  align-items: center;
}

@media (max-width: 900px) {
  .flagship-grid {
    grid-template-columns: 1fr;
    gap: 32px;
  }
}

.flagship-banner {
  position: relative;
  aspect-ratio: 4 / 5;
  border-radius: var(--radius);
  overflow: hidden;
  background-color: var(--surface-subtle);
}

.flagship-img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.flagship-card-overlay {
  position: absolute;
  bottom: 0;
  left: 0;
  right: 0;
  padding: 32px;
  background: linear-gradient(to top, rgba(0, 0, 0, 0.85) 0%, rgba(0, 0, 0, 0) 100%);
  color: #FFFFFF;
}

/* Product Cards & Grids */
.products-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 28px;
  row-gap: 40px;
}

@media (max-width: 1200px) {
  .products-grid {
    grid-template-columns: repeat(3, 1fr);
    gap: 20px;
  }
}

@media (max-width: 768px) {
  .products-grid {
    grid-template-columns: repeat(2, 1fr);
    gap: 16px;
    row-gap: 28px;
  }
}

.product-card {
  display: flex;
  flex-direction: column;
  background: var(--surface);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius);
  overflow: hidden;
  position: relative;
  transition: var(--transition);
}

.product-card:hover {
  border-color: var(--border);
  box-shadow: var(--shadow-md);
  transform: translateY(-2px);
}

.product-card-thumb-link {
  position: relative;
  aspect-ratio: 3 / 4;
  overflow: hidden;
  background-color: var(--surface-subtle);
  display: block;
}

.product-card-img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  transition: transform 0.6s cubic-bezier(0.16, 1, 0.3, 1);
}

.product-card:hover .product-card-img {
  transform: scale(1.05);
}

.product-badge-stack {
  position: absolute;
  top: 12px;
  left: 12px;
  display: flex;
  flex-direction: column;
  gap: 6px;
  z-index: 5;
}

.product-badge {
  font-size: 0.6875rem;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  font-weight: 700;
  padding: 4px 8px;
  border-radius: var(--radius-sm);
  background: var(--surface);
  color: var(--text-main);
  box-shadow: var(--shadow-sm);
}

.badge-sale {
  background: #111111;
  color: #FFFFFF;
}

.badge-new {
  background: #E8F5E9;
  color: #1B5E20;
}

.badge-flagship {
  background: #FFF8E1;
  color: #B78103;
}

.product-card-fav-btn {
  position: absolute;
  top: 12px;
  right: 12px;
  width: 36px;
  height: 36px;
  background: rgba(255, 255, 255, 0.9);
  backdrop-filter: blur(4px);
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--text-muted);
  transition: var(--transition);
  z-index: 5;
  box-shadow: var(--shadow-sm);
}

.product-card-fav-btn:hover, .product-card-fav-btn.active {
  color: #E11D48;
  background: #FFFFFF;
}

.product-card-content {
  padding: 16px;
  display: flex;
  flex-direction: column;
  flex: 1;
}

.product-card-brand {
  font-size: 0.75rem;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--text-muted);
  font-weight: 600;
  margin-bottom: 4px;
}

.product-card-title {
  font-size: 0.9375rem;
  font-weight: 500;
  color: var(--text-main);
  line-height: 1.35;
  margin-bottom: 8px;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}

.product-card-title a:hover {
  text-decoration: underline;
}

.product-card-rating {
  display: flex;
  align-items: center;
  gap: 4px;
  font-size: 0.75rem;
  color: var(--text-muted);
  margin-bottom: 12px;
}

.star-icon {
  color: #D97706;
}

.product-card-price-row {
  display: flex;
  align-items: baseline;
  gap: 8px;
  margin-top: auto;
  padding-bottom: 12px;
}

.price-current {
  font-size: 1.0625rem;
  font-weight: 600;
  color: var(--text-main);
}

.price-original {
  font-size: 0.875rem;
  color: var(--text-dim);
  text-decoration: line-through;
}

.price-discount {
  font-size: 0.75rem;
  font-weight: 600;
  color: #B91C1C;
}

.product-card-quick-add {
  width: 100%;
  height: 38px;
  background: var(--surface-subtle);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  font-size: 0.8125rem;
  font-weight: 600;
  color: var(--text-main);
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  transition: var(--transition);
}

.product-card-quick-add:hover {
  background: var(--accent);
  color: var(--accent-contrast);
  border-color: var(--accent);
}

/* Horizontal Product Rail */
.product-rail {
  display: flex;
  gap: 20px;
  overflow-x: auto;
  padding: 16px 0 24px;
  scrollbar-width: thin;
}

.product-rail .product-card {
  min-width: 260px;
  max-width: 280px;
  flex-shrink: 0;
}

/* Editorial Campaign Banner */
.campaign-banner-section {
  padding: 64px 0;
}

.campaign-card {
  position: relative;
  border-radius: var(--radius);
  overflow: hidden;
  background: #111111;
  color: #FFFFFF;
  display: flex;
  min-height: 400px;
  align-items: center;
}

.campaign-bg-img {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  filter: brightness(0.6);
}

.campaign-inner {
  position: relative;
  z-index: 5;
  max-width: 580px;
  padding: 48px;
}

@media (max-width: 768px) {
  .campaign-inner {
    padding: 28px 20px;
  }
}

/* Category Page Styles */
.category-hero-header {
  padding: 48px 0 32px;
  border-bottom: 1px solid var(--border);
  background-color: var(--surface);
}

.breadcrumbs {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 0.8125rem;
  color: var(--text-muted);
  margin-bottom: 16px;
}

.breadcrumbs a:hover {
  color: var(--text-main);
  text-decoration: underline;
}

.filter-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 18px 0;
  border-bottom: 1px solid var(--border);
  margin-bottom: 32px;
  gap: 16px;
  flex-wrap: wrap;
}

.filter-group {
  display: flex;
  align-items: center;
  gap: 12px;
  flex-wrap: wrap;
}

.filter-select {
  height: 38px;
  padding: 0 12px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  font-size: 0.875rem;
  color: var(--text-main);
  outline: none;
}

.filter-select:focus {
  border-color: var(--accent);
}

/* Product Detail Page */
.product-page-section {
  padding: 40px 0 80px;
}

.product-detail-layout {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 56px;
  align-items: start;
}

@media (max-width: 960px) {
  .product-detail-layout {
    grid-template-columns: 1fr;
    gap: 36px;
  }
}

.product-gallery {
  position: sticky;
  top: 96px;
  display: flex;
  flex-direction: column;
  gap: 16px;
}

.gallery-main-view {
  aspect-ratio: 3 / 4;
  border-radius: var(--radius);
  overflow: hidden;
  background-color: var(--surface-subtle);
  border: 1px solid var(--border);
  position: relative;
}

.gallery-main-img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  transition: transform 0.3s ease;
}

.gallery-thumbnails-rail {
  display: flex;
  gap: 12px;
  overflow-x: auto;
  padding-bottom: 4px;
}

.gallery-thumb-btn {
  width: 72px;
  height: 88px;
  border-radius: var(--radius);
  overflow: hidden;
  border: 2px solid transparent;
  flex-shrink: 0;
  background-color: var(--surface-subtle);
}

.gallery-thumb-btn.active {
  border-color: var(--accent);
}

.gallery-thumb-img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.product-info-panel {
  display: flex;
  flex-direction: column;
  gap: 24px;
}

.product-sku-tag {
  font-size: 0.75rem;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--text-muted);
}

.product-main-title {
  font-family: var(--font-serif);
  font-size: 2.25rem;
  line-height: 1.2;
  font-weight: 400;
  letter-spacing: -0.01em;
}

.product-price-box {
  display: flex;
  align-items: baseline;
  gap: 12px;
}

.product-price-box .price-current {
  font-size: 1.75rem;
  font-weight: 600;
}

.options-title {
  font-size: 0.875rem;
  font-weight: 600;
  margin-bottom: 10px;
  display: flex;
  justify-content: space-between;
}

.options-chips {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
}

.option-chip {
  padding: 8px 16px;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  background: var(--surface);
  font-size: 0.875rem;
  font-weight: 500;
  transition: var(--transition);
}

.option-chip:hover {
  border-color: var(--text-main);
}

.option-chip.active {
  background: var(--accent);
  color: var(--accent-contrast);
  border-color: var(--accent);
}

.quantity-stepper {
  display: inline-flex;
  align-items: center;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  background: var(--surface);
  height: 48px;
}

.stepper-btn {
  width: 44px;
  height: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--text-main);
  font-weight: 600;
  transition: var(--transition);
}

.stepper-btn:hover {
  background-color: var(--surface-subtle);
}

.stepper-input {
  width: 44px;
  text-align: center;
  border: none;
  font-size: 0.9375rem;
  font-weight: 600;
  background: transparent;
  outline: none;
}

.cta-button-group {
  display: flex;
  gap: 12px;
}

.btn-primary {
  flex: 1;
  height: 52px;
  background: var(--accent);
  color: var(--accent-contrast);
  border-radius: var(--radius);
  font-size: 0.9375rem;
  font-weight: 600;
  letter-spacing: 0.02em;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  transition: var(--transition);
}

.btn-primary:hover {
  background: var(--accent-hover);
  transform: translateY(-1px);
}

.btn-primary:disabled,
.btn-primary:disabled:hover {
  background: var(--surface-hover);
  color: var(--text-muted);
  cursor: not-allowed;
  opacity: 1;
  transform: none;
}

.btn-secondary {
  flex: 1;
  height: 52px;
  background: var(--surface);
  color: var(--text-main);
  border: 1px solid var(--text-main);
  border-radius: var(--radius);
  font-size: 0.9375rem;
  font-weight: 600;
  letter-spacing: 0.02em;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: var(--transition);
}

.btn-secondary:hover {
  background: var(--surface-subtle);
}

.btn-fav-large {
  width: 52px;
  height: 52px;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  background: var(--surface);
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--text-muted);
  transition: var(--transition);
  flex-shrink: 0;
}

.btn-fav-large:hover, .btn-fav-large.active {
  color: #E11D48;
  border-color: #E11D48;
}

/* Accordion Component */
.accordion-list {
  border-top: 1px solid var(--border);
  margin-top: 16px;
}

.accordion-item {
  border-bottom: 1px solid var(--border);
}

.accordion-trigger {
  width: 100%;
  padding: 18px 0;
  display: flex;
  align-items: center;
  justify-content: space-between;
  font-size: 0.9375rem;
  font-weight: 600;
  color: var(--text-main);
  text-align: left;
}

.accordion-body {
  padding-bottom: 20px;
  font-size: 0.875rem;
  line-height: 1.6;
  color: var(--text-muted);
  display: none;
}

.accordion-body.active {
  display: block;
}

/* Shopping Bag Page */
.bag-layout {
  display: grid;
  grid-template-columns: 1fr 380px;
  gap: 48px;
  align-items: start;
  padding: 40px 0 80px;
}

@media (max-width: 960px) {
  .bag-layout {
    grid-template-columns: 1fr;
    gap: 36px;
  }
}

.bag-items-list {
  display: flex;
  flex-direction: column;
  gap: 20px;
}

.bag-item-card {
  display: flex;
  gap: 20px;
  padding: 20px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
}

@media (max-width: 600px) {
  .bag-item-card {
    flex-direction: column;
  }
}

.bag-item-thumb {
  width: 100px;
  height: 125px;
  object-fit: cover;
  border-radius: var(--radius-sm);
  background-color: var(--surface-subtle);
  flex-shrink: 0;
}

.bag-item-info {
  display: flex;
  flex-direction: column;
  flex: 1;
  gap: 6px;
}

.bag-item-price {
  font-size: 1.0625rem;
  font-weight: 600;
}

.order-summary-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 28px;
  position: sticky;
  top: 96px;
}

.summary-row {
  display: flex;
  justify-content: space-between;
  font-size: 0.875rem;
  margin-bottom: 12px;
  color: var(--text-muted);
}

.summary-row.total {
  font-size: 1.125rem;
  font-weight: 700;
  color: var(--text-main);
  border-top: 1px solid var(--border);
  padding-top: 16px;
  margin-top: 16px;
}

/* Checkout Page */
.checkout-layout {
  display: grid;
  grid-template-columns: 1fr 420px;
  gap: 48px;
  padding: 40px 0 80px;
}

@media (max-width: 960px) {
  .checkout-layout {
    grid-template-columns: 1fr;
  }
}

.checkout-form-section {
  display: flex;
  flex-direction: column;
  gap: 32px;
}

.form-group-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 28px;
}

.form-card-title {
  font-size: 1.125rem;
  font-weight: 600;
  margin-bottom: 20px;
  display: flex;
  align-items: center;
  gap: 10px;
}

.form-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 16px;
}

.form-grid.full {
  grid-template-columns: 1fr;
}

.form-field {
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.form-label {
  font-size: 0.8125rem;
  font-weight: 600;
  color: var(--text-main);
}

.form-input {
  height: 44px;
  padding: 0 14px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  font-size: 0.875rem;
  color: var(--text-main);
  outline: none;
  transition: var(--transition);
}

.form-input:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 1px var(--accent);
}

/* Account & Studio Portal */
.account-hero-header {
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: 48px 0;
}

.account-profile-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 24px;
  flex-wrap: wrap;
}

.profile-identity {
  display: flex;
  align-items: center;
  gap: 20px;
}

.profile-avatar {
  width: 72px;
  height: 72px;
  border-radius: 50%;
  object-fit: cover;
  border: 2px solid var(--border);
}

.studio-nav-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 24px;
  padding: 40px 0;
}

@media (max-width: 1024px) {
  .studio-nav-grid {
    grid-template-columns: repeat(2, 1fr);
  }
}

@media (max-width: 600px) {
  .studio-nav-grid {
    grid-template-columns: 1fr;
  }
}

.studio-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 24px;
  display: flex;
  flex-direction: column;
  gap: 12px;
  transition: var(--transition);
  position: relative;
}

.studio-card:hover {
  border-color: var(--accent);
  transform: translateY(-2px);
  box-shadow: var(--shadow-md);
}

.studio-card-icon {
  width: 48px;
  height: 48px;
  background: var(--surface-subtle);
  border-radius: var(--radius);
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--accent);
}

.studio-card-title {
  font-size: 1.125rem;
  font-weight: 600;
  color: var(--text-main);
}

.studio-card-desc {
  font-size: 0.8125rem;
  color: var(--text-muted);
  line-height: 1.5;
}

/* Studio Manager Layouts (Products, Dashboard, Inventory, etc.) */
.studio-page-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 32px 0 24px;
  border-bottom: 1px solid var(--border);
  margin-bottom: 32px;
  flex-wrap: wrap;
  gap: 16px;
}

.studio-back-link {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: 0.875rem;
  font-weight: 600;
  color: var(--text-muted);
  margin-bottom: 8px;
}

.studio-back-link:hover {
  color: var(--text-main);
}

.studio-table-container {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  overflow-x: auto;
}

.studio-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 0.875rem;
  text-align: left;
}

.studio-table th {
  background: var(--surface-subtle);
  padding: 12px 16px;
  font-weight: 600;
  color: var(--text-muted);
  border-bottom: 1px solid var(--border);
  white-space: nowrap;
}

.studio-table td {
  padding: 14px 16px;
  border-bottom: 1px solid var(--border-subtle);
  vertical-align: middle;
}

.studio-table tr:hover {
  background: rgba(0, 0, 0, 0.015);
}

/* Metric KPI Cards */
.metrics-row {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 20px;
  margin-bottom: 32px;
}

@media (max-width: 960px) {
  .metrics-row {
    grid-template-columns: repeat(2, 1fr);
  }
}

@media (max-width: 480px) {
  .metrics-row {
    grid-template-columns: 1fr;
  }
}

.metric-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 20px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.metric-label {
  font-size: 0.75rem;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--text-muted);
  font-weight: 600;
}

.metric-value {
  font-size: 1.85rem;
  font-weight: 700;
  color: var(--text-main);
  line-height: 1;
}

.metric-trend {
  font-size: 0.75rem;
  font-weight: 600;
  color: var(--success);
}

/* Modals */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.5);
  backdrop-filter: blur(4px);
  z-index: 300;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
  opacity: 0;
  visibility: hidden;
  transition: var(--transition);
}

.modal-overlay.active {
  opacity: 1;
  visibility: visible;
}

.modal-card {
  background: var(--surface);
  border-radius: var(--radius-lg);
  max-width: 680px;
  width: 100%;
  max-height: 90vh;
  overflow-y: auto;
  box-shadow: var(--shadow-lg);
  padding: 32px;
  position: relative;
}

.modal-close-btn {
  position: absolute;
  top: 20px;
  right: 20px;
  width: 36px;
  height: 36px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--text-muted);
}

.modal-close-btn:hover {
  background: var(--surface-hover);
  color: var(--text-main);
}

/* Toast Notifications */
.toast-container {
  position: fixed;
  bottom: 24px;
  right: 24px;
  z-index: 400;
  display: flex;
  flex-direction: column;
  gap: 10px;
  pointer-events: none;
}

.toast {
  background: var(--accent);
  color: var(--accent-contrast);
  padding: 12px 20px;
  border-radius: var(--radius);
  box-shadow: var(--shadow-lg);
  font-size: 0.875rem;
  font-weight: 500;
  display: flex;
  align-items: center;
  gap: 12px;
  pointer-events: auto;
  animation: toastIn 0.3s cubic-bezier(0.16, 1, 0.3, 1);
}

@keyframes toastIn {
  from { opacity: 0; transform: translateY(12px); }
  to { opacity: 1; transform: translateY(0); }
}

/* Footer */
.footer {
  background: #141413;
  color: #FFFFFF;
  margin-top: auto;
  padding: 80px 0 40px;
  border-top: 1px solid #282826;
}

.footer-grid {
  display: grid;
  grid-template-columns: 2fr 1fr 1fr 1fr 1fr;
  gap: 48px;
  margin-bottom: 64px;
}

@media (max-width: 1024px) {
  .footer-grid {
    grid-template-columns: 1fr 1fr;
    gap: 32px;
  }
}

@media (max-width: 600px) {
  .footer-grid {
    grid-template-columns: 1fr;
  }
}

.footer-col-title {
  font-size: 0.8125rem;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  font-weight: 700;
  color: #FFFFFF;
  margin-bottom: 20px;
}

.footer-links-list {
  list-style: none;
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.footer-link {
  font-size: 0.875rem;
  color: #A3A39D;
  transition: var(--transition);
}

.footer-link:hover {
  color: #FFFFFF;
  text-decoration: underline;
}

.footer-bottom {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding-top: 32px;
  border-top: 1px solid #282826;
  font-size: 0.8125rem;
  color: #73736C;
  flex-wrap: wrap;
  gap: 16px;
}

@media (max-width: 600px) {
  html {
    scroll-padding-top: 76px;
  }

  body {
    width: 100%;
    overflow-x: clip;
    font-size: 15px;
  }

  img {
    max-width: 100%;
  }

  .container {
    padding-left: 16px;
    padding-right: 16px;
  }

  .announcement-bar {
    min-height: 34px;
    padding: 7px 12px;
    font-size: 0.625rem;
    line-height: 1.4;
  }

  .nav-container {
    min-height: 62px;
    height: auto;
    padding-top: 8px;
    gap: 0 6px;
    flex-wrap: wrap;
  }

  .nav-left {
    min-width: 0;
    gap: 8px;
    flex: 1 1 auto;
  }

  .brand-logo {
    min-width: 0;
    gap: 7px;
    font-size: clamp(0.95rem, 4.4vw, 1.2rem);
    letter-spacing: 0.045em;
    white-space: nowrap;
  }

  .mobile-menu-btn,
  .nav-icon-btn {
    width: 40px;
    min-width: 40px;
    height: 44px;
  }

  .nav-right {
    gap: 2px;
  }

  .nav-center {
    display: block !important;
    order: 3;
    flex: 0 0 100%;
    max-width: none;
    padding: 6px 0 10px;
  }

  .search-input {
    height: 44px;
    font-size: 16px;
  }

  .search-dropdown {
    max-height: min(55svh, 380px);
  }

  .mobile-drawer {
    width: min(88vw, 360px);
    padding: 20px;
    padding-bottom: max(20px, env(safe-area-inset-bottom));
  }

  .hero-carousel {
    height: clamp(500px, 76svh, 680px);
    min-height: 500px;
  }

  .hero-slide > .container {
    display: flex;
    align-items: center;
    min-height: 100%;
  }

  .hero-content {
    width: 100%;
    max-width: 34rem;
    padding: 42px 0 84px;
  }

  .hero-badge {
    max-width: 100%;
    margin-bottom: 16px;
    font-size: 0.64rem;
    letter-spacing: 0.12em;
  }

  .hero-title {
    max-width: 12ch;
    margin-bottom: 12px;
    font-size: clamp(2.35rem, 10.5vw, 3.6rem);
    line-height: 0.98;
    overflow-wrap: anywhere;
  }

  .hero-subtitle {
    max-width: 34rem;
    margin-bottom: 20px;
    font-size: clamp(0.94rem, 4vw, 1.08rem);
    line-height: 1.5;
  }

  .hero-cta {
    min-height: 48px;
    max-width: 100%;
    padding: 12px 16px;
    font-size: 0.86rem;
    line-height: 1.35;
  }

  .hero-controls {
    right: 16px;
    bottom: 16px;
    left: 16px;
    justify-content: space-between;
    gap: 8px;
  }

  .hero-arrow-btn {
    width: 44px;
    height: 44px;
    flex: 0 0 44px;
  }

  .hero-dots {
    min-height: 44px;
    justify-content: center;
    flex: 1;
  }

  .hero-dot {
    width: 20px;
  }

  .hero-dot.active {
    width: 32px;
  }

  .categories-rail-section {
    padding: 32px 0 18px;
  }

  .categories-rail-section .container > div:first-child {
    align-items: flex-start !important;
    gap: 8px !important;
  }

  .categories-rail-section .section-heading,
  .section-heading {
    font-size: clamp(1.45rem, 6.5vw, 1.9rem);
    line-height: 1.12;
  }

  .categories-rail-section .nav-link {
    flex: 0 0 auto;
    font-size: 0.75rem !important;
  }

  .categories-rail {
    gap: 14px;
    margin-right: -16px;
    padding: 18px 16px 14px 0;
    overflow-x: auto;
    overscroll-behavior-x: contain;
    scroll-snap-type: x mandatory;
    scrollbar-width: none;
    touch-action: pan-x;
  }

  .categories-rail::-webkit-scrollbar,
  .product-rail::-webkit-scrollbar {
    display: none;
  }

  .category-circle-card {
    min-width: 78px;
    gap: 8px;
    scroll-snap-align: start;
  }

  .category-circle-thumb-wrapper {
    width: 68px;
    height: 68px;
  }

  .category-circle-name {
    max-width: 84px;
    font-size: 0.7rem;
    line-height: 1.25;
    white-space: normal;
    overflow-wrap: anywhere;
  }

  .flagship-section,
  .campaign-banner-section {
    padding: 36px 0;
  }

  .flagship-grid {
    gap: 22px;
  }

  .flagship-banner {
    aspect-ratio: 1 / 1.05;
  }

  .flagship-card-overlay {
    padding: 18px;
  }

  .flagship-card-overlay h3 {
    font-size: clamp(1.45rem, 7vw, 1.9rem) !important;
    line-height: 1.1;
  }

  .flagship-grid > div:last-child > div:last-child {
    grid-template-columns: repeat(2, minmax(0, 1fr)) !important;
    gap: 10px !important;
  }

  .products-grid {
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 10px;
    row-gap: 14px;
  }

  #app [style*="grid-template-columns: repeat(3, 1fr)"],
  #app [style*="grid-template-columns: repeat(4, 1fr)"] {
    grid-template-columns: repeat(2, minmax(0, 1fr)) !important;
    gap: 14px !important;

  // SQL-like operations
  select(tableName, predicate, sortFn, limit, offset) {
    const table = this.db.tables[tableName] || [];
    let result = predicate ? table.filter(predicate) : [...table];
    if (sortFn) result.sort(sortFn);
    const start = offset || 0;
    if (limit) {
      result = result.slice(start, start + limit);
    } else if (start > 0) {
      result = result.slice(start);
    }
    return JSON.parse(JSON.stringify(result));
  },

  insert(tableName, row) {
    if (!this.db.tables[tableName]) this.db.tables[tableName] = [];
    if (!row.id) {
      const maxId = this.db.tables[tableName].reduce((max, r) => Math.max(max, r.id || 0), 0);
      row.id = maxId + 1;
    }
    this.db.tables[tableName].push(row);
    this.save();
    return row;
  },

  update(tableName, predicate, updateFn) {
    const table = this.db.tables[tableName] || [];
    let count = 0;
    for (let i = 0; i < table.length; i++) {
      if (predicate(table[i])) {
        table[i] = updateFn(table[i]);
        count++;
      }
    }
    if (count > 0) this.save();
    return count;
  },

  delete(tableName, predicate) {
    const table = this.db.tables[tableName] || [];
    const prevLen = table.length;
    this.db.tables[tableName] = table.filter(r => !predicate(r));
    const removed = prevLen - this.db.tables[tableName].length;
    if (removed > 0) this.save();
    return removed;
  },

  // High-Level Storefront & Studio API
  getProducts(options = {}) {
    const {
      categorySlug,
      categoryId,
      query,
      sort,
      minPrice,
      maxPrice,
      inStockOnly,
      featuredOnly,
      bestsellersOnly,
      flagshipOnly,
      newOnly,
      limit,
      offset
    } = options;

    let targetCatId = categoryId;
    if (categorySlug && !targetCatId) {
      const cat = (this.db.tables.categories || []).find(c => c.slug === categorySlug);
      if (cat) targetCatId = cat.id;
    }

    const predicate = (p) => {
      if (p.status === "archived") return false;
      if (targetCatId && p.category_id !== targetCatId) return false;
      if (featuredOnly && !p.is_featured) return false;
      if (bestsellersOnly && !p.is_bestseller) return false;
      if (flagshipOnly && !p.is_flagship) return false;
      if (newOnly && !p.is_new) return false;
      if (inStockOnly && p.stock <= 0) return false;
      if (minPrice !== undefined && p.price < minPrice) return false;
      if (maxPrice !== undefined && p.price > maxPrice) return false;
      if (query) {
        const q = query.toLowerCase().trim();
        const inName = p.name.toLowerCase().includes(q);
        const inBrand = p.brand.toLowerCase().includes(q);
        const inDesc = p.description.toLowerCase().includes(q);
        const inSku = p.sku.toLowerCase().includes(q);
        const inTags = Array.isArray(p.tags) && p.tags.some(t => t.toLowerCase().includes(q));
        if (!inName && !inBrand && !inDesc && !inSku && !inTags) return false;
      }
      return true;
    };

    let sortFn = null;
    if (sort === "price-asc") {
      sortFn = (a, b) => a.price - b.price;
    } else if (sort === "price-desc") {
      sortFn = (a, b) => b.price - a.price;
    } else if (sort === "rating") {
      sortFn = (a, b) => b.rating - a.rating;
    } else if (sort === "newest") {
      sortFn = (a, b) => (b.is_new ? 1 : 0) - (a.is_new ? 1 : 0) || b.id - a.id;
    } else if (sort === "bestseller") {
      sortFn = (a, b) => (b.is_bestseller ? 1 : 0) - (a.is_bestseller ? 1 : 0);
    } else {
      // Default: featured first, then flagship, then rating
      sortFn = (a, b) => (b.is_flagship ? 1 : 0) - (a.is_flagship ? 1 : 0) || (b.is_featured ? 1 : 0) - (a.is_featured ? 1 : 0) || b.rating - a.rating;
    }

    const allMatched = this.select("products", predicate, sortFn);
    const totalCount = allMatched.length;
    const items = this.select("products", predicate, sortFn, limit, offset);

    return {
      items,
      totalCount
    };
  },

  getProductBySlug(slug) {
    const list = this.select("products", p => p.slug === slug);
    return list.length ? list[0] : null;
  },

  getProductById(id) {
    const list = this.select("products", p => Number(p.id) === Number(id));
    return list.length ? list[0] : null;
  },

  getRelatedProducts(product, limit = 4) {
    if (!product) return [];
    const list = this.select(
      "products",
      p => p.id !== product.id && (p.category_id === product.category_id || (Array.isArray(p.tags) && p.tags.some(t => (product.tags || []).includes(t)))),
      (a, b) => (b.category_id === product.category_id ? 1 : 0) - (a.category_id === product.category_id ? 1 : 0) || b.rating - a.rating,
      limit
    );
    return list;
  },

  getCategories() {
    return this.select("categories", null, (a, b) => a.id - b.id);
  },

  getPages(publishedOnly = false) {
    return this.select("pages", page => !publishedOnly || page.published);
  },

  getPageBySlug(slug, publishedOnly = false) {
    return this.select("pages", page => page.slug === slug && (!publishedOnly || page.published))[0] || null;
  },

  getCategoryBySlug(slug) {
    const list = this.select("categories", c => c.slug === slug);
    return list.length ? list[0] : null;
  },

  // Cart operations
  getCart() {
    return this.select("cart_items");
  },

  addToCart(productId, quantity = 1, size = null, color = null) {
    const product = this.getProductById(productId);
    if (!product) return false;
    const existing = (this.db.tables.cart_items || []).find(
      item => item.product_id === product.id && item.size === size && item.color === color
    );
    if (existing) {
      existing.quantity += quantity;
    } else {
      this.insert("cart_items", {
        product_id: product.id,
        name: product.name,
        brand: product.brand,
        price: product.price,
        original_price: product.original_price,
        image: product.images && product.images[0] ? product.images[0] : "",
        sku: product.sku,
        size: size || (product.sizes ? product.sizes[0] : null),
        color: color || (product.colors ? product.colors[0] : null),
        quantity: quantity,
        added_at: new Date().toISOString()
      });
    }
    this.save();
    return true;
  },

  updateCartQty(cartItemId, delta) {
    const item = (this.db.tables.cart_items || []).find(i => i.id === cartItemId);
    if (!item) return;
    item.quantity += delta;
    if (item.quantity <= 0) {
      this.delete("cart_items", i => i.id === cartItemId);
    } else {
      this.save();
    }
  },

  removeCartItem(cartItemId) {
    this.delete("cart_items", i => i.id === cartItemId);
  },

  clearCart() {
    this.db.tables.cart_items = [];
    this.save();
  },

  // Favorites
  getFavorites() {
    const favs = this.select("favorites") || [];
    const ids = favs.map(f => f.product_id);
    return this.select("products", p => ids.includes(p.id));
  },

  isFavorite(productId) {
    return (this.db.tables.favorites || []).some(f => f.product_id === productId);
  },

  toggleFavorite(productId) {
    const existing = (this.db.tables.favorites || []).find(f => f.product_id === productId);
    if (existing) {
      this.delete("favorites", f => f.product_id === productId);
      return false;
    } else {
      this.insert("favorites", { product_id: productId, added_at: new Date().toISOString() });
      return true;
    }
  },

  // Orders
  createOrder(orderData, items) {
    const orderNumber = "ORD-" + Math.floor(100000 + Math.random() * 900000);
    const newOrder = {
      order_number: orderNumber,
      ...orderData,
      items: items,
      status: "processing",
      created_at: new Date().toISOString()
    };
    const order = this.insert("orders", newOrder);

    // Deduct stock in products and inventory tables
    items.forEach(item => {
      this.update("products", p => p.id === item.product_id, p => {
        p.stock = Math.max(0, p.stock - (item.quantity || 1));
        return p;
      });
      this.update("inventory", inv => inv.product_id === item.product_id, inv => {
        inv.stock = Math.max(0, inv.stock - (item.quantity || 1));
        inv.status = inv.stock === 0 ? "out_of_stock" : (inv.stock <= inv.low_stock_threshold ? "low_stock" : "in_stock");
        return inv;
      });
    });

    this.clearCart();
    return order;
  },

  getOrder(orderNumber) {
    const list = this.select("orders", o => o.order_number === orderNumber);
    return list.length ? list[0] : null;
  },

  // Store & Settings
  getStore() {
    const list = this.select("store");
    return list.length ? list[0] : {};
  },

  updateStore(updates) {
    this.update("store", () => true, store => ({ ...store, ...updates }));
    return this.getStore();

  // Studio CRUD for Products
  async saveProduct(data) {
    if (builderPreviewMode) return persistBuilderCatalogChange("saveProduct", data);
    if (data.id) {
      this.update("products", p => p.id === Number(data.id), p => ({ ...p, ...data }));
      this.update("inventory", inv => inv.product_id === Number(data.id), inv => ({
        ...inv,
        sku: data.sku || inv.sku,
        stock: Number(data.stock !== undefined ? data.stock : inv.stock),
        cost_price: Number(data.cost_price !== undefined ? data.cost_price : inv.cost_price),
        selling_price: Number(data.price !== undefined ? data.price : inv.selling_price),
        status: (data.stock <= 0) ? "out_of_stock" : (data.stock <= 10 ? "low_stock" : "in_stock")
      }));
      return this.getProductById(data.id);
    } else {
      const slug = (data.name || "new-item").toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/(^-|-$)/g, "");
      const newProduct = {
        ...data,
        slug: slug + "-" + Date.now().toString().slice(-4),
        rating: 5.0,
        review_count: 0,
        status: data.status || "active",
        is_featured: data.is_featured ? 1 : 0,
        is_bestseller: data.is_bestseller ? 1 : 0,
        is_flagship: data.is_flagship ? 1 : 0,
        is_new: 1
      };
      const created = this.insert("products", newProduct);
      this.insert("inventory", {
        product_id: created.id,
        sku: created.sku,
        stock: Number(created.stock || 10),
        cost_price: Number(created.cost_price || 50),
        selling_price: Number(created.price || 150),
        low_stock_threshold: 10,
        status: "in_stock"
      });
      return created;
    }
  },

  async deleteProduct(id) {
    if (builderPreviewMode) return persistBuilderCatalogChange("deleteProduct", id);
    this.delete("products", p => p.id === Number(id));
    this.delete("inventory", inv => inv.product_id === Number(id));
    this.delete("favorites", f => f.product_id === Number(id));
    this.delete("cart_items", c => c.product_id === Number(id));
    return true;
  },

  async duplicateProduct(id) {
    if (builderPreviewMode) return persistBuilderCatalogChange("duplicateProduct", id);
    const source = this.getProductById(id);
    if (!source) return null;
    const copy = JSON.parse(JSON.stringify(source));
    delete copy.id;
    copy.name = copy.name + " (Copy)";
    copy.slug = copy.slug + "-copy-" + Date.now().toString().slice(-4);
    copy.sku = copy.sku + "-CPY";
    return this.saveProduct(copy);
  },

    if (data.id) {
      this.update("categories", c => c.id === Number(data.id), c => ({ ...c, ...data }));
    } else {
      const slug = (data.name || "category").toLowerCase().replace(/[^a-z0-9]+/g, "-");
      this.insert("categories", { ...data, slug });
    }
    return true;
  },

  async deleteCategory(id) {
    if (builderPreviewMode) return persistBuilderCatalogChange("deleteCategory", id);
    // Reassign products to general or delete
    this.delete("categories", c => c.id === Number(id));
    return true;
  },

  // Inventory updates
  async updateInventoryStock(productId, newStock) {
    if (builderPreviewMode) return persistBuilderCatalogChange("updateInventoryStock", productId, newStock);
    newStock = Math.max(0, Number(newStock));
    this.update("products", p => p.id === Number(productId), p => {
      p.stock = newStock;
      return p;
    });
    this.update("inventory", inv => inv.product_id === Number(productId), inv => {
      inv.stock = newStock;
      inv.status = newStock === 0 ? "out_of_stock" : (newStock <= inv.low_stock_threshold ? "low_stock" : "in_stock");
      return inv;
    });
    return true;
  },

  // Plans
  getPlans() {
    return this.select("plans");
  },

  selectPlan(planSlug) {
    this.update("plans", () => true, p => {
      p.is_current = p.slug === planSlug ? 1 : 0;
      return p;
    });
  }
};

  // Router, SEO, and Core Utilities for Craft
const AppUtils = {
  escapeHTML(str) {
    if (!str) return "";
    return String(str)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");
  },

  formatMoney(num) {
    const currency = String(SQLiteEngine.getStore().currency || "KES").toUpperCase();
    return new Intl.NumberFormat("en-KE", {
      style: "currency",
      currency: /^[A-Z]{3}$/.test(currency) ? currency : "KES",
      maximumFractionDigits: 2
    }).format(Number(num) || 0);
  },

  showToast(message, type = "success") {
    let container = document.getElementById("toast-container");
    if (!container) {
      container = document.createElement("div");
      container.id = "toast-container";
      container.className = "toast-container";
      document.body.appendChild(container);
    }
    const toast = document.createElement("div");
    toast.className = `toast ${type}`;
    toast.innerHTML = `
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 6L9 17l-5-5"/></svg>
      <span>${this.escapeHTML(message)}</span>
    `;
    container.appendChild(toast);
    setTimeout(() => {
      toast.style.opacity = "0";
      toast.style.transform = "translateY(10px)";
      setTimeout(() => toast.remove(), 300);
    }, 3200);
  },

  updateSEO({ title, description, url, image, schema }) {
    const fullTitle = title.includes("Craft") ? title : `${title} — Craft Atelier`;
    document.title = fullTitle;

    const setMeta = (nameOrProp, val, isProp = false) => {
      let el = document.querySelector(isProp ? `meta[property="${nameOrProp}"]` : `meta[name="${nameOrProp}"]`);
      if (!el) {
        el = document.createElement("meta");
        if (isProp) el.setAttribute("property", nameOrProp);
        else el.setAttribute("name", nameOrProp);
        document.head.appendChild(el);
      }
      el.setAttribute("content", val || "");
    };

    setMeta("description", description);
    setMeta("og:title", fullTitle, true);
    setMeta("og:description", description, true);
    setMeta("og:url", url || window.location.href, true);
    if (image) setMeta("og:image", image, true);
    setMeta("twitter:title", fullTitle);
    setMeta("twitter:description", description);

    // Schema JSON-LD
    let script = document.getElementById("structured-data-jsonld");
    if (!script) {
      script = document.createElement("script");
      script.id = "structured-data-jsonld";
      script.type = "application/ld+json";
      document.head.appendChild(script);
    }
    if (schema) {
      script.textContent = JSON.stringify(schema);
    } else {
      script.textContent = JSON.stringify({
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "Craft Atelier",
        "url": window.location.origin
      });
    }
  }
};

const AppController = {
  carouselTimer: null,

  storefrontVisitorId() {
    if (!window.__ESHOP_CLOUDFLARE_STOREFRONT__ || builderPreviewMode) return "";
    try {
      const key = "ESHOP_STOREFRONT_VISITOR_V1";
      let id = window.localStorage.getItem(key);
      if (!id) {
        id = globalThis.crypto?.randomUUID?.() || "";
        if (id) window.localStorage.setItem(key, id);
      }
      return id;
    } catch (error) {
      console.error("Anonymous storefront activity could not be initialized.", error);
      return "";
    }
  },

  recordStorefrontVisit(path) {
    const visitorId = this.storefrontVisitorId();
    if (!visitorId || path === "/account" || path.startsWith("/account/") || path === "/pos" || path.startsWith("/pos/")) return;
    void fetch("/api/analytics/visit", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ visitor_id: visitorId, path: path.split(/[?#]/, 1)[0] || "/" })
    }).then(response => {
      if (!response.ok) throw new Error(`Visit analytics request failed (${response.status}).`);
    }).catch(error => console.error("Storefront visit could not be reported.", error));
  },

  recordProductInterest(productId, action, value) {
    const visitorId = this.storefrontVisitorId();
    if (!visitorId) return;
    const detail = action === "cart" ? { quantity: value } : { saved: value };
    void fetch("/api/product-interest", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ visitor_id: visitorId, product_id: productId, action, ...detail })
    }).then(response => {
      if (!response.ok) throw new Error(`Product interest request failed (${response.status}).`);
    }).catch(error => console.error("Product interest could not be reported.", error));
  },

  recordCartInterest(productId) {
    const quantity = SQLiteEngine.getCart()
      .filter(item => Number(item.product_id) === Number(productId))
      .reduce((sum, item) => sum + (Number(item.quantity) || 0), 0);
    this.recordProductInterest(productId, "cart", quantity);
  },

  async submitProductHold(form) {
    const status = form.querySelector("[data-hold-status]");
    const submit = form.querySelector('button[type="submit"]');
    const productId = form.dataset.productId;
    const formData = new FormData(form);
    const quantity = Number(formData.get("quantity"));
    const customerName = String(formData.get("customerName") || "").trim();
    const contact = String(formData.get("contact") || "").trim();
    if (!customerName || !contact || !Number.isSafeInteger(quantity) || quantity < 1) {
      if (status) status.textContent = "Enter your name, a valid contact, and quantity.";
      return;
    }
    if (submit) submit.disabled = true;
    if (status) status.textContent = "Sending your request…";
    try {
      const idempotencyKey = form.dataset.idempotencyKey || globalThis.crypto.randomUUID();
      form.dataset.idempotencyKey = idempotencyKey;
      const response = await fetch("/api/product-holds", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          idempotency_key: idempotencyKey,
          product_id: productId,
          quantity,
          customer_name: customerName,
          contact
        })
      });
      const result = await response.json().catch(() => ({}));
      if (!response.ok || !result.hold?.id) {
        throw new Error(result.error || `The shop could not accept this request (${response.status}).`);
      }
      delete form.dataset.idempotencyKey;
      form.reset();
      if (status) status.textContent = "Request sent. The product is not reserved unless the shop owner approves it.";
    } catch (error) {
      console.error("Product hold request could not be sent.", error);
      if (status) status.textContent = error instanceof Error ? error.message : "Your request could not be sent. Please retry.";
    } finally {
      if (submit) submit.disabled = false;
    }
  },

  async loadCloudflareCatalog() {
    const cacheKey = `ESHOP_CLOUDFLARE_CATALOG_CACHE_V1:${window.location.hostname.toLowerCase()}`;
    let catalog;
    try {
      const response = await fetch("/api/catalog", { cache: "no-store" });
      if (!response.ok) throw new Error(`Catalog request failed (${response.status}).`);
      catalog = await response.json();
      if (!Array.isArray(catalog.products) || !Array.isArray(catalog.categories)) {
        throw new Error("The published catalog response has an invalid shape.");
      }
      window.localStorage.setItem(cacheKey, JSON.stringify(catalog));
    } catch (error) {
      let cached;
      try {
        cached = JSON.parse(window.localStorage.getItem(cacheKey) || "null");
      } catch {
        cached = null;
      }
      if (!Array.isArray(cached?.products) || !Array.isArray(cached?.categories)) {
        if (error instanceof TypeError && navigator.onLine === false) {
          throw new Error("You're offline and this device has no saved copy of this website yet.");
        }
        throw error;
      }
      catalog = cached;
      window.__ESHOP_OFFLINE_CATALOG__ = true;
    }
    SQLiteEngine.db.tables.products = catalog.products;
    SQLiteEngine.db.tables.categories = catalog.categories;
    SQLiteEngine.db.tables.inventory = [];
    if (catalog.store && typeof catalog.store === "object") {
    SQLiteEngine.db.tables.store = [catalog.store];
    }
    SQLiteEngine.save();

      html = PageRenderers.renderCheckout();
    } else if (path === "/checkout/confirmation") {
      html = PageRenderers.renderOrderConfirmation(params.get("orderId"), params.get("reference"));
    } else if (path === "/favorites") {
      html = PageRenderers.renderFavorites();
    } else if (path === "/account") {
      html = StudioRenderers.renderAccount();
    } else if (path === "/account/store") {
      html = StudioRenderers.renderStudioStore();
    } else if (path === "/account/products") {
      html = StudioRenderers.renderProductsManager();
    } else if (path === "/account/dashboard") {
      html = StudioRenderers.renderDashboard(params.get("period") || "30d");
    } else if (path === "/account/categories") {
      html = StudioRenderers.renderCategoriesManager();
    } else if (path === "/account/inventory") {
      html = StudioRenderers.renderInventory();
    } else if (path === "/account/settings") {
      html = StudioRenderers.renderSettings();
    } else if (path === "/account/web") {
      html = StudioRenderers.renderWeb();
    } else if (path === "/account/plans") {
      html = StudioRenderers.renderPlans();
    } else if (["/privacy", "/terms", "/cookies", "/about", "/contact", "/help", "/faq", "/shipping", "/returns"].includes(path)) {
      html = StudioRenderers.renderStaticPage(path.replace("/", ""));
    } else {
      // 404 handler
      html = `
        ${StoreRenderers.renderNavbar()}
        <main class="container" style="padding: 100px 0; text-align: center;">
          <h1 style="font-family: var(--font-serif); font-size: 3rem; margin-bottom: 12px;">404 &bull; Page Not Found</h1>
          <p style="color: var(--text-muted); margin-bottom: 32px;">The screen you are seeking is unavailable or has been relocated.</p>
          <a href="/" class="btn-primary" data-route="/" style="max-width: 200px; margin: 0 auto;">Return to Home</a>
        </main>
        ${StoreRenderers.renderFooter()}
      `;
    }

    appRoot.innerHTML = html;
    if (shouldScroll) window.scrollTo(0, 0);

    // Post-render lifecycle setups
    this.postRenderSetup(path, params);
    window.applyBuilderElementEdits(SQLiteEngine.getStore().element_edits);
  },

  postRenderSetup(path, params) {
    // 1. Hero Carousel Setup
    const heroSection = document.getElementById("hero-carousel");
    if (heroSection) {
      this.initHeroCarousel();
    }

    // 2. Search dropdown wiring
    this.initSearchInputs();

    // 3. Category filters
    this.initCategoryFilters();

    // 4. Product detail interactions
    this.initProductDetail();

    // 5. Checkout forms
    this.initCheckoutForm();
    void this.initPaystackReturn();

    // 6. Studio editor modals & inputs
    this.initStudioModals();
  },

  initHeroCarousel() {
    const slides = document.querySelectorAll(".hero-slide");
    const dots = document.querySelectorAll(".hero-dot");
    const prevBtn = document.getElementById("hero-prev");
    const nextBtn = document.getElementById("hero-next");
    const carousel = document.getElementById("hero-carousel");
    if (!slides.length) return;

    this.carouselIndex = 0;
    const showSlide = (idx) => {
      this.carouselIndex = (idx + slides.length) % slides.length;
      slides.forEach((s, i) => s.classList.toggle("active", i === this.carouselIndex));
      dots.forEach((d, i) => d.classList.toggle("active", i === this.carouselIndex));
    };

    if (prevBtn) prevBtn.onclick = () => showSlide(this.carouselIndex - 1);
    if (nextBtn) nextBtn.onclick = () => showSlide(this.carouselIndex + 1);

    dots.forEach((dot, i) => {
      dot.onclick = () => showSlide(i);
    });

    const startAuto = () => {
      if (this.carouselTimer) clearInterval(this.carouselTimer);
      this.carouselTimer = setInterval(() => {
        showSlide(this.carouselIndex + 1);
      }, 5500);
    };

    startAuto();

    if (carousel) {
      carousel.addEventListener("mouseenter", () => {
        if (this.carouselTimer) clearInterval(this.carouselTimer);
      });
      carousel.addEventListener("mouseleave", () => {
        startAuto();
      });
    }
  },

  initSearchInputs() {
    const input = document.getElementById("navbar-search-input");
    const dropdown = document.getElementById("search-quick-dropdown");
    if (!input || !dropdown) return;

    let debounceTimer = null;
    input.addEventListener("input", (e) => {
      clearTimeout(debounceTimer);
      const q = e.target.value.trim();
      if (q.length < 2) {
        dropdown.classList.remove("active");
        dropdown.innerHTML = "";
        return;
      }
      debounceTimer = setTimeout(() => {
        const results = SQLiteEngine.getProducts({ query: q, limit: 5 }).items;
        if (!results.length) {
          dropdown.innerHTML = `<div style="padding: 16px; font-size: 0.8125rem; color: var(--text-muted); text-align: center;">No pieces found for "${AppUtils.escapeHTML(q)}"</div>`;
        } else {
          dropdown.innerHTML = `
            ${results.map(p => `
              <a href="/product/${p.slug}" class="search-result-item" data-route="/product/${p.slug}">
                <img src="${p.images && p.images[0] ? p.images[0] : ''}" alt="" class="search-result-thumb">
                <div style="flex: 1;">
                  <div style="font-weight: 500; font-size: 0.875rem;">${AppUtils.escapeHTML(p.name)}</div>
                  <div style="font-size: 0.75rem; color: var(--text-muted);">${AppUtils.escapeHTML(p.brand)} &bull; ${AppUtils.formatMoney(p.price)}</div>
                </div>
              </a>
            `).join("")}
            <a href="/search?q=${encodeURIComponent(q)}" class="search-result-item" data-route="/search?q=${encodeURIComponent(q)}" style="font-weight: 600; font-size: 0.8125rem; justify-content: center; background: var(--surface-subtle);">
              View all results for "${AppUtils.escapeHTML(q)}" &rarr;
            </a>
          `;
        }
        dropdown.classList.add("active");
      }, 180);
    });

    input.addEventListener("keydown", (e) => {
      if (e.key === "Enter") {
        e.preventDefault();
        const q = input.value.trim();
        dropdown.classList.remove("active");
        if (q) this.navigate(`/search?q=${encodeURIComponent(q)}`);
      }
    });

    document.addEventListener("click", (e) => {
      if (!e.target.closest(".search-box")) {
        dropdown.classList.remove("active");
      }
    });
  },

  initCategoryFilters() {
    const sortSelect = document.getElementById("cat-sort-select");
    const priceFilter = document.getElementById("cat-price-filter");
    const stockFilter = document.getElementById("cat-stock-filter");
    const resetBtn = document.getElementById("reset-cat-filters");

    const apply = () => {
      const path = this.currentRoute().split("?")[0];
      const params = new URLSearchParams();
      if (sortSelect && sortSelect.value !== "featured") params.set("sort", sortSelect.value);
      if (priceFilter && priceFilter.value) {
        if (priceFilter.value === "0-200") params.set("maxPrice", "200");
        else if (priceFilter.value === "200-500") { params.set("minPrice", "200"); params.set("maxPrice", "500"); }
        else if (priceFilter.value === "500-1000") { params.set("minPrice", "500"); params.set("maxPrice", "1000"); }
        else if (priceFilter.value === "1000+") params.set("minPrice", "1000");
      }
      if (stockFilter && stockFilter.checked) params.set("inStock", "1");
      const qs = params.toString();
      this.navigate(path + (qs ? `?${qs}` : ""));
    };

    if (sortSelect) sortSelect.onchange = apply;
    if (priceFilter) priceFilter.onchange = apply;
    if (stockFilter) stockFilter.onchange = apply;
    if (resetBtn) resetBtn.onclick = () => this.navigate(this.currentRoute().split("?")[0]);
  },

    const mainImg = document.getElementById("main-product-img");
    thumbs.forEach(btn => {

    // Option Chips

      chip.onclick = () => {

        if (parent) {
          parent.querySelectorAll(".option-chip").forEach(c => c.classList.remove("active"));
          chip.classList.add("active");
        }
      };

    // Quantity Stepper

        const qty = Number(qtyInput ? qtyInput.value : 1);
        const activeSize = document.querySelector("#product-size-chips .option-chip.active");

        SQLiteEngine.addToCart(prodId, qty, activeSize ? activeSize.getAttribute("data-val") : null, activeColor ? activeColor.getAttribute("data-val") : null);

  initCheckoutForm() {
    const form = document.getElementById("checkout-main-form");
    if (form) {
      form.onsubmit = async (e) => {
        e.preventDefault();
        const submit = form.querySelector('button[type="submit"]');
        const status = form.querySelector("[data-checkout-status]");
        if (submit) submit.disabled = true;
        if (status) status.textContent = builderPreviewMode
          ? "Preview only — payment is disabled."
          : "Creating your order and opening Paystack…";
        const formData = new FormData(form);
        const cart = SQLiteEngine.getCart();
        if (!cart.length) {
          if (status) status.textContent = "Your bag is empty.";
          if (submit) submit.disabled = false;
          return;
        }
        const customerName = `${formData.get("firstName")} ${formData.get("lastName")}`.trim();
        const customerEmail = String(formData.get("email") || "").trim();
        const customerPhone = String(formData.get("phone") || "").trim();
        if (!customerName || !customerEmail) {
          if (status) status.textContent = "Enter your name and email to continue.";
          if (submit) submit.disabled = false;
          return;
        }

        let order;
        try {
          if (builderPreviewMode) {
            order = await persistBuilderCatalogChange("createOrder", {
              customer_name: customerName,
              customer_email: customerEmail,
              customer_phone: customerPhone,
              payment_method: "Preview only",
              payment_status: "unpaid"
            }, cart);
            SQLiteEngine.insert("orders", order);
            SQLiteEngine.clearCart();
            for (const productId of new Set(cart.map(item => item.product_id))) this.recordProductInterest(productId, "cart", 0);
            this.navigate(`/checkout/confirmation?orderId=${encodeURIComponent(order.order_number)}`);
            return;
          } else {
            const currency = String(SQLiteEngine.getStore().currency || "KES").toUpperCase();
            if (currency !== "KES") {
              throw new Error(`Paystack checkout currently requires KES. This shop is set to ${currency}; change its currency and prices before taking payments.`);
            }
            const cartSignature = cart
              .map(item => [String(item.product_id), Number(item.quantity || 1)])
              .sort(([left], [right]) => left.localeCompare(right));
            const idempotencyStorageKey = `ESHOP_STOREFRONT_CHECKOUT_IDEMPOTENCY_V1:${encodeURIComponent(JSON.stringify({
              customerEmail,
              cart: cartSignature
            }))}`;
            const idempotencyKey = window.sessionStorage.getItem(idempotencyStorageKey)
              || globalThis.crypto.randomUUID();
            window.sessionStorage.setItem(idempotencyStorageKey, idempotencyKey);
            const response = await fetch("/api/orders", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({
                idempotency_key: idempotencyKey,
                customer_name: customerName,
                customer_email: customerEmail,
                customer_phone: customerPhone,
                items: cart.map(item => ({ product_id: item.product_id, quantity: Number(item.quantity || 1) }))
              })
            });
            const result = await response.json().catch(() => ({}));
            if (!response.ok || !result.order?.order_number) {
              throw new Error(result.error || `The shop could not accept this order (${response.status}).`);
            }
            order = result.order;
            window.sessionStorage.removeItem(idempotencyStorageKey);
            const host = window.location.hostname.toLowerCase();
            const tenantId = host === "rrobin.co.ke" || host === "www.rrobin.co.ke"
              ? "main"
              : host.endsWith(".rrobin.co.ke") ? host.slice(0, -".rrobin.co.ke".length) : "";
            SQLiteEngine.insert("orders", {
              tenant_id: tenantId,
              order_number: order.order_number,
              customer_name: order.customer_name,
              customer_email: order.customer_email,
              customer_phone: order.customer_phone,
              status: order.status,
              payment_status: order.payment_status,
              payment_method: "Paystack",
              subtotal: order.subtotal,
              discount: order.discount,
              shipping: order.shipping,
              total: order.total,
              currency: order.currency,
              items: order.items.map(item => ({
                product_id: item.product_id, name: item.name, quantity: item.quantity, price: item.unit_price
              })),
              created_at: order.created_at
            });
            SQLiteEngine.clearCart();
            for (const productId of new Set(cart.map(item => item.product_id))) this.recordProductInterest(productId, "cart", 0);
          }
        } catch (error) {
          console.error("Could not save the checkout order.", error);
          if (status) status.textContent = error instanceof Error ? error.message : "Could not create the order.";
          if (submit) submit.disabled = false;
          return;
        }
        window.__ESHOP_APPLIED_DISCOUNT = 0;
        if (builderPreviewMode) return;
        try {
          const response = await fetch("/api/payments/paystack/initialize", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ order_number: order.order_number })
          });
          const result = await response.json().catch(() => ({}));
          if (!response.ok || typeof result.authorization_url !== "string") {
            throw new Error(result.error || `Paystack could not start checkout (${response.status}).`);
          }
          const authorizationUrl = new URL(result.authorization_url);
          if (authorizationUrl.protocol !== "https:" || authorizationUrl.hostname !== "checkout.paystack.com") {
            throw new Error("Paystack returned an unsafe checkout URL.");
          }
          this.navigate(`/checkout/confirmation?orderId=${encodeURIComponent(order.order_number)}&reference=${encodeURIComponent(result.reference || "")}`);
          window.location.assign(authorizationUrl.toString());
        } catch (error) {
          console.error("Paystack checkout could not start.", error);
          if (status) status.textContent = error instanceof Error ? error.message : "Paystack checkout could not start.";
          this.navigate(`/checkout/confirmation?orderId=${encodeURIComponent(order.order_number)}`);
        }
      };
    }
  },

  async initPaystackReturn() {
    if (builderPreviewMode) return;
    const [path, queryString] = this.currentRoute().split("?");
    if (path !== "/checkout/confirmation") return;
    const params = new URLSearchParams(queryString || "");
    const reference = params.get("reference");
    const orderNumber = params.get("orderId");
    const status = document.querySelector("[data-payment-status]");
    const retry = document.querySelector("[data-paystack-retry]");
    retry?.addEventListener("click", async () => {
      retry.disabled = true;
      retry.textContent = "Opening Paystack…";
      try {
        const response = await fetch("/api/payments/paystack/initialize", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ order_number: orderNumber })
        });
        const result = await response.json().catch(() => ({}));
        if (!response.ok || typeof result.authorization_url !== "string") {
          throw new Error(result.error || `Paystack could not start checkout (${response.status}).`);
        }
        const authorizationUrl = new URL(result.authorization_url);
        if (authorizationUrl.protocol !== "https:" || authorizationUrl.hostname !== "checkout.paystack.com") {
          throw new Error("Paystack returned an unsafe checkout URL.");
        }
        window.location.assign(authorizationUrl.toString());
      } catch (error) {
        retry.disabled = false;
        retry.textContent = "Continue to secure payment";
        if (status) status.textContent = error instanceof Error ? error.message : "Paystack checkout could not start.";
      }
    });
    if (!reference) return;
    if (status) status.textContent = "Checking payment with Paystack…";
    try {
      const response = await fetch(`/api/payments/paystack/verify?reference=${encodeURIComponent(reference)}`, {
        cache: "no-store"
      });
      const result = await response.json().catch(() => ({}));
      if (!response.ok) throw new Error(result.error || `Payment verification failed (${response.status}).`);
      const order = SQLiteEngine.select("orders", item => item.order_number === result.order_number)[0];
      if (order) {
        SQLiteEngine.update("orders", item => item.order_number === result.order_number, item => ({
          ...item,
          payment_status: result.payment_status,
          payment_method: result.payment_status === "paid" ? "Paystack" : "Paystack payment pending",
          status: result.payment_status === "paid" ? "paid" : item.status
        }));
      }
      if (status) status.textContent = result.payment_status === "paid"
        ? "Payment confirmed by Paystack."
        : result.payment_status === "failed" ? "Payment was not completed. No payment was recorded."
          : "Payment is still pending confirmation.";
      if (result.payment_status === "paid" && retry) retry.hidden = true;
      if (result.payment_status === "paid") {
        const message = document.querySelector("[data-payment-message]");
        if (message) message.textContent = "Your payment has been confirmed securely by Paystack.";
      }
    } catch (error) {
      if (status) status.textContent = error instanceof Error ? error.message : "Could not verify this payment.";
    }
  },
