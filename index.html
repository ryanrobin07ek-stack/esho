<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Craft</title>
  <meta name="description" content="Browse the Craft online store.">
  <meta property="og:title" content="Craft">
  <meta property="og:description" content="Browse the Craft online store.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="/">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <style>
/* Craft Premium Commerce & Studio Design System */
:root {
  --bg: #FFFFFF;
  --surface: #FFFFFF;
  --surface-subtle: #F5F5F5;
  --surface-hover: #EBEBEB;
  --text-main: #18181B;
  --text-muted: #66666B;
  --text-dim: #8A8A90;
  --border: #E2E2E5;
  --border-subtle: #F0F0F1;
  --accent: #18181B;
  --accent-hover: #333337;
  --accent-light: #F1F1F2;
  --accent-contrast: #FFFFFF;
  --badge-bg: #F0F0F1;
  --badge-text: #3A3A3D;
  --success: #1E6B42;
  --success-bg: #EBF7EE;
  --warning: #B45309;
  --warning-bg: #FEF3C7;
  --danger: #991B1B;
  --danger-bg: #FEE2E2;
  --font-main: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --font-serif: "Playfair Display", Georgia, "Times New Roman", serif;
  --font-display: Impact, Haettenschweiler, "Arial Narrow", "sans-serif-condensed", sans-serif;
  --radius: 4px;
  --radius-sm: 2px;
  --radius-lg: 8px;
  --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.04);
  --shadow-md: 0 4px 12px rgba(0, 0, 0, 0.05);
  --shadow-lg: 0 12px 32px rgba(0, 0, 0, 0.08);
  --transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
  --container-max: 1360px;
}

/* Base Reset */
*, *::before, *::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html {
  font-size: 16px;
  scroll-behavior: smooth;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

body {
  background-color: var(--bg);
  color: var(--text-main);
  font-family: var(--font-main);
  line-height: 1.5;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

body.app-shell {
  background-color: var(--bg);
}

body.app-shell #app {
  flex: 1 0 auto;
  min-height: 100vh;
  background-color: var(--bg);
}

/* Reduced Motion */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
    scroll-behavior: auto !important;
  }
}

a {
  color: inherit;
  text-decoration: none;
}

img {
  max-width: 100%;
  height: auto;
  display: block;
}

button, input, select, textarea {
  font-family: inherit;
  font-size: inherit;
}

input[type="radio"],
input[type="checkbox"] {
  accent-color: var(--accent);
}

button {
  cursor: pointer;
  border: none;
  background: none;
}

/* Utility Containers */
.container {
  width: 100%;
  max-width: var(--container-max);
  margin-left: auto;
  margin-right: auto;
  padding-left: 24px;
  padding-right: 24px;
}

@media (max-width: 768px) {
  .container {
    padding-left: 16px;
    padding-right: 16px;
  }
}

/* Announcement Bar */
.announcement-bar {
  background-color: var(--accent);
  color: var(--accent-contrast);
  font-size: 0.8125rem;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  padding: 8px 16px;
  text-align: center;
  font-weight: 500;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
}

/* Storefront Navbar */
.navbar {
  position: sticky;
  top: 0;
  z-index: 100;
  background-color: var(--surface);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--border);
  transition: var(--transition);
}

.nav-container {
  display: flex;
  align-items: center;
  justify-content: space-between;
  height: 72px;
  gap: 20px;
}

.nav-left {
  display: flex;
  align-items: center;
  gap: 32px;
}

.brand-logo {
  font-size: 1.35rem;
  font-weight: 700;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  display: flex;
  align-items: center;
  gap: 10px;
}

.brand-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background-color: var(--accent);
}

.studio-module-navbar .nav-container {
  height: 58px;
}

.studio-module-navbar .nav-left {
  width: auto;
  flex: 1;
  min-width: 0;
  gap: 4px;
}

.studio-module-navbar .studio-module-brand {
  min-width: 0;
  gap: 10px;
}

.studio-module-brand img {
  width: 38px;
  height: 38px;
  object-fit: contain;
}

.studio-module-title {
  font-family: var(--font-display);
  font-size: clamp(1.3rem, 7vw, 2.5rem);
  font-weight: 900;
  line-height: 0.95;
  letter-spacing: -0.025em;
  text-transform: uppercase;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.studio-module-navbar .nav-menu,
.studio-module-navbar .nav-center {
  display: none;
}

.studio-module-navbar .nav-right {
  display: flex;
  flex: 0 0 auto;
  gap: 0;
}

.studio-module-navbar .studio-profile-btn {
  width: 38px;
  height: 38px;
  border: 1px solid #343434;
  border-radius: 50%;
  background: #171717;
  color: #fff;
  box-shadow: 0 2px 7px rgba(0, 0, 0, .22);
}

.studio-module-navbar .studio-profile-btn:hover {
  background: #292929;
  border-color: #555;
}

.studio-module-navbar .studio-profile-btn:focus-visible {
  outline: 2px solid #171717;
  outline-offset: 3px;
}

.nav-menu {
  display: flex;
  align-items: center;
  gap: 24px;
  list-style: none;
}

.nav-link {
  font-size: 0.875rem;
  font-weight: 500;
  color: var(--text-muted);
  transition: var(--transition);
  padding: 8px 0;
  position: relative;
}

.nav-link:hover, .nav-link.active {
  color: var(--text-main);
}

.nav-link.active::after {
  content: "";
  position: absolute;
  bottom: 0;
  left: 0;
  right: 0;
  height: 2px;
  background-color: var(--accent);
}

.nav-center {
  flex: 1;
  max-width: 440px;
  position: relative;
}

.search-box {
  position: relative;
  width: 100%;
}

.search-input {
  width: 100%;
  height: 42px;
  padding: 0 16px 0 40px;
  background-color: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  color: var(--text-main);
  font-size: 0.875rem;
  outline: none;
  transition: var(--transition);
}

.search-input:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 1px var(--accent);
}

.search-icon {
  position: absolute;
  left: 14px;
  top: 50%;
  transform: translateY(-50%);
  color: var(--text-dim);
  pointer-events: none;
  display: flex;
}

.search-dropdown {
  position: absolute;
  top: calc(100% + 8px);
  left: 0;
  right: 0;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  box-shadow: var(--shadow-lg);
  max-height: 420px;
  overflow-y: auto;
  z-index: 150;
  display: none;
}

.search-dropdown.active {
  display: block;
}

.search-result-item {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 10px 14px;
  border-bottom: 1px solid var(--border-subtle);
  transition: var(--transition);
}

.search-result-item:hover {
  background-color: var(--surface-subtle);
}

.search-result-thumb {
  width: 44px;
  height: 52px;
  object-fit: cover;
  border-radius: var(--radius-sm);
  background-color: var(--surface-subtle);
}

.nav-right {
  display: flex;
  align-items: center;
  gap: 14px;
}

.nav-icon-btn {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 42px;
  height: 42px;
  border-radius: var(--radius);
  color: var(--text-main);
  position: relative;
  transition: var(--transition);
}

.nav-icon-btn:hover {
  background-color: var(--surface-hover);
}

.nav-badge {
  position: absolute;
  top: 4px;
  right: 4px;
  background-color: var(--accent);
  color: var(--accent-contrast);
  font-size: 0.6875rem;
  font-weight: 700;
  min-width: 18px;
  height: 18px;
  padding: 0 4px;
  border-radius: 9px;
  display: flex;
  align-items: center;
  justify-content: center;
}

.btn-studio-pill {
  background-color: var(--surface);
  border: 1px solid var(--border);
  padding: 8px 14px;
  border-radius: var(--radius);
  font-size: 0.8125rem;
  font-weight: 600;
  color: var(--text-main);
  display: flex;
  align-items: center;
  gap: 8px;
  transition: var(--transition);
}

.btn-studio-pill:hover {
  background-color: var(--accent);
  color: var(--accent-contrast);
  border-color: var(--accent);
}

/* Mobile Nav Toggle */
.mobile-menu-btn {
  display: none;
  width: 42px;
  height: 42px;
  align-items: center;
  justify-content: center;
  color: var(--text-main);
}

@media (max-width: 1024px) {
  .nav-menu {
    display: none;
  }
  .mobile-menu-btn {
    display: flex;
  }
}

@media (max-width: 768px) {
  .navbar:not(.studio-module-navbar) .nav-container {
    height: auto;
    min-height: 72px;
    flex-wrap: wrap;
    gap: 0 8px;
  }
  .navbar:not(.studio-module-navbar) .nav-left {
    order: 1;
    gap: 12px;
  }
  .navbar:not(.studio-module-navbar) .nav-right {
    order: 2;
    gap: 8px;
  }
  .navbar:not(.studio-module-navbar) .nav-center {
    display: block;
    order: 3;
    flex: 0 0 100%;
    max-width: none;
    padding-bottom: 12px;
  }
  .btn-studio-pill span {
    display: none;
  }
}

.launchpad {
  --launch-blue: var(--accent);
  height: 100vh;
  height: 100svh;
  min-height: 0;
  padding: clamp(24px, 5vw, 64px);
  display: flex;
  flex-direction: column;
  justify-content: flex-start;
  overflow-x: auto;
  color: var(--accent-contrast);
  background: var(--launch-blue);
  font-family: var(--font-display);
}

.launchpad-top,
.launchpad-footer,
.launchpad-link-meta {
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.launchpad-top {
  gap: 16px;
  font-family: var(--font-main);
  font-size: 0.7rem;
  font-weight: 700;
  letter-spacing: 0.16em;
  text-transform: uppercase;
}

.launchpad-brand {
  font-size: 1rem;
  letter-spacing: 0.1em;
}

.launchpad-main {
  width: min(100%, 920px);
  margin: 10px auto 0;
  padding: 0;
  flex: 1;
  min-height: 0;
  display: flex;
  flex-direction: column;
  justify-content: flex-start;
}

.launchpad-eyebrow,
.launchpad-footer {
  font-family: var(--font-main);
  font-size: 0.7rem;
  font-weight: 700;
  letter-spacing: 0.16em;
  text-transform: uppercase;
}

.launchpad-title {
  margin: 6px 0 clamp(12px, 2vh, 18px);
  font-size: clamp(4.4rem, 17vw, 10rem);
  font-weight: 900;
  line-height: 0.88;
  letter-spacing: -0.035em;
  text-transform: uppercase;
  white-space: nowrap;
}

.launchpad-title span {
  display: block;
}

.launchpad-logo {
  display: block;
  width: 40px;
  height: 40px;
  object-fit: contain;
}

.launchpad-links {
  flex: 1;
  min-height: 0;
  border-top: 1px solid color-mix(in srgb, var(--accent-contrast) 55%, transparent);
  display: flex;
  flex-direction: column;
}

.launchpad-link {
  width: 100%;
  min-height: 76px;
  padding: 6px 4px;
  flex: 1 1 0;
  display: flex;
  flex-direction: column;
  justify-content: center;
  border-top: 0;
  border-right: 0;
  border-left: 0;
  border-bottom: 1px solid color-mix(in srgb, var(--accent-contrast) 55%, transparent);
  background: transparent;
  color: inherit;
  font: inherit;
  text-align: left;
  transition: padding 180ms ease, color 180ms ease, background 180ms ease;
}

a.launchpad-link:hover,
a.launchpad-link:focus-visible {
  padding-right: 20px;
  padding-left: 20px;
  color: var(--text-main);
  background: var(--accent-light);
  outline: none;
}

.launchpad-link-meta {
  font-family: var(--font-main);
  font-size: 0.64rem;
  font-weight: 700;
  letter-spacing: 0.13em;
  text-transform: uppercase;
}

.launchpad-link-title {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  font-size: clamp(3rem, 11vw, 6.5rem);
  font-family: var(--font-display);
  font-weight: 900;
  line-height: 0.95;
  letter-spacing: -0.025em;
  text-transform: uppercase;
}

.launchpad-arrow {
  flex: 0 0 auto;
  font-family: Arial, sans-serif;
  font-size: 0.42em;
  font-weight: 400;
}

.launchpad-link-disabled {
  color: color-mix(in srgb, var(--accent-contrast) 48%, transparent);
}

.launchpad-link-disabled .launchpad-link-title {
  text-decoration: line-through;
  text-decoration-thickness: 2px;
  text-decoration-color: color-mix(in srgb, var(--accent-contrast) 42%, transparent);
}

.launchpad-footer {
  gap: 12px;
  margin-top: 8px;
  color: color-mix(in srgb, var(--accent-contrast) 76%, transparent);
}

@media (max-width: 480px) {
  .launchpad {
    padding: 18px 22px 10px;
  }

  .launchpad-top,
  .launchpad-footer {
    font-size: 0.58rem;
    letter-spacing: 0.1em;
  }

  .launchpad-title {
    font-size: clamp(3.5rem, 16vw, 5.8rem);
  }

  .launchpad-link-title {
    font-size: clamp(2.8rem, 11vw, 4.2rem);
  }
}

/* Mobile Drawer */
.mobile-drawer-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.4);
  z-index: 200;
  opacity: 0;
  visibility: hidden;
  transition: var(--transition);
}

.mobile-drawer-overlay.active {
  opacity: 1;
  visibility: visible;
}

.mobile-drawer {
  position: fixed;
  top: 0;
  left: 0;
  bottom: 0;
  width: 82%;
  max-width: 340px;
  background: var(--surface);
  z-index: 201;
  transform: translateX(-100%);
  transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
  display: flex;
  flex-direction: column;
  padding: 24px;
  overflow-y: auto;
}

.mobile-drawer.active {
  transform: translateX(0);
}

.mobile-drawer-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding-bottom: 20px;
  border-bottom: 1px solid var(--border);
}

.mobile-nav-list {
  list-style: none;
  margin-top: 20px;
  display: flex;
  flex-direction: column;
  gap: 16px;
}

.mobile-nav-link {
  font-size: 1.125rem;
  font-weight: 500;
  display: block;
  padding: 6px 0;
}

/* Hero Carousel */
.hero-section {
  position: relative;
  overflow: hidden;
  background-color: #141414;
  color: #FFFFFF;
}

.hero-carousel {
  position: relative;
  width: 100%;
  height: 640px;
}

@media (max-width: 768px) {
  .hero-carousel {
    height: 480px;
  }
}

.hero-slide {
  position: absolute;
  inset: 0;
  opacity: 0;
  visibility: hidden;
  transition: opacity 0.8s cubic-bezier(0.16, 1, 0.3, 1), transform 0.8s cubic-bezier(0.16, 1, 0.3, 1);
  transform: scale(1.02);
  display: flex;
  align-items: center;
}

.hero-slide.active {
  opacity: 1;
  visibility: visible;
  transform: scale(1);
}

.hero-bg-img {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  filter: brightness(0.65);
}

.hero-content {
  position: relative;
  z-index: 10;
  max-width: 680px;
  padding: 40px 0;
}

.hero-badge {
  display: inline-block;
  font-size: 0.75rem;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  font-weight: 600;
  padding: 6px 12px;
  background: rgba(255, 255, 255, 0.15);
  backdrop-filter: blur(8px);
  border: 1px solid rgba(255, 255, 255, 0.25);
  border-radius: var(--radius-sm);
  margin-bottom: 18px;
}

.hero-title {
  font-family: var(--font-serif);
  font-size: 3.25rem;
  line-height: 1.12;
  font-weight: 400;
  margin-bottom: 16px;
  letter-spacing: -0.01em;
}

@media (max-width: 768px) {
  .hero-title {
    font-size: 2.2rem;
  }
}

.hero-subtitle {
  font-size: 1.0625rem;
  line-height: 1.6;
  color: rgba(255, 255, 255, 0.85);
  margin-bottom: 28px;
}

.hero-cta {
  display: inline-flex;
  align-items: center;
  gap: 12px;
  background: #FFFFFF;
  color: #111111;
  font-size: 0.875rem;
  font-weight: 600;
  padding: 14px 28px;
  border-radius: var(--radius);
  letter-spacing: 0.03em;
  transition: var(--transition);
}

.hero-cta:hover {
  background: #E5E5E5;
  transform: translateY(-2px);
}

.hero-controls {
  position: absolute;
  bottom: 28px;
  right: 28px;
  display: flex;
  align-items: center;
  gap: 12px;
  z-index: 20;
}

.hero-arrow-btn {
  width: 44px;
  height: 44px;
  background: rgba(0, 0, 0, 0.4);
  backdrop-filter: blur(6px);
  border: 1px solid rgba(255, 255, 255, 0.2);
  color: #FFFFFF;
  border-radius: var(--radius);
  display: flex;
  align-items: center;
  justify-content: center;
  transition: var(--transition);
}

.hero-arrow-btn:hover {
  background: rgba(255, 255, 255, 0.2);
}

.hero-dots {
  display: flex;
  gap: 8px;
  align-items: center;
}

.hero-dot {
  width: 28px;
  height: 3px;
  background: rgba(255, 255, 255, 0.3);
  transition: var(--transition);
  cursor: pointer;
}

.hero-dot.active {
  background: #FFFFFF;
  width: 44px;
}

/* Circular Category Navigation Rail */
.categories-rail-section {
  padding: 48px 0 24px;
  border-bottom: 1px solid var(--border);
}

.section-eyebrow {
  font-size: 0.75rem;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--text-muted);
  font-weight: 600;
  margin-bottom: 6px;
}

.section-heading {
  font-family: var(--font-serif);
  font-size: 2rem;
  font-weight: 400;
  color: var(--text-main);
  letter-spacing: -0.01em;
}

.studio-architecture-eyebrow {
  font-family: var(--font-main);
  font-size: 0.7rem;
  font-weight: 700;
  letter-spacing: 0.16em;
}

.studio-architecture-title {
  font-family: var(--font-display);
  font-size: clamp(1.65rem, 7.5vw, 2.5rem);
  font-weight: 900;
  line-height: 0.95;
  letter-spacing: -0.025em;
  text-transform: uppercase;
}

.categories-rail {
  display: flex;
  gap: 24px;
  overflow-x: auto;
  padding: 24px 0 16px;
  scrollbar-width: thin;
  -webkit-overflow-scrolling: touch;
}

.category-circle-card {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 12px;
  min-width: 96px;
  text-align: center;
  transition: var(--transition);
}

.category-circle-card:hover {
  transform: translateY(-4px);
}

.category-circle-thumb-wrapper {
  width: 84px;
  height: 84px;
  border-radius: 50%;
  overflow: hidden;
  border: 1px solid var(--border);
  background-color: var(--surface-subtle);
  position: relative;
  box-shadow: var(--shadow-sm);
}

.category-circle-img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  transition: transform 0.4s ease;
}

.category-circle-card:hover .category-circle-img {
  transform: scale(1.08);
}

.category-circle-name {
  font-size: 0.8125rem;
  font-weight: 600;
  color: var(--text-main);
  white-space: nowrap;
}

/* Flagship Editorial Section */
.flagship-section {
  padding: 64px 0;
  border-bottom: 1px solid var(--border);
}

.flagship-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 40px;
  align-items: center;
}

@media (max-width: 900px) {
  .flagship-grid {
    grid-template-columns: 1fr;

.badge-flagship {

.product-list-details {

.product-manager-title {

  font-size: clamp(2.25rem, 10vw, 3.25rem);

}

.studio-back-link {
  display: inline-flex;

  gap: 6px;
  min-height: 32px;

}

.studio-table-container {

}

.studio-table {

}

.studio-table th {

}

.studio-table td {

}

.studio-table tr:hover {

/* Metric KPI Cards */
.metrics-row {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 20px;
  margin-bottom: 32px;
}

@media (max-width: 960px) {
  .metrics-row {
    grid-template-columns: repeat(2, 1fr);
  }
}

@media (max-width: 480px) {
  .metrics-row {

.metric-card {

}

.metric-value {

}

.metric-trend {

}

.inventory-metrics {

}

.inventory-metrics .metric-card {

.inventory-metrics .metric-label {

.inventory-metrics .metric-value {

.inventory-metrics .metric-card > span:last-child {

.inventory-list {

}

.inventory-search {

.inventory-item {

.inventory-item summary {

.inventory-item-stock {

}

.inventory-item-price {

  white-space: nowrap;
}

.inventory-item-details {

.inventory-item-details strong {

.inventory-item-actions {

.inventory-edit-field {

  font-size: 0.875rem;
}

.inventory-save-button {

.plans-main {

}

}

.plans-list {

.plan-card-description {

.plan-card-features {

.plan-card-action {

@media (max-width: 600px) {
  .plans-list {
    grid-template-columns: minmax(0, 1fr);

.pos-main {
  padding-top: 16px;

.pos-header,

.pos-total-line,
.pos-record-head,

.pos-header p,

.pos-brand,

  display: inline-flex;

.pos-brand {

  font-size: clamp(2.25rem, 10vw, 3.25rem);

.pos-brand img {

.pos-content .btn-primary {

.pos-content .btn-secondary {

}

.pos-bottom-nav {
  position: fixed;
  z-index: 900;
  right: 12px;
  bottom: calc(10px + env(safe-area-inset-bottom, 0px));
  left: 12px;
  display: flex;
  max-width: 620px;
  min-height: 52px;
  gap: 0;
  align-items: center;
  justify-content: flex-start;
  margin: 0 auto;
  padding: 5px 7px;
  overflow-x: auto;
  overflow-y: hidden;
  border: 1px solid var(--border);
  border-radius: 999px;
  background: var(--surface);
  box-shadow: 0 5px 24px rgba(0, 0, 0, 0.14);
  scrollbar-width: none;
  -webkit-overflow-scrolling: touch;
  touch-action: pan-x;
}

.pos-bottom-nav::-webkit-scrollbar {
  display: none;
}

.pos-tab {
  position: relative;
  display: inline-flex;
  flex: 0 0 auto;
  min-width: 0;
  min-height: 40px;
  align-items: center;
  justify-content: center;
  padding: 0 13px;
  color: var(--text-muted);
  font-size: 0.72rem;
  font-weight: 650;
  white-space: nowrap;
  -webkit-tap-highlight-color: transparent;
}

.pos-tab.is-active {
  color: var(--text-main);
  font-weight: 800;
  background: transparent;
}

.pos-tab:active { background: transparent; }

.pos-tab + .pos-tab {
  border-left: 1px solid var(--border);
}

.pos-tab.is-active::after {
  position: absolute;
  right: 35%;
  bottom: 3px;
  left: 35%;
  height: 2px;
  border-radius: 2px;
  background: var(--accent);
  content: "";
}

.pos-tabs {
  display: flex;
  gap: 6px;
  overflow-x: auto;
  padding: 0 0 14px;
  margin-bottom: 14px;
  border-bottom: 1px solid var(--border);
  scrollbar-width: thin;
}

.pos-subnav {
  position: sticky;
  top: env(safe-area-inset-top, 0px);
  z-index: 20;
  display: flex;
  gap: 2px;
  margin: 0 -16px 12px;
  padding: 4px 16px;
  overflow-x: auto;
  border-bottom: 1px solid var(--border);
  background: var(--bg);
  scrollbar-width: none;
}

.pos-main-with-tabs .pos-brand {

  font-size: 1.12rem;

  text-transform: none;
}

.pos-main-with-tabs > .pos-content > .pos-section-heading h2 { display: none; }

.pos-overview-tabs {

  z-index: 90;
  background: var(--bg);
}

.pos-subnav::-webkit-scrollbar {
  display: none;
}

.pos-subnav .pos-tab.is-active::after,
.pos-overview-tabs .pos-tab.is-active::after {
  display: block;
}

.pos-subnav .pos-tab.is-active,
.pos-overview-tabs .pos-tab.is-active {
  background: transparent !important;
  color: #18181b !important;
}

.pos-subnav .pos-tab {

}

.pos-more-links {

}

.pos-quote-product {

  margin-top: 8px;
  padding-top: 8px;
  border-top: 1px solid var(--border);
  gap: 7px;
}

.pos-payment-options {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 6px;
}

.pos-payment-option {
  display: flex;
  min-width: 0;
  min-height: 36px;
  align-items: center;
  justify-content: center;
  gap: 4px;
  padding: 3px 4px;
  border: 1px solid var(--border);
  border-radius: 12px;
  background: var(--bg);
  color: var(--text-main);
  font: 650 0.68rem var(--font-main);
  cursor: pointer;
}

.pos-payment-option.is-selected {
  border-color: var(--accent);
  box-shadow: inset 0 0 0 1px var(--accent);
  background: var(--surface-subtle);
}

.pos-payment-logo {
  width: 17px;
  height: 14px;
  flex: 0 0 auto;
  fill: none;
  stroke: currentColor;
  stroke-linecap: round;
  stroke-linejoin: round;
  stroke-width: 1.7;
}

.pos-payment-mpesa {
  display: inline-flex;
  width: 17px;
  height: 17px;
  align-items: center;
  justify-content: center;
  border-radius: 50%;
  background: #39a935;
  color: #fff;
  font-size: 0.7rem;
  font-weight: 800;
}

.pos-customer-fields {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 7px;
}

.pos-customer-fields .pos-field {
  gap: 2px;
}

.pos-customer-fields .pos-field > span {
  font-size: 0.63rem;
}

.pos-customer-fields input {
  min-height: 30px;
  padding: 0 7px;
  font-size: 0.76rem;
}

.pos-checkout-totals {
  display: grid;
  grid-template-columns: 1fr 1fr;
  column-gap: 12px;
}

.pos-checkout-totals .is-total {
  grid-column: 1 / -1;
}

.pos-checkout .pos-total-line {
  padding: 3px 0;
  font-size: 0.74rem;
}

.pos-checkout .pos-total-line.is-total {
  padding: 6px 0 2px;
  font-size: 0.86rem;
}

.pos-credit-details {
  color: var(--text-muted);
  font-size: 0.7rem;
}

.pos-credit-details summary {
  cursor: pointer;
}

.pos-checkout-actions {
  display: grid;
  grid-template-columns: auto 1fr;
  gap: 7px;
}

.pos-checkout-actions button {
  height: 30px;
  min-height: 30px;
  padding: 0 6px;
  border-radius: 10px;
  font-size: 0.66rem;
}

.pos-checkout-actions .btn-primary,
.pos-checkout-actions .btn-secondary {
  height: 30px;
  min-height: 30px;
  padding: 0 6px;
}

.pos-checkout .pos-help {
  margin: 0;
  font-size: 0.66rem;
}

.pos-total-line {
  padding: 5px 0;
  color: var(--text-muted);
  font-size: 0.82rem;
}

.pos-total-line b {
  color: var(--text-main);
}

.pos-total-line.is-total {
  padding: 10px 0;
  border-top: 1px solid var(--border);
  color: var(--text-main);
  font-size: 0.95rem;
}

.pos-action-wide {
  width: 100%;
}

.pos-help {
  line-height: 1.45;
}

.pos-insights {
  display: grid;
  gap: 7px;
  color: var(--text-muted);
  font-size: 0.8rem;
}

.pos-insight-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 10px 0;
  border-top: 1px solid var(--border-subtle);
}

.pos-insight-row p {
  margin-top: 3px;
  color: var(--text-muted);
  font-size: 0.75rem;
}

.pos-goal-track {
  width: 100%;
  height: 7px;
  margin: 8px 0;
  overflow: hidden;
  border-radius: 99px;
  background: var(--surface);
}

.pos-goal-track > span {
  display: block;
  height: 100%;
  border-radius: inherit;
  background: var(--accent);
}

.pos-insight-alert {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  gap: 8px;
  padding: 10px 0;
  border-bottom: 1px solid var(--border);
}

.pos-insight-alert > div:first-child {
  min-width: 0;
}

.pos-insight-alert strong {
  font-size: 0.76rem;
}

.pos-insight-alert p {
  margin: 4px 0;
  color: var(--text-muted);
  font-size: 0.7rem;
}

.pos-insight-alert a {
  font-size: 0.7rem;
  font-weight: 700;
}

.pos-insight-alert.is-critical {
  border-left: 3px solid #dc2626;
  padding-left: 8px;
}

.pos-insight-alert.is-warning {
  border-left: 3px solid #d97706;
  padding-left: 8px;
}

.pos-insight-alert.is-neutral {
  border-left: 3px solid var(--accent);
  padding-left: 8px;
}

.pos-alert-actions {
  display: flex;
  align-items: flex-start;
  gap: 5px;
}

.pos-alert-actions button {
  min-height: 28px;
  padding: 0 7px;
  border: 1px solid var(--border);
  border-radius: 7px;
  color: var(--text-muted);
  background: var(--surface);
  font-size: 0.65rem;
}

.pos-insights-dashboard {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  align-items: start;
  gap: 12px;
}

.pos-insights-dashboard > .pos-card {
  min-width: 0;
  padding: 14px;
}

.pos-insights-dashboard .pos-insight-row {
  align-items: center;
  padding: 8px 0;
}

.pos-insights-dashboard .pos-insight-row strong,
.pos-insights-dashboard .pos-insight-row span {
  min-width: 0;
  font-size: 0.76rem;
}

.pos-insights-dashboard .pos-insight-row p,
.pos-insights-dashboard .pos-help {
  font-size: 0.7rem;
}

.pos-insights-dashboard .pos-category-row {
  padding: 7px 0;
}

.pos-insights-dashboard .pos-category-row > strong {
  min-width: 0;
  overflow-wrap: anywhere;
  font-size: 0.76rem;
}

.pos-insights-dashboard .pos-category-row > b {
  flex: 0 0 auto;
  font-size: 0.74rem;
}

.pos-filter-row,
.pos-inline-form,
.pos-form-actions {
  display: flex;
  flex-wrap: wrap;
  align-items: end;
  gap: 8px;
}

.pos-filter-row {
  flex-wrap: nowrap;
  align-items: center;
  gap: 6px;
}

.pos-filter-row input {
  flex: 1 1 auto;
  height: 38px;
  min-height: 38px;
  padding: 0 14px;
  border-radius: 999px;
  font-size: 0.78rem;
}

.pos-filter-row select {
  flex: 0 1 132px;
  width: 132px;
  height: 38px;
  min-height: 38px;
  padding: 0 12px;
  border-radius: 999px;
  font-size: 0.78rem;
}

.pos-scanner-entry .btn-secondary {
  min-height: 38px;
  border-radius: 999px;
}

@media (max-width: 380px) {
  .pos-filter-row select {
    flex-basis: 112px;
    width: 112px;
    padding: 0 5px;
    font-size: 0.72rem;
  }
}

.pos-inline-form > .pos-field,
.pos-inline-form > input {
  flex: 1 1 140px;
}

.pos-table-wrap {
  width: 100%;
  overflow-x: auto;
}

.pos-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 0.78rem;
}

.pos-table th,
.pos-table td {
  padding: 9px 7px;
  border-bottom: 1px solid var(--border-subtle);
  text-align: left;
  white-space: nowrap;
}

.pos-table th {
  color: var(--text-muted);
  font-size: 0.68rem;
  font-weight: 650;
}

.pos-row-actions {
  display: flex;
  gap: 5px;
}

.pos-row-actions .btn-primary,
.pos-row-actions .btn-secondary {
  min-height: 32px;
  padding: 0 8px;
  font-size: 0.68rem;
}

.pos-file-button {
  position: relative;
  overflow: hidden;
  cursor: pointer;
}

.pos-file-button input {
  position: absolute;
  width: 1px;
  height: 1px;
  overflow: hidden;
  opacity: 0;
}

.pos-category-list {
  display: grid;
  gap: 2px;
  margin-top: 12px;
}

.pos-category-row {
  min-height: 44px;
  padding: 7px 0;
  border-top: 1px solid var(--border-subtle);
  font-size: 0.78rem;
}

.pos-category-row > strong {
  flex: 1;
}

.pos-category-row .btn-primary,
.pos-category-row .btn-secondary {
  min-height: 34px;
  padding: 0 9px;
}

.pos-metrics {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
  gap: 9px;
}

.pos-metric {
  min-width: 0;
  padding: 14px;
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  background: var(--surface);
}

.pos-metric small,
.pos-metric span {
  display: block;
  color: var(--text-muted);
  font-size: 0.7rem;
}

.pos-metric strong {
  display: block;
  overflow: hidden;
  margin: 5px 0 3px;
  font-size: 1.15rem;
  text-overflow: ellipsis;
}

.pos-overview-card {
  min-width: 0;
  min-height: 260px;
  padding: 24px;
  overflow: hidden;
  border: 0;
  border-radius: 24px;
  background: #111;
  color: #fff;
}

.pos-revenue-card {
  min-height: 320px;
  padding: 20px;
  border-radius: 22px;
}

.pos-revenue-chart {
  min-width: 0;
  padding-top: 8px;
}

.pos-revenue-chart-total {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 10px;
}

.pos-revenue-chart-total span {
  color: var(--text-muted);
  font-size: 0.75rem;
}

.pos-revenue-chart-total strong {
  font-size: 1.25rem;
  font-variant-numeric: tabular-nums;
}

.pos-revenue-chart svg {
  display: block;
  width: 100%;
  min-height: 210px;
  overflow: visible;
}

.pos-revenue-chart-area {
  fill: rgba(35, 35, 35, 0.12);
}

.pos-revenue-chart-line {
  fill: none;
  stroke: var(--accent);
  stroke-linecap: round;
  stroke-linejoin: round;
  stroke-width: 3;
}

.pos-profit-chart-zero {
  stroke: var(--border);
  stroke-dasharray: 4 4;
  stroke-width: 1;
}

.pos-revenue-chart-point {
  fill: var(--surface);
  stroke: var(--accent);
  stroke-width: 2;
}

.pos-revenue-chart-label {
  fill: var(--text-muted);
  font: 11px var(--font-main);
}

.pos-overview-metrics {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  align-content: space-between;
  min-height: 212px;
  gap: 18px;
}

.pos-overview-metric {
  min-width: 0;
  padding: 0;
}

.pos-overview-metric:nth-child(even) {
  text-align: right;
}

.pos-overview-metric small,
.pos-overview-metric span {
  display: block;
  overflow: hidden;
  color: #b7b7b7;
  font-size: 0.74rem;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.pos-overview-metric strong {
  display: block;
  overflow-wrap: anywhere;
  margin: 6px 0 3px;
  color: #fff;
  font-size: clamp(0.95rem, 4vw, 1.25rem);
  font-variant-numeric: tabular-nums;
  line-height: 1.2;
}

.pos-record {
  padding: 0;
  overflow: hidden;
}

.pos-record-head {
  width: 100%;
  padding: 14px;
  border: 0;
  background: transparent;
  text-align: left;
}

.pos-record-head > span:first-child {
  min-width: 0;
  flex: 1;
}

.pos-record-head > span:last-child {
  display: grid;
  justify-items: end;
  gap: 5px;
}

.pos-record-head small {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.pos-status {
  display: inline-flex;
  width: fit-content;
  padding: 3px 7px;
  border-radius: 99px;
  background: var(--surface-subtle);
  color: var(--text-muted);
  font-size: 0.65rem;
  text-transform: capitalize;
}

.pos-status.is-good {
  background: var(--success-bg);
  color: var(--success);
}

.pos-status.is-warning {
  background: var(--warning-bg);
  color: var(--warning);
}

.pos-record-details {
  display: grid;
  gap: 10px;
  padding: 0 14px 14px;
}

.pos-invoice-row {
  flex-wrap: wrap;
  padding: 12px;
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  background: var(--surface);
}

.pos-invoice-row > div {
  min-width: 150px;
  flex: 1;
}

.pos-empty {
  display: grid;
  gap: 5px;
  padding: 20px 12px;
  color: var(--text-muted);
  text-align: center;
}

.pos-empty strong {
  color: var(--text-main);
}

.pos-clock {
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}

.pos-scanner-overlay {
  position: fixed;
  z-index: 10000;
  inset: 0;
  overflow: hidden;
  background: #111;
  color: #fff;
}

.pos-scanner-shell {
  position: absolute;
  z-index: 1;
  inset: 0;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  padding: max(20px, env(safe-area-inset-top)) 20px max(24px, env(safe-area-inset-bottom));
  background: linear-gradient(180deg, rgb(0 0 0 / 68%), transparent 32%, transparent 58%, rgb(0 0 0 / 68%));
  color: #fff;
}

.pos-scanner-video {
  position: absolute;
  z-index: 0;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.pos-scanner-header,
.pos-scanner-footer {
  position: relative;
  z-index: 2;
  width: min(100%, 560px);
  margin-inline: auto;
  text-align: center;
  text-shadow: 0 1px 4px #000;
}

.pos-scanner-header h2 {
  margin: 0 0 8px;
  color: #fff;
  font-size: clamp(1.35rem, 5vw, 1.8rem);
}

.pos-scanner-header p {
  margin: 0;
  color: #fff;
  font-size: 0.95rem;
}

.pos-scanner-frame {
  position: absolute;
  z-index: 2;
  top: 50%;
  left: 50%;
  width: min(76vw, 360px);
  height: min(38vw, 180px);
  min-height: 120px;
  border: 3px solid #fff;
  border-radius: 18px;
  box-shadow: 0 0 0 9999px rgb(0 0 0 / 20%), 0 0 16px rgb(0 0 0 / 55%);
  transform: translate(-50%, -50%);
  pointer-events: none;
}

.pos-scanner-frame::after {
  position: absolute;
  top: 50%;
  right: 12px;
  left: 12px;
  height: 2px;
  background: #4ade80;
  box-shadow: 0 0 10px #4ade80;
  content: "";
}

.pos-scanner-status {
  display: inline-block;
  max-width: 100%;
  margin: 0 0 14px;
  padding: 10px 14px;
  border-radius: 999px;
  background: rgb(0 0 0 / 72%);
  color: #fff;
  font-size: 0.95rem;
  text-shadow: none;
}

.pos-scanner-status[data-state="success"] {
  background: #166534;
}

.pos-scanner-status[data-state="error"],
.pos-scanner-status[data-state="notice"] {
  background: #92400e;
}

.pos-scanner-close {
  display: block;
  width: min(100%, 360px);
  min-height: 48px;
  margin: 0 auto;
  border: 1px solid rgb(255 255 255 / 70%);
  border-radius: 12px;
  background: rgb(0 0 0 / 72%);
  color: #fff;
  font: inherit;
  font-weight: 600;
}

.pos-scanner-modes {
  display: flex;
  width: min(100%, 360px);
  gap: 8px;
  margin: 0 auto 12px;
}

.pos-scanner-mode {
  flex: 1;
  min-height: 44px;
  border: 1px solid rgb(255 255 255 / 80%);
  border-radius: 10px;
  background: rgb(0 0 0 / 76%);
  color: #fff;
  font: inherit;
  font-weight: 600;
}

.pos-scanner-mode.is-active {
  border-color: #fff;
  background: #fff;
  color: #111;
}

.pos-scanner-label-result {
  display: grid;
  gap: 8px;
  width: min(100%, 420px);
  max-height: 42vh;
  overflow: auto;
  margin: 0 auto 12px;
  padding: 12px;
  border-radius: 12px;
  background: #fff;
  color: #18181b;
  text-align: left;
  text-shadow: none;
}

.pos-scanner-label-result[hidden] {
  display: none;
}

.pos-scanner-label-result label {
  display: grid;
  gap: 4px;
  font-size: .85rem;
  font-weight: 600;
}

.pos-scanner-label-result input {
  box-sizing: border-box;
  width: 100%;
  min-height: 42px;
  padding: 8px 10px;
  border: 1px solid #cbd5e1;
  border-radius: 8px;
  color: #111827;
  font: inherit;
}

.pos-scanner-label-result pre {
  max-height: 90px;
  overflow: auto;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
  font-size: .8rem;
}

.pos-scanner-label-result .pos-scanner-close {
  width: 100%;
  min-height: 42px;
  border-color: #d1d5db;
  background: #f3f4f6;
  color: #111827;
  text-shadow: none;
}

.pos-scanner-label-result .pos-scanner-confirm {
  border-color: #0369a1;
  background: #0369a1;
  color: #fff;
}

.pos-image-category-suggestions {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}

.pos-image-category-suggestions[hidden] {
  display: none;
}

.pos-image-category-suggestions button {
  display: grid;
  gap: 3px;
  text-align: left;
}

.pos-image-category-suggestions small {
  opacity: .75;
}

.pos-product-image-preview {
  width: min(100%, 240px);
  max-height: 240px;
  border-radius: 12px;
  object-fit: contain;
}

.pos-image-match {
  display: grid;
  grid-template-columns: 48px minmax(0, 1fr) auto;
  align-items: center;
  gap: 10px;
  width: 100%;
  min-height: 58px;
  padding: 7px;
  border: 1px solid #d1d5db;
  border-radius: 10px;
  background: #fff;
  color: #18181b;
  font: inherit;
  text-align: left;
}

.pos-image-match img {
  width: 48px;
  height: 48px;
  border-radius: 7px;
  object-fit: cover;
}

.pos-image-match span {
  display: grid;
  gap: 3px;
  min-width: 0;
}

.pos-image-match small {
  color: #52525b;
  font-size: .75rem;
}

.pos-toast {
  position: fixed;
  z-index: 9999;
  right: 16px;
  bottom: 18px;
  left: 16px;
  width: fit-content;
  max-width: calc(100% - 32px);
  margin: 0 auto;
  padding: 11px 16px;
  border-radius: var(--radius);
  background: var(--accent);
  color: var(--accent-contrast);
  font-size: 0.82rem;
  opacity: 0;
  pointer-events: none;
  transform: translateY(8px);
  transition: var(--transition);
}

.pos-toast.is-visible {
  opacity: 1;
  transform: translateY(0);
}

.pos-toast.is-error {
  background: var(--danger);
}

@media (max-width: 760px) {
  .pos-insights-dashboard {
    grid-template-columns: 1fr;
  }

  .pos-insight-alert {
    grid-template-columns: 1fr;
  }

  .pos-alert-actions {
    justify-content: flex-end;
  }

  .pos-store-layout {
    grid-template-areas: "products" "cart";
    grid-template-columns: 1fr;
  }

  .pos-product-grid {
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 6px;
  }

  .pos-cart {
    position: static;
  }
}

@media (max-width: 520px) {
  .pos-main {
    padding-right: 12px;
    padding-left: 12px;
  }

  .pos-header {
    align-items: flex-end;
  }

  .pos-product-tile {
    min-height: 120px;
    padding: 6px;
    border-radius: 12px;
  }

  .pos-product-tile strong {
    margin-top: 5px;
    font-size: 0.68rem;
  }

  .pos-product-tile > span:not(.pos-product-placeholder) {
    font-size: 0.68rem;
  }

  .pos-product-tile small {
    font-size: 0.6rem;
  }

  .pos-card {
    padding: 12px;
  }

  .pos-category-row {
    gap: 7px;
  }
}

/* Modals */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.5);
  backdrop-filter: blur(4px);
  z-index: 300;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 12px;
  opacity: 0;
  visibility: hidden;
  transition: var(--transition);
}

.modal-overlay.active {
  opacity: 1;
  visibility: visible;
}

.modal-card {
  background: var(--surface);
  border-radius: var(--radius-lg);
  max-width: min(600px, calc(100vw - 24px));
  width: 100%;
  max-height: 90vh;
  max-height: 90dvh;
  overflow-y: auto;
  overflow-x: hidden;
  box-shadow: var(--shadow-lg);
  padding: clamp(16px, 4vw, 32px);
  position: relative;
}

.product-editor-form,
.product-editor-form .form-grid,
.product-editor-form .form-field {
  min-width: 0;
}

.product-editor-title {
  margin: 0 40px 16px 0;
  font-family: var(--font-main);
  font-size: 1.25rem;
  font-weight: 700;
  line-height: 1.2;
}

.product-editor-form .form-grid {
  grid-template-columns: minmax(0, 1fr);
}

.product-editor-form input,
.product-editor-form select,
.product-editor-form textarea {
  width: 100%;
  min-width: 0;
}

.product-editor-checks,
.product-editor-actions {
  display: flex;
  flex-wrap: wrap;
  gap: 12px;
}

.product-editor-actions > button {
  min-width: 0;
  flex: 1 1 140px;
}

.modal-close-btn {
  position: absolute;
  top: 20px;
  right: 20px;
  width: 36px;
  height: 36px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--text-muted);
}

.modal-close-btn:hover {
  background: var(--surface-hover);
  color: var(--text-main);
}

/* Toast Notifications */
.toast-container {
  position: fixed;
  bottom: 24px;
  right: 24px;
  z-index: 400;
  display: flex;
  flex-direction: column;
  gap: 10px;
  pointer-events: none;
}

.toast {
  background: var(--accent);
  color: var(--accent-contrast);
  padding: 12px 20px;
  border-radius: var(--radius);
  box-shadow: var(--shadow-lg);
  font-size: 0.875rem;
  font-weight: 500;
  display: flex;
  align-items: center;
  gap: 12px;
  pointer-events: auto;
  animation: toastIn 0.3s cubic-bezier(0.16, 1, 0.3, 1);
}

@media (max-width: 680px) {
  body.app-shell .toast-container {
    right: 12px;
    bottom: calc(88px + env(safe-area-inset-bottom, 0px));
    left: 12px;
    z-index: 1101;
    align-items: center;
  }

  body.app-shell .toast {
    box-sizing: border-box;
    width: min(100%, 560px);
  }
}

@keyframes toastIn {
  from { opacity: 0; transform: translateY(12px); }
  to { opacity: 1; transform: translateY(0); }
}

/* Footer */
.footer {
  background: #141413;
  color: #FFFFFF;
  margin-top: auto;
  padding: 80px 0 40px;
  border-top: 1px solid #282826;
}

.footer-grid {
  display: grid;
  grid-template-columns: 2fr 1fr 1fr 1fr 1fr;
  gap: 48px;
  margin-bottom: 64px;
}

@media (max-width: 1024px) {
  .footer-grid {
    grid-template-columns: 1fr 1fr;
    gap: 32px;
  }
}

@media (max-width: 600px) {
  .footer-grid {
    grid-template-columns: 1fr;
  }
}

.footer-col-title {
  font-size: 0.8125rem;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  font-weight: 700;
  color: #FFFFFF;
  margin-bottom: 20px;
}

.footer-links-list {
  list-style: none;
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.footer-link {
  font-size: 0.875rem;
  color: #A3A39D;
  transition: var(--transition);
}

.footer-link:hover {
  color: #FFFFFF;
  text-decoration: underline;
}

.footer-bottom {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding-top: 32px;
  border-top: 1px solid #282826;
  font-size: 0.8125rem;
  color: #73736C;
  flex-wrap: wrap;
  gap: 16px;
}

  // Robust Embedded Browser Relational SQLite Engine for Craft
const SQLiteEngine = {
  db: {

  storageKey: "ESHOP_SQLITE_DB_V1",
  emptyCatalogKey: "ESHOP_EMPTY_WEB_CATALOG_V1",

        this.db.tables[table] = this.db.tables[table] || [];
      }
    } else {
      this.seedInitial(seedCategories, seedProducts, seedStore, seedPlans, seedAnalytics);
    }
    if (window.localStorage.getItem(this.emptyCatalogKey) === "1") {
      if (window.localStorage.getItem(this.storeBrandKey) !== "1") {
        const store = this.getStore();

          this.updateStore({

            },

          ).catch(error => console.warn("Cloudflare visit analytics could not be recorded.", error));
        }
      }
      window.localStorage.setItem(this.storeBrandKey, "1");

    }

    for (const table of ["categories", "products", "inventory", "favorites", "cart_items", "hero_slides"]) {
      this.db.tables[table] = [];
    }
    this.db.tables.orders = (this.db.tables.orders || []).filter(
      order => !["ORD-94812", "ORD-94813"].includes(order.order_number)
    );
    this.db.tables.store = (this.db.tables.store || []).map(store => ({
      ...store,
      name: "Craft",
      title: "Craft",
      tagline: "",
      description: "",
      location: "",
      email: "",
      phone: "",
      announcement: "",
      announcement_active: 0
    }));
    await window.ShopSQLite.save(this.db);
    window.localStorage.setItem(this.emptyCatalogKey, "1");
    window.localStorage.setItem(this.storeBrandKey, "1");
  },
  seedInitial(seedCategories, seedProducts, seedStore, seedPlans, seedAnalytics) {
    this.db = {
      tables: {
        store: [{ ...seedStore }],
        categories: JSON.parse(JSON.stringify(seedCategories)),
        products: JSON.parse(JSON.stringify(seedProducts)),
        tenant_catalogs: [],
        website_themes: [],
        web_visits: [],
        web_events: [],
        newsletter_subscribers: [],
        booking_holds: [],
        customer_points: [],
        payment_methods: [],
        studio_settings: [],
        pages: [],
        inventory: seedProducts.map(p => ({
          id: p.id,
          product_id: p.id,
          sku: p.sku,
          stock: p.stock,
          cost_price: p.cost_price,
          selling_price: p.price,
          low_stock_threshold: 10,
          status: p.stock === 0 ? "out_of_stock" : (p.stock <= 10 ? "low_stock" : "in_stock")
        })),

        cart_items: [],
        orders: [],
        hero_slides: [],
        plans: JSON.parse(JSON.stringify(seedPlans)),
        analytics: [seedAnalytics]
      }
    };
    this.save();
  },

  save() {
    if (window.ShopSQLite) window.ShopSQLite.scheduleSave(this.db);
  },

  reset(seedCategories, seedProducts, seedStore, seedPlans, seedAnalytics) {
    this.seedInitial(seedCategories, seedProducts, seedStore, seedPlans, seedAnalytics);
  },
  // SQL-like operations
  select(tableName, predicate, sortFn, limit, offset) {
    const table = this.db.tables[tableName] || [];
    let result = predicate ? table.filter(predicate) : [...table];
    if (sortFn) result.sort(sortFn);
    const start = offset || 0;
    if (limit) {
      result = result.slice(start, start + limit);
    } else if (start > 0) {
      result = result.slice(start);
    }
    return JSON.parse(JSON.stringify(result));
  },

  insert(tableName, row) {
    if (!this.db.tables[tableName]) this.db.tables[tableName] = [];
    if (!row.id) {
      const maxId = this.db.tables[tableName].reduce((max, r) => Math.max(max, r.id || 0), 0);
      row.id = maxId + 1;
    }
    this.db.tables[tableName].push(row);
    this.save();
    return row;
  },

  update(tableName, predicate, updateFn) {
    const table = this.db.tables[tableName] || [];
    let count = 0;
    for (let i = 0; i < table.length; i++) {
      if (predicate(table[i])) {
        table[i] = updateFn(table[i]);
        count++;
      }
    }
    if (count > 0) this.save();
    return count;
  },

  delete(tableName, predicate) {
    const table = this.db.tables[tableName] || [];
    const prevLen = table.length;
    this.db.tables[tableName] = table.filter(r => !predicate(r));
    const removed = prevLen - this.db.tables[tableName].length;
    if (removed > 0) this.save();
    return removed;
  },

  // High-Level Storefront & Studio API
  getProducts(options = {}) {
    const {
      categorySlug,
      categoryId,
      query,
      sort,
      minPrice,
      maxPrice,
      inStockOnly,
      featuredOnly,
      bestsellersOnly,
      flagshipOnly,
      newOnly,
      limit,
      offset
    } = options;

    let targetCatId = categoryId;
    if (categorySlug && !targetCatId) {
      const cat = (this.db.tables.categories || []).find(c => c.slug === categorySlug);
      if (cat) targetCatId = cat.id;
    }

    const predicate = (p) => {
      if (p.status === "archived") return false;
      if (targetCatId && p.category_id !== targetCatId) return false;
      if (featuredOnly && !p.is_featured) return false;
      if (bestsellersOnly && !p.is_bestseller) return false;
      if (flagshipOnly && !p.is_flagship) return false;
      if (newOnly && !p.is_new) return false;
      if (inStockOnly && p.stock <= 0) return false;
      if (minPrice !== undefined && p.price < minPrice) return false;
      if (maxPrice !== undefined && p.price > maxPrice) return false;
      if (query) {
        const q = query.toLowerCase().trim();
        const inName = p.name.toLowerCase().includes(q);
        const inBrand = p.brand.toLowerCase().includes(q);
        const inDesc = p.description.toLowerCase().includes(q);
        const inSku = p.sku.toLowerCase().includes(q);
        const inTags = Array.isArray(p.tags) && p.tags.some(t => t.toLowerCase().includes(q));
        if (!inName && !inBrand && !inDesc && !inSku && !inTags) return false;
      }
      return true;
    };

    let sortFn = null;
    if (sort === "price-asc") {
      sortFn = (a, b) => a.price - b.price;
    } else if (sort === "price-desc") {
      sortFn = (a, b) => b.price - a.price;
    } else if (sort === "rating") {
      sortFn = (a, b) => b.rating - a.rating;
    } else if (sort === "newest") {
      sortFn = (a, b) => (b.is_new ? 1 : 0) - (a.is_new ? 1 : 0) || b.id - a.id;
    } else if (sort === "bestseller") {
      sortFn = (a, b) => (b.is_bestseller ? 1 : 0) - (a.is_bestseller ? 1 : 0);
    } else {
      // Default: featured first, then flagship, then rating
      sortFn = (a, b) => (b.is_flagship ? 1 : 0) - (a.is_flagship ? 1 : 0) || (b.is_featured ? 1 : 0) - (a.is_featured ? 1 : 0) || b.rating - a.rating;
    }

    const allMatched = this.select("products", predicate, sortFn);
    const totalCount = allMatched.length;
    const items = this.select("products", predicate, sortFn, limit, offset);

    return {
      items,
      totalCount
    };
  },

  getProductBySlug(slug) {
    const list = this.select("products", p => p.slug === slug);
    return list.length ? list[0] : null;
  },

  getProductById(id) {
    const list = this.select("products", p => Number(p.id) === Number(id));
    return list.length ? list[0] : null;
  },

  getRelatedProducts(product, limit = 4) {
    if (!product) return [];
    const list = this.select(
      "products",
      p => p.id !== product.id && (p.category_id === product.category_id || (Array.isArray(p.tags) && p.tags.some(t => (product.tags || []).includes(t)))),
      (a, b) => (b.category_id === product.category_id ? 1 : 0) - (a.category_id === product.category_id ? 1 : 0) || b.rating - a.rating,
      limit
    );
    return list;
  },

  getCategories() {
    return this.select("categories", null, (a, b) => a.id - b.id);
  },

  getCategoryBySlug(slug) {
    const list = this.select("categories", c => c.slug === slug);
    return list.length ? list[0] : null;
  },

  getPages(publishedOnly = false) {
    return this.select("pages", page => !publishedOnly || page.published);
  },

  getPageBySlug(slug, publishedOnly = false) {
    const pages = this.select("pages", page => page.slug === slug && (!publishedOnly || page.published));
    return pages[0] || null;
  },

  savePage(data) {
    const slug = String(data.slug || "")
      .toLowerCase()
      .trim()
      .replace(/[^a-z0-9-]+/g, "-")
      .replace(/-+/g, "-")
      .replace(/^-|-$/g, "");
    if (!slug) return { ok: false, error: "Choose a page URL." };
    const conflict = this.getPages().some(page => page.slug === slug && Number(page.id) !== Number(data.id || 0));
    if (conflict) return { ok: false, error: "That page URL is already in use." };

    const pageData = {
      title: String(data.title || "").trim(),
      slug,
      content: String(data.content || ""),
      published: data.published ? 1 : 0,
      updated_at: new Date().toISOString()
    };
    if (!pageData.title) return { ok: false, error: "Enter a page title." };
    let pageId = Number(data.id) || 0;
    if (data.id) {
      this.update("pages", page => Number(page.id) === Number(data.id), page => ({ ...page, ...pageData }));
    } else {
      pageData.created_at = pageData.updated_at;
      pageId = this.insert("pages", pageData).id;
    }
    return { ok: true, id: pageId, slug };
  },

  deletePage(id) {
    return this.delete("pages", page => Number(page.id) === Number(id)) > 0;
  },

  // Cart operations
  getCart() {
    return this.select("cart_items");
  },

  addToCart(productId, quantity = 1, size = null, color = null) {
    const product = this.getProductById(productId);
    if (!product) return false;
    const existing = (this.db.tables.cart_items || []).find(
      item => item.product_id === product.id && item.size === size && item.color === color
    );
    if (existing) {
      existing.quantity += quantity;
    } else {
      this.insert("cart_items", {
        product_id: product.id,
        name: product.name,
        brand: product.brand,
        price: product.price,
        original_price: product.original_price,
        image: product.images && product.images[0] ? product.images[0] : "",
        sku: product.sku,
        size: size || (product.sizes ? product.sizes[0] : null),
        color: color || (product.colors ? product.colors[0] : null),
        quantity: quantity,
        added_at: new Date().toISOString()
      });
    }
    this.save();
    AppController.recordWebEvent("add_to_cart", { product_id: product.id, product_name: product.name, quantity: Number(quantity) || 1 });
    return true;
  },

  updateCartQty(cartItemId, delta) {
    const item = (this.db.tables.cart_items || []).find(i => i.id === cartItemId);
    if (!item) return;
    item.quantity += delta;
    if (item.quantity <= 0) {
      this.delete("cart_items", i => i.id === cartItemId);
    } else {
      this.save();
    }
  },

  removeCartItem(cartItemId) {
    this.delete("cart_items", i => i.id === cartItemId);
  },

  clearCart() {
    this.db.tables.cart_items = [];
    this.save();
  },

  // Favorites
  getFavorites() {
    const favs = this.select("favorites") || [];
    const ids = favs.map(f => f.product_id);
    return this.select("products", p => ids.includes(p.id));
  },

  isFavorite(productId) {
    return (this.db.tables.favorites || []).some(f => f.product_id === productId);
  },

  toggleFavorite(productId) {
    const existing = (this.db.tables.favorites || []).find(f => f.product_id === productId);
    if (existing) {
      this.delete("favorites", f => f.product_id === productId);
      AppController.recordWebEvent("favorite_removed", { product_id: productId, product_name: this.getProductById(productId)?.name || "" });
      return false;
    } else {
      this.insert("favorites", { product_id: productId, added_at: new Date().toISOString() });
      AppController.recordWebEvent("favorite_added", { product_id: productId, product_name: this.getProductById(productId)?.name || "" });
      return true;
    }
  },

  // Orders
  createOrder(orderData, items) {
    const orderNumber = "ORD-" + Math.floor(100000 + Math.random() * 900000);
    const newOrder = {
      order_number: orderNumber,
      ...orderData,
      items: items,
      status: orderData.status || "processing",
      created_at: orderData.created_at || new Date().toISOString()
    };
    const order = this.insert("orders", newOrder);
    AppController.recordWebEvent("order_created", {
      order_id: order.id,
      order_number: order.order_number,
      total: Number(order.total) || 0,
      item_count: items.length
    });

    if (["paid", "completed"].includes(String(newOrder.status).toLowerCase())) {
      items.forEach(item => {
        this.update("products", p => p.id === item.product_id, p => {
          p.stock = Math.max(0, p.stock - (item.quantity || 1));
          return p;
        });
        this.update("inventory", inv => inv.product_id === item.product_id, inv => {
          inv.stock = Math.max(0, inv.stock - (item.quantity || 1));
          inv.status = inv.stock === 0 ? "out_of_stock" : (inv.stock <= inv.low_stock_threshold ? "low_stock" : "in_stock");
          return inv;
        });
      });
    }

    this.clearCart();
    return order;
  },

  getOrder(orderNumber) {
    const list = this.select("orders", o => o.order_number === orderNumber);
    return list.length ? list[0] : null;
  },

  // Store & Settings
  getStore() {
    const list = this.select("store");
    return list.length ? list[0] : {};
  },

  updateStore(updates) {
    this.update("store", () => true, store => {
      const updatedStore = { ...store, ...updates };
      delete updatedStore.mobile_card_layout;
      return updatedStore;
    });
    return this.getStore();
  },

  async resetBuildYourWebDataOnce() {
    if (window.localStorage.getItem(this.builderResetKey) === "1") return;
    this.db.tables.pages = [];
    this.db.tables.hero_slides = [];
    this.updateStore({
      name: storeInfo.name,
      title: storeInfo.title,
      tagline: storeInfo.tagline,
      description: storeInfo.description,
      location: storeInfo.location,
      email: storeInfo.email,
      phone: storeInfo.phone,
      announcement: storeInfo.announcement,
      announcement_active: storeInfo.announcement_active
    });
    this.save();
    await window.ShopSQLite.flush();
    window.localStorage.removeItem(this.storageKey);
    window.localStorage.setItem(this.builderResetKey, "1");
  },

  // Studio CRUD for Products
  saveProduct(data) {
    if (data.id) {
      if (!data.sku) data.sku = this.getProductById(data.id)?.sku || this.generateProductSku();
      this.update("products", p => p.id === Number(data.id), p => ({ ...p, ...data }));
      this.update("inventory", inv => inv.product_id === Number(data.id), inv => ({
        ...inv,
        sku: data.sku || inv.sku,
        stock: Number(data.stock !== undefined ? data.stock : inv.stock),
        cost_price: Number(data.cost_price !== undefined ? data.cost_price : inv.cost_price),
        selling_price: Number(data.price !== undefined ? data.price : inv.selling_price),
        status: (data.stock <= 0) ? "out_of_stock" : (data.stock <= 10 ? "low_stock" : "in_stock")
      }));
      return this.getProductById(data.id);
    } else {
      if (!data.sku) data.sku = this.generateProductSku();
      const slug = (data.name || "new-item").toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/(^-|-$)/g, "");
      const newProduct = {
        ...data,
        slug: slug + "-" + Date.now().toString().slice(-4),
        rating: data.rating ?? 5.0,
        review_count: data.review_count ?? 0,
        status: data.status || "active",
        is_featured: data.is_featured ? 1 : 0,
        is_bestseller: data.is_bestseller ? 1 : 0,
        is_flagship: data.is_flagship ? 1 : 0,
        is_new: data.is_new ?? 1
      };
      const created = this.insert("products", newProduct);
      this.insert("inventory", {
        product_id: created.id,
        sku: created.sku,
        stock: Number(created.stock ?? 10),
        cost_price: Number(created.cost_price ?? 50),
        selling_price: Number(created.price ?? 150),
        low_stock_threshold: 10,
        status: created.stock === 0 ? "out_of_stock" : (created.stock <= 10 ? "low_stock" : "in_stock")
      });
      return created;
    }
  },

  generateProductSku() {
    const existing = new Set(this.select("products").map(product => product.sku).filter(Boolean));
    let sku;
    do {
      const bytes = new Uint8Array(8);
      window.crypto.getRandomValues(bytes);
      sku = `ESHOP-${Array.from(bytes, byte => byte.toString(16).padStart(2, "0")).join("").toUpperCase()}`;
    } while (existing.has(sku));
    return sku;
  },

  deleteProduct(id) {
    this.delete("products", p => p.id === Number(id));
    this.delete("inventory", inv => inv.product_id === Number(id));
    this.delete("favorites", f => f.product_id === Number(id));
    this.delete("cart_items", c => c.product_id === Number(id));
    return true;
  },

  duplicateProduct(id) {
    const source = this.getProductById(id);
    if (!source) return null;
    const copy = JSON.parse(JSON.stringify(source));
    delete copy.id;
    copy.name = copy.name + " (Copy)";
    copy.slug = copy.slug + "-copy-" + Date.now().toString().slice(-4);
    copy.sku = "";
    return this.saveProduct(copy);
  },

  // Category CRUD
  saveCategory(data) {
    const categoryId = data.id ? Number(data.id) : null;
    const baseSlug = (data.name || "category").toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/(^-|-$)/g, "") || "category";
    const usedSlugs = new Set(this.getCategories().filter(c => c.id !== categoryId).map(c => c.slug));
    let slug = baseSlug;
    let suffix = 2;
    while (usedSlugs.has(slug)) slug = `${baseSlug}-${suffix++}`;

    if (data.id) {
      this.update("categories", c => c.id === categoryId, c => ({ ...c, ...data, slug }));
    } else {
      this.insert("categories", { ...data, slug });
    }
    return true;
  },

  deleteCategory(id) {
    this.update("products", p => p.category_id === Number(id), p => ({ ...p, category_id: null }));
    this.delete("categories", c => c.id === Number(id));
    return true;
  },

  // Inventory updates
  updateInventoryStock(productId, newStock) {
    newStock = Math.max(0, Number(newStock));
    this.update("products", p => p.id === Number(productId), p => {
      p.stock = newStock;
      return p;
    });
    this.update("inventory", inv => inv.product_id === Number(productId), inv => {
      inv.stock = newStock;
      inv.status = newStock === 0 ? "out_of_stock" : (newStock <= inv.low_stock_threshold ? "low_stock" : "in_stock");
      return inv;
    });
    return true;
  },

  // Plans
  getPlans() {
    return this.select("plans");
  },

  selectPlan(planSlug) {
    this.update("plans", () => true, p => {
      p.is_current = p.slug === planSlug ? 1 : 0;
      return p;
    });
  }
};

  // Router, SEO, and Core Utilities for Craft
const AppUtils = {
  escapeHTML(str) {
    if (!str) return "";
    return String(str)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");
  },

  async compressImageFile(file, { maxDimension = 1800, maxBytes = 1_500_000 } = {}) {
    if (!(file instanceof Blob) || !file.type.startsWith("image/") || file.size > 5 * 1024 * 1024) {
      throw new Error("Choose an image smaller than 5 MB.");
    }
    let bitmap;
    let objectUrl = "";
    try {
      bitmap = new Image();
      objectUrl = URL.createObjectURL(file);
      bitmap.src = objectUrl;
      await new Promise((resolve, reject) => {
        bitmap.onload = resolve;
        bitmap.onerror = () => reject(new Error("The selected image could not be decoded."));
      });
      const scale = Math.min(1, maxDimension / Math.max(bitmap.width, bitmap.height));
      const canvas = document.createElement("canvas");
      canvas.width = Math.max(1, Math.round(bitmap.width * scale));
      canvas.height = Math.max(1, Math.round(bitmap.height * scale));
      const context = canvas.getContext("2d", { alpha: true });
      if (!context) throw new Error("The selected image could not be compressed.");
      context.drawImage(bitmap, 0, 0, canvas.width, canvas.height);
      let quality = 0.84;
      let blob = await new Promise((resolve, reject) => canvas.toBlob(
        value => value ? resolve(value) : reject(new Error("The selected image could not be compressed.")),
        "image/webp",
        quality
      ));
      while (blob.size > maxBytes && quality > 0.5) {
        quality = Math.max(0.5, quality - 0.12);
        blob = await new Promise((resolve, reject) => canvas.toBlob(
          value => value ? resolve(value) : reject(new Error("The selected image could not be compressed.")),
          "image/webp",
          quality
        ));
      }
      if (blob.size > maxBytes && (canvas.width > 480 || canvas.height > 480)) {
        const reduced = document.createElement("canvas");
        reduced.width = Math.max(1, Math.round(canvas.width * 0.72));
        reduced.height = Math.max(1, Math.round(canvas.height * 0.72));
        const reducedContext = reduced.getContext("2d", { alpha: true });
        if (!reducedContext) throw new Error("The selected image could not be compressed.");
        reducedContext.drawImage(canvas, 0, 0, reduced.width, reduced.height);
        blob = await new Promise((resolve, reject) => reduced.toBlob(
          value => value ? resolve(value) : reject(new Error("The selected image could not be compressed.")),
          "image/webp",
          0.72
        ));
        reduced.width = 0;
        reduced.height = 0;
      }
      if (blob.size > maxBytes) throw new Error("This image is still too large after compression. Choose a smaller photo.");
      return await new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => typeof reader.result === "string"
          ? resolve(reader.result)
          : reject(new Error("The compressed image could not be read."));
        reader.onerror = () => reject(new Error("The compressed image could not be read."));
        reader.readAsDataURL(blob);
      });
    } finally {
      if (objectUrl) URL.revokeObjectURL(objectUrl);
    }
  },

  formatMoney(num) {
    return "$" + Number(num || 0).toLocaleString("en-US", {
      minimumFractionDigits: 0,
      maximumFractionDigits: 2
    });
  },

  showToast(message, type = "success") {
    let container = document.getElementById("toast-container");
    if (!container) {
      container = document.createElement("div");
      container.id = "toast-container";
      container.className = "toast-container";
      document.body.appendChild(container);
    }
    const toast = document.createElement("div");
    toast.className = `toast ${type}`;
    toast.innerHTML = `
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 6L9 17l-5-5"/></svg>
      <span>${this.escapeHTML(message)}</span>
    `;
    container.appendChild(toast);
    setTimeout(() => {
      toast.style.opacity = "0";
      toast.style.transform = "translateY(10px)";
      setTimeout(() => toast.remove(), 300);
    }, 3200);
  },

  updateSEO({ title, description, url, image, schema }) {
    const fullTitle = title.includes("Craft") ? title : `${title} — Craft`;
    document.title = fullTitle;

    const setMeta = (nameOrProp, val, isProp = false) => {
      let el = document.querySelector(isProp ? `meta[property="${nameOrProp}"]` : `meta[name="${nameOrProp}"]`);
      if (!el) {
        el = document.createElement("meta");
        if (isProp) el.setAttribute("property", nameOrProp);
        else el.setAttribute("name", nameOrProp);
        document.head.appendChild(el);
      }
      el.setAttribute("content", val || "");
    };

    setMeta("description", description);
    setMeta("og:title", fullTitle, true);
    setMeta("og:description", description, true);
    setMeta("og:url", url || window.location.href, true);
    if (image) setMeta("og:image", image, true);
    setMeta("twitter:title", fullTitle);
    setMeta("twitter:description", description);

    // Schema JSON-LD
    let script = document.getElementById("structured-data-jsonld");
    if (!script) {
      script = document.createElement("script");
      script.id = "structured-data-jsonld";
      script.type = "application/ld+json";
      document.head.appendChild(script);
    }
    if (schema) {
      script.textContent = JSON.stringify(schema);
    } else {
      script.textContent = JSON.stringify({
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "Craft",
        "url": window.location.origin
      });
    }
  }
};

                <div style="display: flex; align-items: center; gap: 8px; margin-top: 8px;">

              </div>
              <div style="display: flex; align-items: center; gap: 8px;">
                <span style="font-size: 1.75rem; font-weight: 700;">${product.rating.toFixed(1)}</span>
                <div style="font-size: 0.8125rem; color: var(--text-muted);">
                  <div>★★★★★</div>
                  <div>Based on ${product.review_count} client evaluations</div>
                </div>
              </div>
            </div>

            <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px;">
              <div style="background: var(--surface); padding: 24px; border: 1px solid var(--border); border-radius: var(--radius);">
                <div style="display: flex; justify-content: space-between; margin-bottom: 8px;">
                  <span style="font-weight: 600;">Marcus V.</span>
                  <span style="color: var(--text-dim); font-size: 0.8125rem;">2 weeks ago</span>
                </div>
                <div style="color: #D97706; margin-bottom: 8px;">★★★★★</div>

      description: `Search results for ${query} across our luxury editorial catalog.`
    });

    return `
      ${StoreRenderers.renderNavbar()}

          <a href="/" data-route="/">Home</a>
