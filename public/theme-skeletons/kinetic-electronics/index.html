<!doctype html>
<html lang="en" data-eshop-skeleton-preview=""><head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title></title>
  <link rel="stylesheet" href="./eshop-mobile.css?v=3">
<style data-eshop-skeleton-styles="">.eshop-skeleton-bar{display:inline-block;max-width:100%;height:.72em;min-width:2.5em;border-radius:999px;background:var(--theme-kinetic-electronics-color-01);vertical-align:middle}.eshop-placeholder-media{background:linear-gradient(135deg,var(--theme-kinetic-electronics-color-01),var(--theme-kinetic-electronics-color-02));object-fit:cover}</style><style data-theme-tokens="">:root{--theme-kinetic-electronics-color-01:#d1d5db;--theme-kinetic-electronics-color-02:#f3f4f6;}</style></head>
<body>
  <main>
    <script>
      function renderStaticPolicyView() { return '<p>Privacy policy</p>'; }
      function routeHash(hash) {
        if (hash === '#/privacy') {
          this.outlet.innerHTML = renderStaticPolicyView();
        }
      }
    </script>
    <div class="products-grid">
      <article class="product-card"><h2><span class="eshop-skeleton-bar" data-skeleton-text="" style="width: 19%;"></span></h2></article>
      <article class="product-card"><h2><span class="eshop-skeleton-bar" data-skeleton-text="" style="width: 19%;"></span></h2></article>
    </div>
  </main>


<script data-eshop-skeleton-scrubber="">(()=>{if(!document.documentElement.hasAttribute("data-eshop-skeleton-preview"))return;const bar=n=>{if(!n||!n.parentElement||n.parentElement.closest("script,style,noscript,svg,[data-skeleton-text]"))return;const t=n.textContent.trim();if(!/\S/u.test(t))return;const e=document.createElement("span");e.className="eshop-skeleton-bar";e.dataset.skeletonText="";e.style.width=Math.max(8,Math.min(96,Math.round(t.length*2.7)))+"%";n.replaceWith(e)};const clean=r=>{const nodes=[];if(r.nodeType===1)nodes.push(r);if(r.querySelectorAll)nodes.push(...r.querySelectorAll("*"));for(const e of nodes){for(const a of ["alt","title","aria-label","placeholder","value","srcset"])e.removeAttribute(a);if(e.tagName==="IMG"){e.removeAttribute("src");e.classList.add("eshop-placeholder-media")}if(e.hasAttribute("href")&&!e.getAttribute("href").startsWith("#"))e.removeAttribute("href");if(e.hasAttribute("style")&&/url\s*\(/i.test(e.getAttribute("style"))){e.style.backgroundImage="linear-gradient(135deg,#d1d5db,#f3f4f6)"}}if(r.nodeType===3)bar(r);if(r.querySelectorAll){const w=document.createTreeWalker(r,NodeFilter.SHOW_TEXT);let n;while((n=w.nextNode()))bar(n)}};clean(document.body);new MutationObserver(()=>clean(document.body)).observe(document.body,{subtree:true,childList:true,characterData:true,attributes:true,attributeFilter:["alt","title","aria-label","placeholder","value","src","srcset","href","style"]})})();</script></body></html>
