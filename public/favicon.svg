<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" fill="none">
  <title>Blue shopping bag with black shopping cart</title>
  <desc>A simple, bold e-commerce icon designed to stay legible at small favicon sizes.</desc>
  <!-- Twin shopping-bag handles sit behind the bag body. -->
  <path d="M39 37V27.5C39 16.7 46.2 10 56.2 10C66.2 10 73 17.2 73 27.5V37" stroke="#2D91EB" stroke-width="7.5" stroke-linecap="round"/>
  <path d="M59 37V27.5C59 16.7 66.2 10 76.2 10C86.2 10 93 17.2 93 27.5V37" stroke="#2583D9" stroke-width="7.5" stroke-linecap="round"/>
  <!-- Main bag silhouette -->
  <path d="M22 32.5H99.5L110 106.2C110.7 111 107.7 115 102.6 115H18.4C13.3 115 10.4 111 11 106.2L22 32.5Z" fill="#A9DDF8"/>
  <!-- Darker blue side panel adds the folded-paper bag detail. -->
  <path d="M91.5 32.5H99.5L110 106.2C110.7 111 107.7 115 102.6 115H83.4L91.5 32.5Z" fill="#2D91EB"/>
  <path d="M83.4 115L98.2 102.5L110 111.1C108.8 113.6 106.3 115 102.6 115H83.4Z" fill="#176FC5"/>
  <!-- Shopping cart: thick outer stroke and reduced grid detail for legibility. -->
  <g stroke="#050505" stroke-linecap="round" stroke-linejoin="round">
    <path d="M24.5 47.5H34.5L43.2 75.3C43.8 77.5 45.8 79 48.2 79H84.9C87.4 79 89.2 77.6 90 75.1L96.4 53.1H39.3" stroke-width="6.8"/>
    <path d="M42.5 62.5H93.6M48.1 70.7H90.9M59.5 55.1V76.8M76 55.1V76.8" stroke-width="3.9"/>
    <path d="M47.7 84.4C44.6 88.4 46.8 91.5 51.3 91.5H81.6" stroke-width="6.3"/>
  </g>
  <circle cx="52.2" cy="99.1" r="5.1" fill="#050505"/>
  <circle cx="82.5" cy="99.1" r="5.1" fill="#050505"/>
</svg>
